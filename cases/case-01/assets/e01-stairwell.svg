<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5c7286" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#5c7286" stroke-opacity=".28" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a8321f" stroke-width="2.2" stroke-opacity=".8"/>
    </pattern>
    <pattern id="wet" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <line x1="0" y1="0" x2="14" y2="0" stroke="#1f6f8f" stroke-width="1.6" stroke-opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#gridBig)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <!-- пролёт 23-22 в развёртке: ступени -->
  <g stroke="#16202b" stroke-width="2.2" fill="#ded7c6">
    <rect x="140" y="300" width="44" height="250"/><rect x="184" y="300" width="44" height="250"/>
    <rect x="228" y="300" width="44" height="250"/><rect x="272" y="300" width="44" height="250"/>
    <rect x="316" y="300" width="44" height="250"/><rect x="360" y="300" width="44" height="250"/>
    <rect x="404" y="300" width="44" height="250"/><rect x="448" y="300" width="44" height="250"/>
  </g>
  <!-- площадка -->
  <rect x="492" y="300" width="272" height="250" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
  <!-- второй марш -->
  <g stroke="#16202b" stroke-width="2.2" fill="#ded7c6">
    <rect x="764" y="300" width="44" height="250"/><rect x="808" y="300" width="44" height="250"/>
    <rect x="852" y="300" width="44" height="250"/><rect x="896" y="300" width="44" height="250"/>
    <rect x="940" y="300" width="44" height="250"/><rect x="984" y="300" width="44" height="250"/>
    <rect x="1028" y="300" width="44" height="250"/><rect x="1072" y="300" width="44" height="250"/>
  </g>
  <!-- мокрая поверхность ступеней -->
  <rect x="140" y="300" width="976" height="250" fill="url(#wet)" stroke="none"/>

  <!-- стена и перила -->
  <line x1="120" y1="286" x2="1138" y2="286" stroke="#16202b" stroke-width="6"/>
  <text x="120" y="272" font-size="21" fill="#3b4652">стена, краска масляная</text>
  <line x1="120" y1="566" x2="1138" y2="566" stroke="#16202b" stroke-width="3" stroke-dasharray="16 9"/>
  <text x="1000" y="592" font-size="21" fill="#3b4652">перила (высота 0,95 м)</text>

  <!-- дверь 23-го этажа -->
  <rect x="1216" y="300" width="150" height="250" fill="none" stroke="#16202b" stroke-width="3"/>
  <path d="M1216 550 A150 150 0 0 1 1366 400" fill="none" stroke="#1f6f8f" stroke-width="2.4" stroke-dasharray="10 7"/>
  <text x="1216" y="290" font-size="22" fill="#16202b">дверь на 23-й этаж</text>

  <!-- тело (контур) -->
  <g transform="translate(628,425)">
    <ellipse cx="0" cy="-42" rx="26" ry="30" fill="none" stroke="#16202b" stroke-width="3"/>
    <path d="M-34 -12 q34 -18 68 0 l6 92 q-40 16 -80 0 z" fill="none" stroke="#16202b" stroke-width="3"/>
    <path d="M-34 4 l-52 44 M34 4 l54 40" fill="none" stroke="#16202b" stroke-width="3"/>
    <path d="M-18 80 l-12 96 M18 80 l14 96" fill="none" stroke="#16202b" stroke-width="3"/>
  </g>
  <text x="540" y="626" font-size="22" fill="#16202b">положение тела (лицом вниз)</text>

  <!-- лужа под головой -->
  <ellipse cx="628" cy="352" rx="58" ry="26" fill="url(#hatch)" stroke="#a8321f" stroke-width="2.4"/>
  <text x="694" y="346" font-size="21" fill="#a8321f">затёки к стене</text>

  <!-- следы волочения -->
  <g stroke="#a8321f" stroke-width="2.6" fill="none" stroke-dasharray="26 12">
    <path d="M760 470 q110 -14 210 -6"/><path d="M762 500 q112 -10 208 -2"/>
  </g>
  <text x="800" y="530" font-size="21" fill="#a8321f">мазки волочения, 6 шт., направление — из 23-14</text>

  <!-- метки -->
  <g font-size="24" font-weight="600" text-anchor="middle">
    <path d="M600 314 l20 -36 l20 36 z" fill="#e8c33a" stroke="#16202b" stroke-width="2"/><text x="620" y="310" fill="#16202b">1</text>
    <path d="M470 262 l20 -36 l20 36 z" fill="#e8c33a" stroke="#16202b" stroke-width="2"/><text x="490" y="258" fill="#16202b">2</text>
    <path d="M1006 402 l20 -36 l20 36 z" fill="#e8c33a" stroke="#16202b" stroke-width="2"/><text x="1026" y="398" fill="#16202b">3</text>
  </g>

  <!-- выноски -->
  <g font-size="20" fill="#16202b">
    <line x1="490" y1="230" x2="470" y2="150" stroke="#3b4652" stroke-width="1.6"/>
    <text x="330" y="140">2 — капли крови на вертикальной</text><text x="330" y="166">   поверхности подступенка</text>
    <line x1="1026" y1="366" x2="1200" y2="200" stroke="#3b4652" stroke-width="1.6"/>
    <text x="1140" y="188">3 — волокна синего ковролина</text><text x="1140" y="214">   на костюме (не из этого пролёта)</text>
  </g>

  <!-- масштабная линейка -->
  <g transform="translate(140,700)" font-size="20" fill="#16202b">
    <line x1="0" y1="0" x2="400" y2="0" stroke="#16202b" stroke-width="2.4"/>
    <g stroke="#16202b" stroke-width="2.4">
      <line x1="0" y1="-10" x2="0" y2="10"/><line x1="100" y1="-8" x2="100" y2="8"/>
      <line x1="200" y1="-8" x2="200" y2="8"/><line x1="300" y1="-8" x2="300" y2="8"/>
      <line x1="400" y1="-10" x2="400" y2="10"/>
    </g>
    <text x="-6" y="30">0</text><text x="184" y="30">1 м</text><text x="380" y="30">2 м</text>
    <text x="0" y="-26">М 1:50 · развёртка пролёта 22—23 · съёмка 07.02.2025, 06:58</text>
  </g>

  <!-- основная надпись -->
  <g transform="translate(1150,720)">
    <rect width="410" height="140" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
    <line y1="46" x2="410" y2="46" stroke="#16202b" stroke-width="1.8"/>
    <line y1="93" x2="410" y2="93" stroke="#16202b" stroke-width="1.8"/>
    <line x1="150" y1="46" x2="150" y2="140" stroke="#16202b" stroke-width="1.8"/>
    <text x="14" y="32" font-size="22" font-weight="600">Схема 1 к акту осмотра</text>
    <text x="14" y="74" font-size="19">объект</text><text x="164" y="74" font-size="19">пролёт 22—23</text>
    <text x="14" y="121" font-size="19">лист</text><text x="164" y="121" font-size="19">1 из 1 · БЦ «Кристалл»</text>
  </g>
</svg>
