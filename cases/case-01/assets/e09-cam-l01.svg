<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="g9" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7f97a4" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <pattern id="hatch9" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#cfe3e8" stroke-width="2" stroke-opacity=".45"/>
    </pattern>
    <clipPath id="head9"><circle cx="1240" cy="452" r="118"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#101820"/>
  <rect width="1600" height="900" fill="url(#g9)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#3d4e5c" stroke-width="2.5"/>

  <polygon points="150,70 640,70 560,320 240,320" fill="#cfe3e8" fill-opacity=".05"/>
  <text x="60" y="70" font-size="25" fill="#cfe3e8">Схема 7 · главный турникет G-01, кадр 21:40:33</text>
  <text x="60" y="100" font-size="19" fill="#7f97a4">лобби, 1 этаж · конус камеры показан светлым сектором · съёмка сверху, угол 34°</text>

  <!-- стойка ресепшн -->
  <rect x="60" y="330" width="230" height="100" fill="#16202b" stroke="#cfe3e8" stroke-width="2.6"/>
  <text x="76" y="392" font-size="20" fill="#cfe3e8">пост охраны</text>
  <circle cx="120" cy="360" r="13" fill="none" stroke="#cfe3e8" stroke-width="2.2"/>
  <path d="M98 402 q22 -22 44 0" fill="none" stroke="#cfe3e8" stroke-width="2.2"/>

  <!-- линия турникетов -->
  <g stroke="#cfe3e8" stroke-width="2.8" fill="#16202b">
    <rect x="330" y="500" width="86" height="200" rx="12"/>
    <rect x="500" y="500" width="86" height="200" rx="12"/>
    <rect x="670" y="500" width="86" height="200" rx="12"/>
    <rect x="840" y="500" width="86" height="200" rx="12"/>
  </g>
  <g stroke="#cfe3e8" stroke-width="2.4">
    <line x1="416" y1="576" x2="500" y2="576"/><line x1="586" y1="576" x2="670" y2="576"/><line x1="756" y1="576" x2="840" y2="576"/>
  </g>
  <text x="330" y="474" font-size="19" fill="#7f97a4">турникеты 1—4, направление движения — слева направо</text>
  <path d="M340 760 H920" stroke="#1f6f8f" stroke-width="2.6" stroke-dasharray="14 10"/>
  <polygon points="920,752 944,760 920,768" fill="#1f6f8f"/>
  <text x="600" y="792" font-size="20" fill="#1f6f8f">вынос карты С-0007 на считывателе 3</text>

  <!-- считыватель -->
  <rect x="760" y="530" width="34" height="46" fill="none" stroke="#cfe3e8" stroke-width="2.4"/>
  <text x="726" y="618" font-size="18" fill="#7f97a4">С-0007</text>

  <!-- фигура в красном пуховике -->
  <g transform="translate(700,300)">
    <path d="M-44 200 q-14 -186 44 -206 q58 -20 74 34 q26 96 12 172 z" fill="#8e2b1c" stroke="#cfe3e8" stroke-width="2.6"/>
    <path d="M-64 66 q-26 60 -16 118 l38 -8 z" fill="#7a2418" stroke="#cfe3e8" stroke-width="2.4"/>
    <path d="M6 62 q52 -22 58 34 q6 56 -16 88 l-44 -6 z" fill="#7a2418" stroke="#cfe3e8" stroke-width="2.4"/>
    <path d="M-30 -6 q30 -46 62 -8 q6 34 -30 40 q-32 2 -32 -32 z" fill="#6d2115" stroke="#cfe3e8" stroke-width="2.6"/>
    <line x1="-56" y1="300" x2="-30" y2="196" stroke="#cfe3e8" stroke-width="2.6"/>
    <line x1="34" y1="300" x2="22" y2="198" stroke="#cfe3e8" stroke-width="2.6"/>
    <path d="M-64 300 h26 M18 300 h26" stroke="#cfe3e8" stroke-width="4"/>
  </g>
  <text x="466" y="196" font-size="21" fill="#cfe3e8">фигура 2: капюшон натянут,</text>
  <text x="466" y="222" font-size="21" fill="#cfe3e8">тёмный шарф до носа, очков нет</text>

  <!-- пунктирный Смолин -->
  <g stroke-dasharray="10 8" stroke="#9db4bd" stroke-width="2.4" fill="none" transform="translate(980,352)">
    <path d="M-38 168 q-10 -152 38 -170 q46 -16 58 30 q20 84 8 140 z"/>
    <circle cx="4" cy="-16" r="34"/>
    <path d="M-14 -22 h18 M10 -22 h18 M4 -22 v8" stroke-width="2"/>
  </g>
  <text x="944" y="176" font-size="21" fill="#cfe3e8">Смолин Г. А. — 173 см, очки</text>
  <text x="944" y="202" font-size="21" fill="#cfe3e8">с широкой оправой, всегда в них</text>
  <text x="944" y="228" font-size="21" fill="#cfe3e8">пунктиром, для сравнения</text>

  <!-- шкала роста -->
  <g stroke="#cfe3e8" stroke-width="2.2" fill="#cfe3e8" font-size="18">
    <line x1="1216" y1="180" x2="1216" y2="700"/>
    <line x1="1200" y1="700" x2="1232" y2="700"/><text x="1136" y="706">0</text>
    <line x1="200" y1="530" x2="1232" y2="530" stroke-dasharray="16 12" stroke-opacity=".5"/>
    <text x="1244" y="536">150 см</text>
    <line x1="200" y1="344" x2="1232" y2="344" stroke-dasharray="16 12" stroke-opacity=".5"/>
    <text x="1244" y="350">175 см</text>
    <line x1="1200" y1="262" x2="1232" y2="262" stroke="#e8c33a" stroke-width="3"/>
    <text x="1244" y="268" fill="#e8c33a">макушка — 180 см</text>
  </g>
  <line x1="640" y1="262" x2="1200" y2="262" stroke="#e8c33a" stroke-width="2.4" stroke-dasharray="10 10"/>
  <text x="760" y="846" font-size="21" fill="#cfe3e8">Рост по отметке стены 180 ± 3 см. Шаг обычный, сумки нет, правая рука свободна.</text>
  <text x="760" y="874" font-size="21" fill="#cfe3e8">Лицо не читается: капюшон + шарф, разрешение кадра по лицу 42 px.</text>

  <!-- врезка -->
  <circle cx="1240" cy="452" r="118" fill="#101820" stroke="#cfe3e8" stroke-width="3"/>
  <g clip-path="url(#head9)">
    <path d="M1180 560 q-16 -104 40 -124 q56 -18 72 30 q18 62 4 94 z" fill="#8e2b1c" stroke="#cfe3e8" stroke-width="2.4"/>
    <path d="M1196 400 q28 -44 62 -8 q6 32 -28 38 q-32 2 -34 -30 z" fill="#6d2115" stroke="#cfe3e8" stroke-width="2.4"/>
    <path d="M1200 470 q34 16 62 0" fill="none" stroke="#cfe3e8" stroke-width="2.2" stroke-opacity=".55"/>
  </g>
  <text x="1122" y="612" font-size="19" fill="#7f97a4">увеличение 200 %</text>
  <line x1="1140" y1="404" x2="790" y2="316" stroke="#cfe3e8" stroke-width="1.8" stroke-dasharray="9 7"/>
</svg>
