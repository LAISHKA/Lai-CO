<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="g20b" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5c7286" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <pattern id="bloodb" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a8321f" stroke-width="3" stroke-opacity=".7"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#g20b)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="72" font-size="26" fill="#16202b">Схема 2 · бытовка цеха № 4 (помещение 4-12)</text>
  <text x="60" y="102" font-size="19" fill="#3b4652">вид сверху, М 1:25 · снята 15.03.2025 в 06:40, обстановка не тронута</text>

  <!-- помещение -->
  <rect x="250" y="180" width="900" height="500" fill="#ded7c6" fill-opacity=".5"/>
  <path d="M250 180 H1150 V680 H250 Z" fill="none" stroke="#16202b" stroke-width="7"/>

  <!-- дверь в тамбур -->
  <path d="M1150 470 v6" stroke="#16202b" stroke-width="7"/>
  <path d="M1150 476 A92 92 0 0 1 1058 568" fill="none" stroke="#1f6f8f" stroke-width="2.6" stroke-dasharray="11 7"/>
  <text x="980" y="640" font-size="20" fill="#1f6f8f">дверь в тамбур 4-7,</text>
  <text x="980" y="662" font-size="20" fill="#a8321f">на внутренней стороне ручки — кровь</text>

  <!-- стол -->
  <rect x="400" y="330" width="480" height="170" rx="8" fill="#c9bfa6" stroke="#16202b" stroke-width="3.4"/>
  <text x="412" y="320" font-size="21" fill="#16202b">стол производственный, 1,80 м, у южной стены</text>
  <!-- кровь на левом переднем углу -->
  <polygon points="400,500 470,500 400,432" fill="url(#bloodb)" stroke="#a8321f" stroke-width="2.6"/>
  <path d="M406 500 v44 M420 500 v28" stroke="#a8321f" stroke-width="3"/>
  <circle cx="414" cy="562" r="9" fill="#a8321f"/>
  <text x="336" y="600" font-size="20" fill="#a8321f">кровь и ткани: левый передний угол,</text>
  <text x="336" y="622" font-size="20" fill="#a8321f">2 потёка вниз по торцу, капля на полу в 30 см</text>

  <!-- монитор, клавиатура, очки -->
  <rect x="560" y="356" width="150" height="20" fill="#16202b"/>
  <rect x="620" y="376" width="30" height="24" fill="#16202b"/>
  <text x="730" y="372" font-size="19" fill="#16202b">монитор погашен</text>
  <rect x="540" y="420" width="170" height="46" rx="5" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
  <g stroke="#16202b" stroke-width="2.4" fill="none">
    <circle cx="586" cy="443" r="15"/><circle cx="626" cy="443" r="15"/>
    <path d="M601 443 h10"/><path d="M571 437 l-16 -6"/>
  </g>
  <text x="730" y="446" font-size="19" fill="#a8321f">оправа очков на клавиатуре,</text>
  <text x="730" y="466" font-size="19" fill="#a8321f">нет одного заушника</text>

  <!-- чашка, пачка -->
  <circle cx="820" cy="470" r="17" fill="none" stroke="#1f6f8f" stroke-width="3"/>
  <text x="836" y="456" font-size="19" fill="#1f6f8f">чашка: заварка 40 мл,</text>
  <text x="836" y="476" font-size="19" fill="#1f6f8f">следов губной помады нет</text>
  <rect x="430" y="352" width="52" height="34" rx="4" fill="#f4efe2" stroke="#16202b" stroke-width="2.4"/>
  <text x="430" y="410" font-size="18" fill="#3b4652">пачка «Ява»</text>

  <!-- стулья -->
  <circle cx="620" cy="580" r="44" fill="none" stroke="#16202b" stroke-width="3"/>
  <path d="M620 624 h52" stroke="#16202b" stroke-width="3"/>
  <text x="540" y="668" font-size="19" fill="#3b4652">стул отодвинут, стоит боком</text>
  <circle cx="620" cy="262" r="40" fill="none" stroke="#16202b" stroke-width="2.6" stroke-dasharray="9 7"/>
  <text x="540" y="222" font-size="19" fill="#3b4652">второй стул придвинут</text>

  <!-- стеллаж с папками -->
  <rect x="940" y="200" width="180" height="80" fill="#c9bfa6" stroke="#16202b" stroke-width="3"/>
  <path d="M940 240 h180" stroke="#16202b" stroke-width="2"/>
  <rect x="956" y="212" width="18" height="20" fill="#f4efe2" stroke="#16202b" stroke-width="1.8"/>
  <rect x="978" y="212" width="18" height="20" fill="#f4efe2" stroke="#16202b" stroke-width="1.8"/>
  <text x="906" y="316" font-size="20" fill="#16202b">стеллаж исполнительных документов</text>
  <text x="906" y="338" font-size="20" fill="#a8321f">папка «КС-47» раскрыта и пуста</text>

  <!-- флешка -->
  <rect x="470" y="530" width="34" height="14" rx="3" fill="none" stroke="#e8c33a" stroke-width="3"/>
  <text x="470" y="512" font-size="19" fill="#16202b">флешка 16 ГБ с биркой «КС-47»</text>

  <!-- шкаф и журнал -->
  <rect x="270" y="210" width="90" height="150" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
  <text x="262" y="392" font-size="19" fill="#3b4652">шкаф и вешалка:</text>
  <text x="262" y="414" font-size="19" fill="#3b4652">костюм Дронова,</text>
  <text x="262" y="436" font-size="19" fill="#a8321f">правый ботинок 43-го</text>
  <text x="262" y="458" font-size="19" fill="#a8321f">слева — второй ботинок нет</text>

  <!-- размеры -->
  <g stroke="#1f6f8f" stroke-width="2" fill="#1f6f8f" font-size="19">
    <line x1="250" y1="726" x2="1150" y2="726"/>
    <line x1="250" y1="714" x2="250" y2="738"/><line x1="1150" y1="714" x2="1150" y2="738"/>
    <text x="640" y="756">5,20 м</text>
    <line x1="1230" y1="180" x2="1230" y2="680"/>
    <line x1="1218" y1="180" x2="1242" y2="180"/><line x1="1218" y1="680" x2="1242" y2="680"/>
    <text x="1252" y="436">3,40 м</text>
  </g>

  <g font-size="19" fill="#16202b">
    <text x="1290" y="216">Выключатель светильника — «вкл»,</text>
    <text x="1290" y="240">но фидер ЩУ-4 обесточен с 22:41.</text>
    <text x="1290" y="276">Следов волочения по полу внутри нет.</text>
    <text x="1290" y="300">Запаха растворителя нет.</text>
    <text x="1290" y="336">В корзине — 2 окурка «Прима»,</text>
    <text x="1290" y="360">в цехе курят «Яву».</text>
    <text x="1290" y="396" fill="#a8321f">Электричества в бытовке не было</text>
    <text x="1290" y="420" fill="#a8321f">уже 31 минуту — свет в окне цеха</text>
    <text x="1290" y="444" fill="#a8321f"> Сычёв видел до 22:35.</text>
  </g>

  <g transform="translate(1150,872)">
    <rect x="-410" y="-96" width="410" height="96" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
    <line x1="-410" y1="-50" x2="0" y2="-50" stroke="#16202b" stroke-width="1.8"/>
    <line x1="-260" y1="-50" x2="-260" y2="0" stroke="#16202b" stroke-width="1.8"/>
    <text x="-396" y="-66" font-size="21" font-weight="600">Схема 2 к протоколу осмотра, помещение 4-12</text>
    <text x="-396" y="-18" font-size="18">М 1:25 · 15.03.2025, 06:40</text>
    <text x="-246" y="-18" font-size="18">составил: Шелест Р. Ю.</text>
  </g>
</svg>
