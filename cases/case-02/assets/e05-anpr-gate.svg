<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="g9a" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7f97a4" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <pattern id="hatchA" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#cfe3e8" stroke-width="2" stroke-opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#101820"/>
  <rect width="1600" height="900" fill="url(#g9a)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#3d4e5c" stroke-width="2.5"/>

  <!-- camera view cone (top-left free for header) -->
  <polygon points="1470,90 1560,90 1560,560 1200,660" fill="#cfe3e8" fill-opacity=".05"/>
  <text x="60" y="72" font-size="25" fill="#cfe3e8">CAM КПП-1 · ANPR · въезд/выезд, кадр 19:35:07</text>
  <text x="60" y="102" font-size="19" fill="#7f97a4">ворота со стороны посёлка, морось, ИК-подсветка включена 19:34:52</text>

  <!-- road -->
  <path d="M0 700 L1600 610 L1600 900 L0 900 Z" fill="#182430"/>
  <g stroke="#9db4bd" stroke-width="3" stroke-opacity=".55" stroke-dasharray="46 34">
    <line x1="60" y1="790" x2="1540" y2="706"/>
  </g>
  <text x="60" y="690" font-size="17" fill="#7f97a4">проезжая часть, направление движения — слева направо (на выезд)</text>

  <!-- guard house + barrier -->
  <g stroke="#cfe3e8" stroke-width="3" fill="#1d2b36">
    <rect x="1180" y="330" width="300" height="250"/>
    <rect x="1216" y="366" width="118" height="86" fill="#24384a"/>
  </g>
  <text x="1196" y="612" font-size="18" fill="#7f97a4">домик охраны, оператор Постников</text>
  <g>
    <rect x="946" y="470" width="30" height="140" fill="#24384a" stroke="#cfe3e8" stroke-width="3"/>
    <line x1="960" y1="486" x2="500" y2="360" stroke="#e8c33a" stroke-width="9"/>
    <g stroke="#e8c33a" stroke-width="3">
      <line x1="880" y1="454" x2="880" y2="410"/>
      <line x1="790" y1="428" x2="790" y2="386"/>
      <line x1="700" y1="402" x2="700" y2="360"/>
      <line x1="610" y1="376" x2="610" y2="336"/>
    </g>
    <text x="614" y="318" font-size="18" fill="#e8c33a">шлагбаум поднят (выезд по распознаванию)</text>
  </g>

  <!-- UAZ, three-quarter rear, moving out -->
  <g stroke="#cfe3e8" stroke-width="3.2" fill="#2b3f52">
    <path d="M300 560 L360 452 H700 L770 520 L800 596 H320 Z"/>
    <rect x="392" y="470" width="120" height="70" fill="#1a2833"/>
    <rect x="530" y="470" width="120" height="70" fill="#1a2833"/>
    <rect x="666" y="480" width="80" height="60" fill="#1a2833"/>
    <circle cx="420" cy="606" r="46" fill="#101820"/>
    <circle cx="690" cy="600" r="46" fill="#101820"/>
    <circle cx="420" cy="606" r="19" fill="#24384a"/>
    <circle cx="690" cy="600" r="19" fill="#24384a"/>
  </g>
  <rect x="742" y="530" width="86" height="42" fill="#cfe3e8" fill-opacity=".9" stroke="none"/>
  <text x="748" y="558" font-size="19" fill="#101820" font-weight="700">Дубрава</text>
  <text x="300" y="676" font-size="18" fill="#7f97a4">УАЗ 31514, синий, борт с магнитной наклейкой «Дубрава»</text>

  <!-- plate zoom -->
  <g>
    <line x1="612" y1="572" x2="700" y2="742" stroke="#1f6f8f" stroke-width="2.6"/>
    <line x1="972" y1="572" x2="1160" y2="742" stroke="#1f6f8f" stroke-width="2.6"/>
    <rect x="680" y="742" width="560" height="112" fill="#182430" stroke="#cfe3e8" stroke-width="3"/>
    <text x="712" y="812" font-size="46" font-weight="700" fill="#cfe3e8" letter-spacing="3">Х-117 · 16 RUS</text>
    <text x="1258" y="790" font-size="19" fill="#7f97a4">увеличение</text>
    <text x="1258" y="814" font-size="19" fill="#7f97a4">200 %</text>
  </g>

  <!-- detection box -->
  <rect x="288" y="430" width="524" height="240" fill="none" stroke="#e8c33a" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="288" y="418" font-size="18" fill="#e8c33a">объект распознан · тип: легковой/full-size · совпадение 0,94</text>

  <!-- conclusions (right, bottom-right free of left corner) -->
  <g font-size="18" fill="#cfe3e8">
    <text x="60" y="164" font-size="20" font-weight="700" fill="#e8c33a">Что видно и чего не видно</text>
    <text x="60" y="196">1. Это последний кадр с УАЗом за 14 марта.</text>
    <text x="60" y="220">2. Въезда обратно в журнале нет — ни 19:35,</text>
    <text x="60" y="244">ни позже до 06:00 15.03.</text>
    <text x="60" y="272">3. Булычёв строит алиби на этом кадре:</text>
    <text x="60" y="296">«уехал в 19:35 — и весь вечер дома».</text>
    <text x="60" y="324">4. Камера видит только КПП-1. Южный лаз</text>
    <text x="60" y="348">в заборе ей не доступен (см. e06).</text>
  </g>
  <g font-size="18" fill="#9db4bd">
    <text x="812" y="164">Журнал ANPR за ночь, выгрузка с сервера «Тритон-К»:</text>
    <text x="812" y="196">В-204 («Нива», Дронов) — въезд 08:12:04, выезд — нет</text>
    <text x="812" y="220">Х-117 (УАЗ, Булычёв) — выезд 19:35:07, возврат — нет</text>
    <text x="812" y="244">В-896 (Ясенева) — выезд 18:40:19</text>
    <text x="812" y="268">«Ларгус» (Суханов) — выезд 22:10:31, возврат 07:04:12</text>
    <text x="812" y="292">Пешеходов через КПП-1 за ночь — 0</text>
    <text x="812" y="324" fill="#cfe3e8">Целость: хэш-лист выгрузки совпал с серверной копией</text>
  </g>

  <!-- scale -->
  <g stroke="#7f97a4" stroke-width="2" fill="#7f97a4" font-size="16">
    <line x1="1520" y1="140" x2="1520" y2="380"/>
    <line x1="1506" y1="140" x2="1534" y2="140"/>
    <line x1="1506" y1="380" x2="1534" y2="380"/>
    <text x="1462" y="266" stroke="none" transform="rotate(-90 1470 266)">2,40 м — рама ворот</text>
  </g>
</svg>
