<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="g9b" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7f97a4" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <pattern id="brickB" width="34" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0H34M0 9H34M17 0V9M0 9V18M34 9V18" fill="none" stroke="#cfe3e8" stroke-opacity=".18" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="irB" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#cfe3e8" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#cfe3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#101820"/>
  <rect width="1600" height="900" fill="url(#g9b)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#3d4e5c" stroke-width="2.5"/>

  <text x="60" y="72" font-size="25" fill="#cfe3e8">CAM З-02 · западные ворота · южный торец цеха № 4, кадр 23:22:41</text>
  <text x="60" y="102" font-size="19" fill="#7f97a4">инфракрасная подсветка, морось, лампа над КПП-2 перегорела 09.03 (акт)</text>

  <ellipse cx="820" cy="470" rx="640" ry="330" fill="url(#irB)"/>

  <!-- цех, южная стена -->
  <g>
    <rect x="180" y="150" width="980" height="360" fill="url(#brickB)" stroke="#cfe3e8" stroke-width="3"/>
    <path d="M180 150 L670 70 L1160 150" fill="none" stroke="#cfe3e8" stroke-width="3"/>
    <rect x="470" y="300" width="150" height="210" fill="#1d2b36" stroke="#cfe3e8" stroke-width="3"/>
    <text x="430" y="540" font-size="17" fill="#7f97a4">дверь тамбура 4-7 (со стороны цеха)</text>
    <rect x="900" y="230" width="120" height="90" fill="#24384a" stroke="#cfe3e8" stroke-width="2.6"/>
    <text x="880" y="222" font-size="16" fill="#7f97a4">окно склада, изнутри закрыто</text>
  </g>

  <!-- забор с южной стороны + лаз -->
  <g stroke="#cfe3e8" stroke-width="3" fill="none">
    <line x1="60" y1="700" x2="1540" y2="640"/>
    <line x1="60" y1="596" x2="1540" y2="536"/>
    <g stroke-width="2.2" stroke-opacity=".7">
      <line x1="150" y1="590" x2="150" y2="694"/>
      <line x1="260" y1="586" x2="260" y2="690"/>
      <line x1="370" y1="582" x2="370" y2="686"/>
      <line x1="480" y1="578" x2="480" y2="682"/>
      <line x1="1180" y1="556" x2="1180" y2="660"/>
      <line x1="1300" y1="551" x2="1300" y2="655"/>
      <line x1="1420" y1="546" x2="1420" y2="650"/>
    </g>
  </g>
  <g>
    <rect x="596" y="556" width="150" height="128" fill="#101820" stroke="#e8c33a" stroke-width="3" stroke-dasharray="12 8"/>
    <path d="M604 640 q30 -34 60 -6 t56 -12" fill="none" stroke="#e8c33a" stroke-width="3"/>
    <text x="596" y="712" font-size="18" fill="#e8c33a">лаз в заборе: секция выгнута наружу, засова нет с 2023 г.</text>
    <rect x="762" y="584" width="54" height="20" fill="#24384a" stroke="#cfe3e8" stroke-width="2.4"/>
    <text x="756" y="576" font-size="16" fill="#7f97a4">приваренная скоба</text>
  </g>

  <!-- figure, walking left to right -->
  <g>
    <g fill="#8e2b1c" stroke="#cfe3e8" stroke-width="2.6">
      <path d="M998 356 a30 30 0 0 1 30 34 l-8 40 h-44 l-8 -40 a30 30 0 0 1 30 -34 z"/>
      <path d="M950 430 h104 l16 148 h-40 l-14 -86 -18 86 h-40 l-6 -148 z"/>
      <path d="M1054 452 l46 74 -34 20 -34 -66 z"/>
    </g>
    <g fill="#7a2118" stroke="#cfe3e8" stroke-width="2.4">
      <path d="M964 578 l14 108 -6 34 h44 l-6 -40 -4 -102 z"/>
      <path d="M1014 580 l22 100 4 36 h42 l-14 -40 -20 -96 z"/>
    </g>
    <path d="M962 578 l-4 42 46 6 2 -44" fill="none" stroke="#cfe3e8" stroke-width="2" stroke-opacity=".6"/>
    <g fill="#e8c33a" stroke="none">
      <path d="M946 470 h116 l3 22 h-122 z"/>
      <path d="M1002 430 l26 0 -4 132 -22 0 z" fill-opacity=".55"/>
    </g>
    <text x="1112" y="470" font-size="18" fill="#e8c33a">светоотражающая полоса</text>
    <text x="1112" y="494" font-size="18" fill="#e8c33a">по низу куртки и через плечо</text>
  </g>

  <!-- gait marks -->
  <g fill="#9db4bd" stroke="none">
    <ellipse cx="962" cy="726" rx="26" ry="9"/>
    <ellipse cx="1012" cy="742" rx="26" ry="9" fill-opacity=".7"/>
    <ellipse cx="1046" cy="712" rx="26" ry="9"/>
    <ellipse cx="1096" cy="728" rx="26" ry="9" fill-opacity=".7"/>
  </g>
  <text x="930" y="774" font-size="17" fill="#9db4bd">шаг короткий, правая нога ставится на наружный край</text>

  <!-- height scale -->
  <g stroke="#7f97a4" stroke-width="2.4">
    <line x1="820" y1="352" x2="820" y2="640"/>
    <g stroke-dasharray="16 12" stroke-opacity=".5">
      <line x1="820" y1="352" x2="944" y2="352"/>
      <line x1="820" y1="418" x2="900" y2="418"/>
      <line x1="820" y1="484" x2="900" y2="484"/>
    </g>
  </g>
  <g font-size="17" fill="#7f97a4" stroke="none">
    <text x="742" y="346">188 см</text>
    <text x="742" y="414">160 см</text>
    <text x="742" y="480">130 см</text>
  </g>
  <line x1="820" y1="352" x2="962" y2="352" stroke="#e8c33a" stroke-width="4"/>
  <text x="600" y="336" font-size="19" fill="#e8c33a" font-weight="700">макушка — 185…188 см</text>

  <!-- conclusions -->
  <g font-size="18" fill="#cfe3e8">
    <text x="1196" y="164" font-size="20" font-weight="700" fill="#e8c33a">По кадрам 23:20:18 — 23:26:05</text>
    <text x="1196" y="196">Идёт от стоянки служебного</text>
    <text x="1196" y="220">транспорта к южному торцу.</text>
    <text x="1196" y="252">Скорость 0,8 м/с, у двери</text>
    <text x="1196" y="276">замедляется до 0,3 м/с.</text>
    <text x="1196" y="308">Капюшон накинут, лицо</text>
    <text x="1196" y="332">отвёрнуто на два кадра.</text>
    <text x="1196" y="364">В руке — предмет размером</text>
    <text x="1196" y="388">с канистру, правее бедра.</text>
    <text x="1196" y="420">Обувь тёмная, низкий каблук,</text>
    <text x="1196" y="444">не резиновые сапоги.</text>
    <text x="1196" y="476">В 23:26 уходит за угол склада</text>
    <text x="1196" y="500">и в кадр больше не возвращается.</text>
  </g>
  <text x="1196" y="546" font-size="18" fill="#9db4bd">Рост 186; Булычёв — 186 см, 44 р.</text>
  <text x="1196" y="570" font-size="18" fill="#9db4bd">Сычёв ушёл через КПП-2 в 22:35:41.</text>
  <text x="1196" y="594" font-size="18" fill="#9db4bd">Подгорный в эти минуты в кадре поста.</text>
</svg>
