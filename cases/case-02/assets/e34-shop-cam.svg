<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="g9c" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7f97a4" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <pattern id="shelfC" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 26 L26 0" fill="none" stroke="#cfe3e8" stroke-opacity=".14" stroke-width="2"/>
    </pattern>
    <radialGradient id="lampC" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#cfe3e8" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#cfe3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#101820"/>
  <rect width="1600" height="900" fill="url(#g9c)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#3d4e5c" stroke-width="2.5"/>

  <text x="60" y="72" font-size="25" fill="#cfe3e8">CAM ЗАЛ-2 · магазин «Стройподряд», пос. Стеклянный · 14.03.2025, 20:52:19</text>
  <text x="60" y="102" font-size="19" fill="#7f97a4">обзор на кассу 2 и стеллаж гидроизоляции; освещение торговое, людей в зале двое</text>

  <polygon points="150,120 520,120 700,470 60,470" fill="#cfe3e8" fill-opacity=".05"/>
  <text x="66" y="146" font-size="16" fill="#7f97a4">конус обзора CAM ЗАЛ-2</text>

  <!-- back wall shelves -->
  <g stroke="#cfe3e8" stroke-width="2.6" fill="url(#shelfC)">
    <rect x="120" y="200" width="470" height="180"/>
    <rect x="120" y="400" width="470" height="120"/>
  </g>
  <g stroke="#cfe3e8" stroke-width="2" fill="#24384a">
    <rect x="146" y="228" width="86" height="130" rx="4"/>
    <rect x="246" y="228" width="86" height="130" rx="4"/>
    <rect x="346" y="228" width="86" height="130" rx="4"/>
    <rect x="446" y="228" width="86" height="130" rx="4"/>
    <rect x="146" y="424" width="180" height="76" rx="4"/>
    <rect x="346" y="424" width="180" height="76" rx="4"/>
  </g>
  <g font-size="15" fill="#9db4bd" stroke="none">
    <text x="164" y="300">плёнка</text><text x="172" y="322">150 мкм</text>
    <text x="264" y="300">плёнка</text><text x="272" y="322">150 мкм</text>
    <text x="364" y="300">плёнка</text><text x="372" y="322">60 мкм</text>
    <text x="464" y="300">рубероид</text>
    <text x="176" y="470">скотч ПВХ, 12 бухт</text>
    <text x="376" y="470">лента синяя 48 мм</text>
  </g>
  <ellipse cx="360" cy="200" rx="330" ry="120" fill="url(#lampC)"/>

  <!-- counter with terminal -->
  <g stroke="#cfe3e8" stroke-width="3" fill="#1d2b36">
    <rect x="700" y="470" width="560" height="150"/>
    <rect x="1130" y="392" width="96" height="72" rx="6"/>
  </g>
  <text x="1118" y="382" font-size="16" fill="#7f97a4">терминал оплаты картой</text>
  <g font-size="17" fill="#9db4bd" stroke="none">
    <text x="716" y="512">касса 2</text>
    <text x="716" y="596">чек № 2214 · 20:52:19 · 1 476,00 ₽</text>
  </g>

  <!-- buyer at counter with two rolls and tape -->
  <g>
    <g fill="#8e2b1c" stroke="#cfe3e8" stroke-width="2.6">
      <path d="M886 300 a28 28 0 0 1 28 32 l-8 38 h-40 l-8 -38 a28 28 0 0 1 28 -32 z"/>
      <path d="M842 372 h98 l14 140 h-38 l-12 -80 -16 80 h-38 l-4 -140 z"/>
      <path d="M846 396 l-52 52 30 26 46 -50 z"/>
      <path d="M938 396 l54 44 -28 28 -48 -44 z"/>
    </g>
    <g fill="#7a2118" stroke="#cfe3e8" stroke-width="2.4">
      <path d="M856 512 l8 118 -4 30 h40 l-6 -34 -4 -114 z"/>
      <path d="M902 512 l18 112 2 36 h40 l-10 -38 -14 -110 z"/>
    </g>
    <path d="M838 408 h112 l4 20 h-120 z" fill="#e8c33a" stroke="none"/>
    <text x="982" y="424" font-size="17" fill="#e8c33a">полоса на куртке</text>
  </g>

  <!-- goods in hands -->
  <g stroke="#cfe3e8" stroke-width="2.6" fill="#24384a">
    <ellipse cx="786" cy="452" rx="20" ry="46"/>
    <ellipse cx="826" cy="452" rx="20" ry="46"/>
    <rect x="984" y="466" width="72" height="26" rx="6"/>
  </g>
  <text x="700" y="392" font-size="17" fill="#9db4bd">2 рулона плёнки 150 мкм</text>
  <text x="980" y="516" font-size="17" fill="#9db4bd">синяя ПВХ-лента 48 мм</text>

  <!-- height reference on door frame -->
  <g stroke="#7f97a4" stroke-width="2.4">
    <line x1="1330" y1="150" x2="1330" y2="620"/>
    <g stroke-dasharray="16 12" stroke-opacity=".5">
      <line x1="1330" y1="150" x2="1440" y2="150"/>
      <line x1="1330" y1="238" x2="1420" y2="238"/>
      <line x1="1330" y1="326" x2="1420" y2="326"/>
    </g>
  </g>
  <g font-size="17" fill="#7f97a4" stroke="none">
    <text x="1446" y="156">200 см (косяк двери)</text>
    <text x="1426" y="244">185 см</text>
    <text x="1426" y="332">160 см</text>
  </g>
  <line x1="1330" y1="238" x2="922" y2="238" stroke="#e8c33a" stroke-width="4" stroke-dasharray="20 14"/>
  <text x="1010" y="228" font-size="19" fill="#e8c33a" font-weight="700">макушка — 185…188 см</text>

  <!-- conclusions -->
  <g font-size="18" fill="#cfe3e8">
    <text x="60" y="648" font-size="20" font-weight="700" fill="#e8c33a">Что даёт этот кадр</text>
    <text x="60" y="680">1. Покупка 20:52:19 — чек № 2214 на карту, владелец карты — Булычёв Р. С.</text>
    <text x="60" y="704">2. Товар совпал с узлами на складе: плёнка 150 мкм = колпак на датчике, лента 48 мм = два витка на извещателе.</text>
    <text x="60" y="728">3. Куртка со светоотражающей полосой — та же, что на CAM З-02 в 23:22 и в описании Куприна.</text>
  </g>
  <g font-size="18" fill="#9db4bd">
    <text x="820" y="700" font-size="20" font-weight="700" fill="#cfe3e8">Кассир Барсукова И. Л. (опознала по фото)</text>
    <text x="820" y="732">«Заходил один, минут за десять до закрытия.</text>
    <text x="820" y="756">Просил именно рукав, а не плёнку в рулоне.</text>
    <text x="820" y="780">Сказал: на стружку, подсушить ангар».</text>
  </g>
</svg>
