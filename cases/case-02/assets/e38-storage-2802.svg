<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="g20d" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#5c7286" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <pattern id="hatchd" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3b4652" stroke-width="2.2" stroke-opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#g20d)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="80" font-size="30" font-weight="700" fill="#16202b">Склад ЛКМ (помещение 4-8). Фотофиксация к акту «Автоматика-Сервис»</text>
  <text x="60" y="114" font-size="21" fill="#3b4652">съёмка 28.02.2025, 11:20 — планомерное обслуживание АУПТ. То же оборудование 15.03.2025 — в скобках</text>

  <!--Room -->
  <path d="M200 170 H1150 V720 H200 Z" fill="#ded7c6" fill-opacity=".5" stroke="#16202b" stroke-width="7"/>

  <!--Wall devices: detector + sprinkler -->
  <g>
    <line x1="200" y1="330" x2="1150" y2="330" stroke="#3b4652" stroke-width="1.6" stroke-dasharray="9 7"/>
    <text x="212" y="322" font-size="17" fill="#3b4652">условная линия потолка</text>

    <!--smoke detector, open -->
    <g transform="translate(330,300)">
      <circle r="34" fill="#f4efe2" stroke="#16202b" stroke-width="3.4"/>
      <circle r="13" fill="none" stroke="#16202b" stroke-width="2.4"/>
      <path d="M-34 -14 A36 36 0 0 1 34 -14" fill="none" stroke="#2c7a3f" stroke-width="4"/>
      <text x="-58" y="-48" font-size="19" font-weight="600" fill="#16202b">Извещатель ИП-212/2, ШС-2/6</text>
      <text x="-58" y="-24" font-size="18" fill="#2c7a3f">открыт, сетка приёмных окон чистая (15.03 — под колпаком)</text>
    </g>

    <!--sprinkler, clean -->
    <g transform="translate(640,300)">
      <line x1="0" y1="-40" x2="0" y2="-6" stroke="#16202b" stroke-width="4"/>
      <path d="M-22 -6 H22 L14 12 H-14 Z" fill="#f4efe2" stroke="#16202b" stroke-width="3.2"/>
      <circle cx="0" cy="20" r="7" fill="#a8321f"/>
      <text x="-90" y="-56" font-size="19" font-weight="600" fill="#16202b">Ороситель № 3 (ветка склада)</text>
      <text x="-90" y="-32" font-size="18" fill="#2c7a3f">полость свободна, пломба на месте (15.03 — залит эмалью)</text>
    </g>

    <!-- valve with intact seal -->
    <g transform="translate(930,300)">
      <circle r="30" fill="none" stroke="#16202b" stroke-width="4"/>
      <path d="M-30 0 H30 M0 -30 V30" stroke="#16202b" stroke-width="3"/>
      <rect x="36" y="-13" width="46" height="26" fill="#f4efe2" stroke="#a8321f" stroke-width="3"/>
      <text x="-96" y="-52" font-size="19" font-weight="600" fill="#16202b">ШУП задвижки ветки склада</text>
      <text x="-96" y="-28" font-size="18" fill="#2c7a3f">пломба № 2114 цела (15.03 — крепёж сорван)</text>
    </g>
  </g>

  <!-- racks -->
  <g stroke="#16202b" stroke-width="3.4">
    <rect x="250" y="420" width="330" height="200" fill="#c9bfa6"/>
    <line x1="250" y1="470" x2="580" y2="470" stroke-width="2.6"/>
    <line x1="250" y1="520" x2="580" y2="520" stroke-width="2.6"/>
    <line x1="250" y1="570" x2="580" y2="570" stroke-width="2.6"/>
    <g stroke="none">
      <rect x="266" y="432" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="288" y="432" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="310" y="432" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="332" y="432" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="354" y="432" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="266" y="482" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="288" y="482" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="310" y="482" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="332" y="482" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="266" y="532" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="288" y="532" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
      <rect x="310" y="532" width="14" height="34" fill="#f4efe2" stroke="#16202b" stroke-width="2"/>
    </g>
    <text x="366" y="506" font-size="19" fill="#16202b" stroke="none">стеллаж учёта</text>
    <text x="366" y="530" font-size="19" fill="#16202b" stroke="none">актов КС-2</text>
    <text x="250" y="650" font-size="18" fill="#3b4652" stroke="none">14 папок на полках, бирки читаемы (15.03 — полки пусты, уцелели 3 корешка)</text>
  </g>

  <!-- paint drums -->
  <g>
    <rect x="650" y="520" width="420" height="140" fill="url(#hatchd)" stroke="#16202b" stroke-width="3.4"/>
    <g fill="#c9bfa6" stroke="#16202b" stroke-width="3">
      <rect x="672" y="452" width="62" height="68" rx="6"/>
      <rect x="746" y="452" width="62" height="68" rx="6"/>
      <rect x="820" y="452" width="62" height="68" rx="6"/>
      <rect x="894" y="452" width="62" height="68" rx="6"/>
      <rect x="968" y="452" width="62" height="68" rx="6"/>
    </g>
    <g fill="#16202b" font-size="15" stroke="none">
      <text x="686" y="492">УС</text><text x="760" y="492">УС</text><text x="834" y="492">НЭ</text><text x="908" y="492">УС</text><text x="982" y="492">ПФ</text>
    </g>
    <text x="650" y="700" font-size="18" fill="#3b4652" stroke="none">УС — уайт-спирит, НЭ — нитроэмаль, ПФ — алкидная эмаль. Инвентаризация 28.02: расхождений нет</text>
  </g>

  <!-- door to tambour -->
  <g>
    <rect x="1150" y="390" width="26" height="150" fill="#ded7c6" stroke="#16202b" stroke-width="3.4"/>
    <path d="M1150 540 A150 150 0 0 0 1000 390" fill="none" stroke="#1f6f8f" stroke-width="2.6" stroke-dasharray="11 7"/>
    <text x="1032" y="576" font-size="18" fill="#1f6f8f">дверь в тамбур 4-7</text>
  </g>

  <!-- dimensions -->
  <g stroke="#1f6f8f" stroke-width="2" fill="#1f6f8f" font-size="20">
    <line x1="200" y1="748" x2="1150" y2="748" stroke-dasharray="9 6"/>
    <line x1="200" y1="736" x2="200" y2="760"/>
    <line x1="1150" y1="736" x2="1150" y2="760"/>
    <text x="620" y="782" stroke="none">12,00 м</text>
    <line x1="150" y1="170" x2="150" y2="720" stroke-dasharray="9 6"/>
    <line x1="138" y1="170" x2="162" y2="170"/>
    <line x1="138" y1="720" x2="162" y2="720"/>
    <text x="112" y="452" stroke="none" transform="rotate(-90 118 452)">8,00 м</text>
  </g>

  <!-- notes block -->
  <g font-size="18" fill="#16202b">
    <text x="1230" y="200" font-size="20" font-weight="700">Зачем в деле эта схема</text>
    <text x="1230" y="232">Она единственная показывает</text>
    <text x="1230" y="256">состояние склада ДО пожара.</text>
    <text x="1230" y="292">К 15.03 те же три узла</text>
    <text x="1230" y="316">выведены из готовности.</text>
    <text x="1230" y="352">Срок полимеризации эмали</text>
    <text x="1230" y="376">на оросителе — от 3 недель,</text>
    <text x="1230" y="400">значит, заливали не в ночь</text>
    <text x="1230" y="424">пожара, а в феврале —</text>
    <text x="1230" y="448">после третьего предписания</text>
    <text x="1230" y="472">Дронова от 22.01.</text>
    <text x="1230" y="512">Пломба ШУП: по журналу</text>
    <text x="1230" y="536">последний осмотр 14.01.2025.</text>
    <text x="1230" y="576">Вывод: готовность системы</text>
    <text x="1230" y="600">тушения снимали планомерно,</text>
    <text x="1230" y="624">и знал об этом один человек —</text>
    <text x="1230" y="648" font-weight="700" fill="#a8321f">ответственный за ПБ участок</text>
    <text x="1230" y="672" font-weight="700" fill="#a8321f">начальника производства.</text>
  </g>

  <!-- stamp -->
  <g transform="translate(1150,872)">
    <rect x="-410" y="-96" width="410" height="96" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
    <line x1="-410" y1="-64" x2="0" y2="-64" stroke="#16202b" stroke-width="1.6"/>
    <line x1="-160" y1="-64" x2="-160" y2="0" stroke="#16202b" stroke-width="1.6"/>
    <text x="-396" y="-70" font-size="17" font-weight="600" fill="#16202b">Фотофиксация к акту № С-96 от 28.02.2025 · ООО «Автоматика-Сервис»</text>
    <text x="-396" y="-40" font-size="18" fill="#16202b">М 1:50 · 28.02.2025, 11:20</text>
    <text x="-146" y="-40" font-size="18" fill="#16202b">фабрика «Дубрава», пом. 4-8</text>
    <text x="-396" y="-14" font-size="18" fill="#3b4652">Сохранность EXIF подтверждена (запрос 21.03)</text>
  </g>
</svg>
