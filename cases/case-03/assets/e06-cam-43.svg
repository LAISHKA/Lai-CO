<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7f97a4" stroke-width="0.6" opacity=".1"/>
    </pattern>
    <radialGradient id="hazard" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b23a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#e8b23a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfe3e8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#cfe3e8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#101820"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#3d4e5c" stroke-width="2.5"/>

  <text x="60" y="72" font-size="25" fill="#cfe3e8">CAM «РУБЕЖ-2» · 43-Я ВЕРСТА · КАНАЛ 1 · НОЧНОЙ РЕЖИМ ИК</text>
  <text x="60" y="102" font-size="19" fill="#7f97a4">Сектор обзора 640 м на запад. Оператор ЗАО «Рубеж-Сервис», архив выдан 13.04.2025 по запросу.</text>

  <circle cx="1480" cy="66" r="9" fill="#c8321f"/>
  <text x="1400" y="106" font-size="20" fill="#cfe3e8">REC</text>

  <!-- road in perspective -->
  <polygon points="120,860 700,470 900,470 1520,860" fill="#182430"/>
  <polygon points="700,470 900,470 880,452 720,452" fill="#182430" stroke="#3d4e5c" stroke-width="1.5"/>
  <g stroke="#9db4bd" stroke-width="3" opacity=".5">
    <line x1="180" y1="820" x2="360" y2="700"/>
    <line x1="1300" y1="820" x2="1120" y2="700"/>
  </g>
  <g stroke="#9db4bd" stroke-width="4" opacity=".65" stroke-dasharray="46 40">
    <line x1="760" y1="860" x2="800" y2="470"/>
  </g>
  <text x="200" y="640" font-size="18" fill="#7f97a4">полоса на запад</text>
  <text x="1230" y="640" font-size="18" fill="#7f97a4">полоса на восток</text>

  <!-- camera cone -->
  <polygon points="1500,180 620,470 1000,860 1540,860" fill="#cfe3e8" fill-opacity=".05" stroke="#cfe3e8" stroke-opacity=".3" stroke-width="1.5"/>
  <g>
    <rect x="1470" y="150" width="60" height="34" rx="6" fill="#3d4e5c" stroke="#cfe3e8" stroke-width="1.5"/>
    <line x1="1500" y1="184" x2="1500" y2="330" stroke="#3d4e5c" stroke-width="6"/>
    <text x="1330" y="140" font-size="17" fill="#7f97a4">мачта, опора Л-14</text>
  </g>

  <!-- stopped Sobol on the shoulder -->
  <g transform="translate(1010,520)">
    <polygon points="0,120 60,36 250,20 300,96 300,168 0,168" fill="#22303c" stroke="#9db4bd" stroke-width="2.5"/>
    <polygon points="62,42 240,28 282,92 62,92" fill="#101820" stroke="#9db4bd" stroke-width="1.5"/>
    <rect x="62" y="92" width="220" height="14" fill="#3d4e5c" opacity=".8"/>
    <circle cx="60" cy="168" r="24" fill="#101820" stroke="#9db4bd" stroke-width="2"/>
    <circle cx="252" cy="168" r="24" fill="#101820" stroke="#9db4bd" stroke-width="2"/>
    <text x="-8" y="-16" font-size="18" fill="#cfe3e8">Н-417-ЕК, стоянка у правого края</text>
  </g>

  <!-- hazard glows -->
  <ellipse cx="1300" cy="612" rx="70" ry="46" fill="url(#hazard)"/>
  <ellipse cx="1022" cy="640" rx="52" ry="36" fill="url(#hazard)"/>
  <circle cx="1304" cy="612" r="7" fill="#e8b23a"/>
  <circle cx="1020" cy="640" r="6" fill="#e8b23a"/>

  <!-- annotations -->
  <g stroke="#c8321f" stroke-width="1.6" fill="none">
    <path d="M1500,182 L1230,146"/>
    <path d="M980,470 L980,240"/>
    <path d="M1360,700 L1440,760"/>
  </g>
  <text x="900" y="228" font-size="17" fill="#cfe3e8">аварийный сигнал мигает с 20:52</text>
  <text x="1140" y="140" font-size="17" fill="#7f97a4">кадр 20:52:14</text>
  <text x="1170" y="782" font-size="17" fill="#cfe3e8">ни одной фигуры человека</text>
  <text x="1170" y="806" font-size="17" fill="#cfe3e8">в кадре за 42 минуты</text>

  <!-- empty lane marker -->
  <g stroke="#cfe3e8" stroke-width="1.4" opacity=".6" fill="none">
    <line x1="700" y1="470" x2="1000" y2="470"/>
    <line x1="700" y1="462" x2="700" y2="478"/>
    <line x1="1000" y1="462" x2="1000" y2="478"/>
  </g>
  <text x="716" y="446" font-size="16" fill="#7f97a4">640 м — весь сектор пуст до горизонта</text>

  <!-- OSD -->
  <text x="60" y="788" font-size="22" fill="#cfe3e8">2025-04-11  20:52:14  —  21:34:02</text>
  <text x="60" y="820" font-size="18" fill="#7f97a4">BITRATE 3,8 Мбит/с · ИК 940 НМ · 12 к/с · файл R43-20250411-2052.ts</text>

  <text x="740" y="856" font-size="16" fill="#7f97a4">Выгрузка из архива приложена к материалу проверки № 714. Ход времени непрерывен, разрывов и перезаписи не обнаружено.</text>
</svg>
