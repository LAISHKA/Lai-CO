<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="grass" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M3 13 L5 6 M8 13 L8 5 M12 13 L14 7" stroke="#5c7286" stroke-width="1" fill="none" opacity=".5"/>
    </pattern>
    <pattern id="ash" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <circle cx="3" cy="3" r="1.3" fill="#3b4652" opacity=".55"/>
      <circle cx="7" cy="7" r="1" fill="#3b4652" opacity=".4"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Обочина 51-й версты, 12.04.2025, 09:20</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">План с натуры к протоколу осмотра. Пикет Р-118/51-04. АЗС «Магистраль» — в 1 км восточнее. Следов второй машины на грунте нет.</text>

  <!-- asphalt -->
  <rect x="120" y="700" width="1360" height="120" fill="#cfc7b4"/>
  <line x1="120" y1="700" x2="1480" y2="700" stroke="#3b4652" stroke-width="2.5"/>
  <text x="140" y="770" font-size="17" fill="#3b4652">полотно Р-118, полоса на запад</text>

  <!-- shoulder -->
  <rect x="120" y="560" width="1360" height="140" fill="#ded7c7" stroke="#8d8676" stroke-width="1.4"/>
  <text x="140" y="596" font-size="17" fill="#3b4652">обочина, утрамбованный грунт</text>

  <!-- grass verge -->
  <rect x="120" y="170" width="1360" height="390" fill="url(#grass)" stroke="#8d8676" stroke-width="1.2"/>
  <text x="140" y="200" font-size="17" fill="#3b4652">откос, трава до 40 см</text>

  <!-- marker post -->
  <g>
    <rect x="1300" y="470" width="22" height="120" rx="4" fill="#e8e2d4" stroke="#16202b" stroke-width="2.5"/>
    <rect x="1300" y="470" width="22" height="30" fill="#a8321f"/>
    <text x="1258" y="620" font-size="16" fill="#16202b">пикет Р-118/51-04</text>
    <text x="1332" y="486" font-size="16" fill="#3b4652">1</text>
  </g>

  <!-- drag groove -->
  <g stroke="#a8321f" stroke-width="2.5" fill="none">
    <path d="M1180 540 Q1120 556 1060 566"/>
    <path d="M1186 556 Q1126 572 1066 582"/>
  </g>
  <line x1="1180" y1="540" x2="1060" y2="566" stroke="#a8321f" stroke-width="1" opacity="0"/>
  <text x="1064" y="530" font-size="17" fill="#a8321f">борозда волочения 1,2 м,</text>
  <text x="1064" y="510" font-size="17" fill="#a8321f">направление — к обочине</text>

  <!-- fire spot -->
  <ellipse cx="880" cy="500" rx="52" ry="42" fill="url(#ash)" stroke="#16202b" stroke-width="2"/>
  <text x="812" y="580" font-size="17" fill="#16202b">3. кострище 30×25 см,</text>
  <text x="812" y="600" font-size="17" fill="#3b4652">присыпано землёй, угли тёплые</text>

  <!-- jacket outline -->
  <g>
    <path d="M600 380 q60 -26 120 0 l30 96 -44 16 -10 -40 -6 108 -100 0 -6 -108 -10 40 -44 -16 z"
          fill="none" stroke="#16202b" stroke-width="3"/>
    <path d="M604 470 l-30 66 34 8 26 -56" fill="none" stroke="#a8321f" stroke-width="3"/>
    <path d="M716 470 l30 66 -34 8 -26 -56" fill="none" stroke="#a8321f" stroke-width="3"/>
    <text x="596" y="360" font-size="18" fill="#16202b">1. куртка</text>
    <text x="500" y="580" font-size="17" fill="#a8321f">правый рукав оплывший,</text>
    <text x="500" y="600" font-size="17" fill="#a8321f">левый — копоть до локтя</text>
  </g>

  <!-- bandage scrap -->
  <g>
    <path d="M420 300 q26 -14 52 0 q-8 22 -30 22 q-22 0 -22 -22 z" fill="#e8e2d4" stroke="#16202b" stroke-width="2.5"/>
    <text x="330" y="266" font-size="18" fill="#16202b">2. обрывок бинта 18 см,</text>
    <text x="330" y="288" font-size="17" fill="#3b4652">свёрнут жгутом, пятно крови</text>
  </g>

  <!-- pocket items -->
  <g>
    <rect x="960" y="330" width="70" height="34" rx="6" fill="none" stroke="#16202b" stroke-width="2.5"/>
    <circle cx="1060" cy="348" r="14" fill="none" stroke="#16202b" stroke-width="2.5"/>
    <text x="936" y="306" font-size="18" fill="#16202b">4. в кармане: телефон,</text>
    <text x="936" y="392" font-size="17" fill="#3b4652">ключ кабины; брелока 02 нет</text>
  </g>

  <!-- measures -->
  <g stroke="#3b4652" stroke-width="1.4" fill="none">
    <line x1="600" y1="640" x2="880" y2="640"/>
    <line x1="600" y1="632" x2="600" y2="648"/>
    <line x1="880" y1="632" x2="880" y2="648"/>
    <line x1="880" y1="664" x2="1180" y2="664"/>
    <line x1="880" y1="656" x2="880" y2="672"/>
    <line x1="1180" y1="656" x2="1180" y2="672"/>
  </g>
  <text x="690" y="632" font-size="16" fill="#3b4652">2,1 м</text>
  <text x="980" y="656" font-size="16" fill="#3b4652">3,0 м</text>

  <!-- notes -->
  <g font-size="17" fill="#3b4652">
    <text x="1240" y="200" font-size="19" font-weight="600" fill="#16202b">Записано в протоколе</text>
    <text x="1240" y="232">Позиция — лицом к полотну,</text>
    <text x="1240" y="254">рукава сложены к центру,</text>
    <text x="1240" y="276">горловина подвёрнута.</text>
    <text x="1240" y="310">Опечатков пальцев на ткани</text>
    <text x="1240" y="332">не изъято: ткань обгорела.</text>
  </g>
  <g font-size="17" fill="#a8321f">
    <text x="1240" y="372">Губарев сказал, что шёл</text>
    <text x="1240" y="394">к АЗС и ночевал в лесу.</text>
    <text x="1240" y="416">Одежду он при этом оставил</text>
    <text x="1240" y="438">у обочины, в 1 км от колонки.</text>
  </g>

  <!-- scale -->
  <g>
    <line x1="120" y1="866" x2="360" y2="866" stroke="#16202b" stroke-width="2.5"/>
    <line x1="120" y1="856" x2="120" y2="876" stroke="#16202b" stroke-width="2.5"/>
    <line x1="240" y1="858" x2="240" y2="874" stroke="#16202b" stroke-width="1.8"/>
    <line x1="360" y1="856" x2="360" y2="876" stroke="#16202b" stroke-width="2.5"/>
    <text x="150" y="850" font-size="16" fill="#3b4652">0   2   4 м — масштаб 1:50</text>
  </g>

  <text x="420" y="866" font-size="16" fill="#3b4652">Составил: следователь СО ОМВД Ветрова П. А. Понятые: Родионов В. И., Хачатрян Г. С. При осмотре: фельдшер СПМ Ягушева В. Т.</text>
</svg>
