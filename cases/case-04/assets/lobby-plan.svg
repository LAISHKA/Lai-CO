<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3b4652" stroke-width="1.6" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Лобби первого этажа: сектор камеры 04 и маршруты ночи</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Регистратор тот же, архив 30 суток. В секторе: стойка, диваны, служебный проход. Кабинет управляющей — вне кадра. Ночной дежурный свет, люстры на 40 процентов.</text>

  <!-- room -->
  <g>
    <rect x="180" y="160" width="880" height="520" fill="#f2ecdf" stroke="#16202b" stroke-width="4"/>
    <!-- entrance -->
    <rect x="180" y="600" width="160" height="80" fill="url(#hatch)" stroke="#16202b" stroke-width="3"/>
    <text x="196" y="632" font-size="16" fill="#16202b">парадная дверь</text>
    <text x="196" y="656" font-size="15" fill="#3b4652">на улицу</text>
    <!-- bar panel -->
    <rect x="380" y="200" width="260" height="80" rx="8" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
    <text x="396" y="232" font-size="17" fill="#16202b">барная панель</text>
    <text x="396" y="256" font-size="15" fill="#3b4652">стек с посудой, льдомойка</text>
    <!-- desk -->
    <rect x="740" y="200" width="300" height="90" rx="8" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
    <text x="756" y="232" font-size="17" fill="#16202b">стойка, четыре места</text>
    <text x="756" y="256" font-size="15" fill="#3b4652">клавиатура у правого торца</text>
    <text x="756" y="278" font-size="15" fill="#3b4652">ящик с пультом ворот</text>
    <!-- sofas -->
    <rect x="420" y="420" width="180" height="80" rx="10" fill="none" stroke="#16202b" stroke-width="2.5"/>
    <text x="436" y="466" font-size="16" fill="#16202b">диваны</text>
    <!-- lifts -->
    <rect x="960" y="330" width="100" height="140" fill="url(#hatch)" stroke="#16202b" stroke-width="3"/>
    <text x="972" y="380" font-size="16" fill="#16202b">лифт Б</text>
    <text x="972" y="404" font-size="15" fill="#3b4652">грузовой</text>
    <!-- service passage -->
    <rect x="960" y="520" width="100" height="160" fill="none" stroke="#a8321f" stroke-width="3"/>
    <text x="968" y="596" font-size="16" fill="#a8321f">служебный</text>
    <text x="968" y="618" font-size="16" fill="#a8321f">проход</text>
    <!-- office out of frame -->
    <rect x="700" y="520" width="240" height="120" fill="none" stroke="#3b4652" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="716" y="552" font-size="16" fill="#3b4652">кабинет управляющей</text>
    <text x="716" y="576" font-size="15" fill="#3b4652">сейф с административными</text>
    <text x="716" y="598" font-size="15" fill="#3b4652">картами, журнал № 7</text>
    <text x="716" y="626" font-size="15" fill="#a8321f">вне сектора камеры</text>
    <!-- cargo door -->
    <rect x="380" y="560" width="180" height="80" fill="none" stroke="#16202b" stroke-width="2.5"/>
    <text x="396" y="592" font-size="16" fill="#16202b">грузовой тамбур</text>
    <text x="396" y="616" font-size="15" fill="#3b4652">в прачечную и на паркинг</text>
    <!-- camera and sector -->
    <circle cx="212" cy="196" r="10" fill="none" stroke="#a8321f" stroke-width="2.6"/>
    <path d="M212 196 L1040 210 L1040 660 L212 300 z" fill="#a8321f" opacity=".06"/>
    <text x="230" y="186" font-size="16" fill="#a8321f">камера 04, высота 2,9 м, обзор 118 градусов</text>
  </g>

  <!-- routes -->
  <g fill="none" stroke="#a8321f" stroke-width="2.6">
    <path d="M1010 400 L700 300 L520 260"/>
    <path d="M520 280 L700 330 L1000 400"/>
    <path d="M1010 470 L1010 560"/>
    <path d="M1010 600 L880 640 L560 620"/>
  </g>
  <g font-size="16" fill="#a8321f">
    <text x="560" y="352">22:11:40 — от лифта к панели, 22:12:20 — назад</text>
    <text x="620" y="700">00:57:44 — две женщины через лобби к тамбуру</text>
    <text x="1050" y="510">23:34:52 — из лифта, телефон у левого уха,</text>
    <text x="1050" y="532">в проход; 23:35:10 — из кадра</text>
  </g>

  <!-- right column -->
  <g font-size="17" fill="#3b4652">
    <text x="1120" y="180" font-size="19" font-weight="600" fill="#16202b">Кадры камеры 04</text>
    <text x="1120" y="214">22:11:40 — женщина в пиджаке</text>
    <text x="1120" y="236">берёт у панели бокал, идёт к лифту.</text>
    <text x="1120" y="266">23:14:02 — у стойки девушка в халате,</text>
    <text x="1120" y="288">ставит штамп выезжающему гостю.</text>
    <text x="1120" y="318">23:34:52 — из лифта женщина в пиджаке,</text>
    <text x="1120" y="340">аппарат у левого уха, уходит в проход.</text>
    <text x="1120" y="370">С 23:35:10 по 00:05:10 в лобби</text>
    <text x="1120" y="392">нет ни одного человека.</text>
    <text x="1120" y="422">00:05:10 — бригада скорой,</text>
    <text x="1120" y="444">за ней девушка в халате.</text>
    <text x="1120" y="474">00:57:44 — две женщины к грузовой двери,</text>
    <text x="1120" y="496">у старшей завязанный пакет.</text>
    <text x="1120" y="526">01:31:44 — из прохода женщина в пиджаке,</text>
    <text x="1120" y="548">садится за клавиатуру стойки.</text>
    <text x="1120" y="578">01:44:10 — на экране карточка счёта.</text>
    <text x="1120" y="608">01:52:06 — обратно в служебный проход.</text>
    <text x="1120" y="638">Больше в эту ночь в лобби</text>
    <text x="1120" y="660">никто не появлялся.</text>
  </g>

  <g font-size="17" fill="#16202b">
    <text x="60" y="750" font-size="19" font-weight="600">Размеры и секторы</text>
  </g>
  <g font-size="17" fill="#3b4652">
    <text x="60" y="782">От лифта Б до клавиатуры стойки — одиннадцать шагов по открытому месту, весь путь лежит в секторе камеры 04.</text>
    <text x="60" y="810">Дверь кабинета управляющей и дверь в подсобку за стойкой — вне сектора; в кадре видно только, как в них входят.</text>
    <text x="60" y="838">Оператор стойки снимается со спины и по плечи: лицо в профиль читается только в 23:14:02, когда девушка стоит у торца.</text>
  </g>

  <text x="60" y="870" font-size="16" fill="#3b4652">План состава: дознаватель ОМВД по г. Зарецку. Схема секторов — приложение к выгрузке архива камеры 04 за 14—15.10.2025.</text>
</svg>
