<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3b4652" stroke-width="1.6" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">План номера 507, пятый этаж. Осмотр 15.10.2025 с 02:15</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Отель «Мезонин», Зарецк. Площадь 21,4 кв. м, высота 2,7 м. Дверь из коридора, балкон на юг. Позывной стойки в журнале — 03.</text>

  <!-- outer walls -->
  <g>
    <rect x="240" y="170" width="880" height="560" fill="#f2ecdf" stroke="#16202b" stroke-width="4"/>
    <rect x="240" y="170" width="880" height="560" fill="url(#grid)"/>
    <!-- bathroom -->
    <rect x="240" y="170" width="230" height="200" fill="url(#hatch)" stroke="#16202b" stroke-width="3"/>
    <text x="256" y="204" font-size="17" fill="#16202b">санузел</text>
    <text x="256" y="330" font-size="15" fill="#3b4652">пол сухой, слив чист</text>
    <!-- hall -->
    <rect x="470" y="170" width="250" height="120" fill="none" stroke="#16202b" stroke-width="2.5"/>
    <text x="486" y="200" font-size="17" fill="#16202b">прихожая</text>
    <!-- wardrobe -->
    <rect x="730" y="170" width="180" height="120" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
    <text x="746" y="200" font-size="17" fill="#16202b">шкаф</text>
    <text x="746" y="226" font-size="15" fill="#3b4652">4 бокала: 3 в плёнке,</text>
    <text x="746" y="248" font-size="15" fill="#a8321f">1 без плёнки; вешалка</text>
    <text x="746" y="270" font-size="15" fill="#a8321f">с биркой «халат» пуста</text>
    <!-- balcony door -->
    <rect x="920" y="170" width="200" height="120" fill="none" stroke="#16202b" stroke-width="2.5"/>
    <text x="936" y="200" font-size="17" fill="#16202b">балкон</text>
    <text x="936" y="226" font-size="15" fill="#3b4652">рама заперта изнутри</text>
    <!-- entry door -->
    <path d="M240 620 A70 70 0 0 1 310 690" fill="none" stroke="#a8321f" stroke-width="2" stroke-dasharray="7 6"/>
    <line x1="240" y1="620" x2="240" y2="690" stroke="#a8321f" stroke-width="6"/>
    <text x="150" y="662" font-size="16" fill="#a8321f">вход</text>
    <!-- footprint -->
    <g transform="translate(330,648)">
      <path d="M0 0 q10 -22 22 -22 q14 0 14 20 q0 14 -8 22 q-14 10 -22 2 q-8 -8 -6 -22 z" fill="none" stroke="#a8321f" stroke-width="2.4"/>
      <text x="44" y="6" font-size="16" fill="#a8321f">след подошвы 38, «ёлочка», носом к двери</text>
    </g>
  </g>

  <!-- bed -->
  <g>
    <rect x="900" y="420" width="200" height="280" rx="10" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
    <text x="916" y="450" font-size="17" fill="#16202b">кровать</text>
    <text x="916" y="474" font-size="15" fill="#3b4652">покрывало ровно,</text>
    <text x="916" y="496" font-size="15" fill="#3b4652">подушек две, прогиб</text>
    <text x="916" y="518" font-size="15" fill="#3b4652">под головой сбит</text>
    <!-- nightstand -->
    <rect x="1120" y="440" width="120" height="120" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
    <text x="1128" y="464" font-size="16" fill="#16202b">тумбочка</text>
    <circle cx="1180" cy="510" r="14" fill="none" stroke="#a8321f" stroke-width="2.4"/>
    <line x1="1194" y1="510" x2="1330" y2="560" stroke="#a8321f" stroke-width="1.6"/>
    <text x="1300" y="580" font-size="16" fill="#a8321f">7. телефон гостя, экран</text>
    <text x="1300" y="602" font-size="16" fill="#a8321f">погашен, 12 процентов;</text>
    <text x="1300" y="624" font-size="16" fill="#a8321f">блистер 7 из 10, портмоне</text>
  </g>

  <!-- armchair -->
  <g>
    <rect x="900" y="330" width="150" height="80" rx="12" fill="none" stroke="#16202b" stroke-width="3"/>
    <text x="912" y="378" font-size="16" fill="#16202b">кресло</text>
    <line x1="975" y1="330" x2="1240" y2="250" stroke="#3b4652" stroke-width="1.4"/>
    <text x="1200" y="244" font-size="16" fill="#3b4652">8. окурки в пепельнице, три,</text>
    <text x="1200" y="266" font-size="16" fill="#3b4652">пепел не стряхнут</text>
  </g>

  <!-- table with rings -->
  <g>
    <circle cx="640" cy="560" r="130" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
    <text x="576" y="440" font-size="17" fill="#16202b">столик у окна, скатерть</text>
    <circle cx="596" cy="524" r="34" fill="none" stroke="#a8321f" stroke-width="2.6"/>
    <circle cx="686" cy="524" r="34" fill="none" stroke="#a8321f" stroke-width="2.6"/>
    <circle cx="640" cy="614" r="27" fill="none" stroke="#a8321f" stroke-width="2.6" stroke-dasharray="6 5"/>
    <text x="558" y="530" font-size="14" fill="#a8321f">1</text>
    <text x="650" y="530" font-size="14" fill="#a8321f">2</text>
    <text x="632" y="620" font-size="14" fill="#a8321f">3</text>
    <line x1="700" y1="600" x2="1210" y2="700" stroke="#a8321f" stroke-width="1.6"/>
    <text x="1180" y="716" font-size="16" fill="#a8321f">4. фужер 40 мл, взвесь на дне</text>
    <text x="1180" y="738" font-size="16" fill="#a8321f">5. стакан 62 мм, засохшая помада</text>
    <text x="1180" y="760" font-size="16" fill="#a8321f">6. графин, горлышко без запаха</text>
  </g>

  <!-- notes column -->
  <g font-size="17" fill="#3b4652">
    <text x="90" y="170" font-size="19" font-weight="600" fill="#16202b">Зафиксировано на месте</text>
    <text x="90" y="202">1. Сквозняк: штора приподнята,</text>
    <text x="90" y="226">рама балкона заперта изнутри.</text>
    <text x="90" y="256">2. Тело гостя у изголовья кровати,</text>
    <text x="90" y="280">лежит на спине, бортик не смят.</text>
    <text x="90" y="310">3. Следов борьбы нет: ничего не</text>
    <text x="90" y="334">сдвинуто, пульт на подлокотнике.</text>
    <text x="90" y="364">4. На столе лежал белый платок,</text>
    <text x="90" y="388">сложен вчетверо, под ним кольцо.</text>
  </g>
  <g font-size="17" fill="#a8321f">
    <text x="90" y="470" font-size="19" font-weight="600" fill="#16202b">Что не сходится</text>
    <text x="90" y="502">Три кольца на скатерти,</text>
    <text x="90" y="526">два сосуда на столе.</text>
    <text x="90" y="556">Диаметры: 78 мм, 78 мм,</text>
    <text x="90" y="580">62 мм. Фужер — 78 мм,</text>
    <text x="90" y="604">стакан — 62 мм. Третий</text>
    <text x="90" y="628">сосуд на 78 мм в номере</text>
    <text x="90" y="652">отсутствует и в шкафу его</text>
    <text x="90" y="676">нет: четыре бокала, три</text>
    <text x="90" y="700">в заводской плёнке.</text>
  </g>

  <!-- scale -->
  <g>
    <line x1="1200" y1="820" x2="1440" y2="820" stroke="#16202b" stroke-width="2.5"/>
    <line x1="1200" y1="810" x2="1200" y2="830" stroke="#16202b" stroke-width="2.5"/>
    <line x1="1320" y1="812" x2="1320" y2="828" stroke="#16202b" stroke-width="1.8"/>
    <line x1="1440" y1="810" x2="1440" y2="830" stroke="#16202b" stroke-width="2.5"/>
    <text x="1180" y="806" font-size="16" fill="#3b4652">0 1 2 м — масштаб 1:20</text>
  </g>

  <text x="90" y="856" font-size="16" fill="#3b4652">Составил: следователь СО ОМВД по г. Зарецку Крымсарова Д. О. Понятые: Жилин С. П., Морозова Е. В. Схема — приложение к протоколу осмотра от 15.10.2025.</text>
</svg>
