<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3b4652" stroke-width="1.6" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Служебный коридор: девятнадцать минут одного человека</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Камера CAM 06, 06.10.2025. Часы регистратора сверены с сервером стойки, расхождение 0 секунд. Рост по напольной плитке 300 мм.</text>

  <!-- corridor elevation -->
  <g>
    <rect x="110" y="200" width="900" height="380" fill="none" stroke="#16202b" stroke-width="3.2"/>
    <text x="110" y="188" font-size="16" fill="#3b4652">левая стена коридора, вид с камеры</text>

    <!-- doors -->
    <g stroke="#16202b" stroke-width="2.4" fill="#ded7c6">
      <rect x="150" y="250" width="110" height="290"/>
      <rect x="470" y="250" width="110" height="290"/>
      <rect x="790" y="250" width="110" height="290"/>
    </g>
    <g font-size="16" fill="#16202b">
      <text x="146" y="238">дверь бокса</text>
      <text x="452" y="238">окно приёмной</text>
      <text x="768" y="238">дверь склада Б-03</text>
    </g>
    <g font-size="14" fill="#3b4652">
      <text x="132" y="562">считыватель Б-02, Б-01</text>
      <text x="452" y="562">стойка, журнал</text>
      <text x="786" y="562">с 16:44 на магните</text>
    </g>

    <!-- reader panel -->
    <g>
      <rect x="278" y="300" width="72" height="46" rx="4" fill="#e8e2d4" stroke="#16202b" stroke-width="2"/>
      <circle cx="296" cy="323" r="5" fill="#3b4652"/>
      <circle cx="314" cy="323" r="5" fill="#3b4652"/>
      <circle cx="332" cy="323" r="5" fill="#3b4652"/>
      <text x="262" y="372" font-size="14" fill="#3b4652">табло зоны поста:</text>
      <text x="262" y="390" font-size="14" fill="#a8321f">ни одного зелёного сигнала</text>
    </g>

    <!-- window -->
    <g>
      <rect x="600" y="268" width="130" height="120" fill="url(#hatch)" stroke="#16202b" stroke-width="2.4"/>
      <text x="596" y="412" font-size="14" fill="#16202b">подоконник 48 см</text>
    </g>

    <!-- person track -->
    <g stroke="#a8321f" stroke-width="2.4" fill="none">
      <path d="M840 500 C 760 470, 700 460, 660 448"/>
      <path d="M660 448 C 600 452, 540 452, 500 452"/>
    </g>
    <g fill="#a8321f">
      <circle cx="845" cy="506" r="11"/>
      <circle cx="662" cy="448" r="9"/>
      <circle cx="500" cy="452" r="9"/>
    </g>
    <g font-size="15" fill="#a8321f">
      <text x="812" y="540">16:55:04 вход</text>
      <text x="620" y="436">16:58:31 у окна</text>
      <text x="452" y="436">17:11:52 на подоконнике</text>
    </g>

    <!-- height reference -->
    <g>
      <line x1="940" y1="252" x2="940" y2="540" stroke="#16202b" stroke-width="2"/>
      <g stroke="#3b4652" stroke-width="1.1">
        <line x1="930" y1="290" x2="950" y2="290"/>
        <line x1="930" y1="328" x2="950" y2="328"/>
        <line x1="930" y1="366" x2="950" y2="366"/>
        <line x1="930" y1="404" x2="950" y2="404"/>
      </g>
      <text x="956" y="330" font-size="15" fill="#16202b">плитка</text>
      <text x="956" y="350" font-size="15" fill="#16202b">300 мм</text>
      <text x="956" y="392" font-size="16" fill="#a8321f">188 см</text>
      <text x="956" y="412" font-size="15" fill="#3b4652">серая куртка</text>
    </g>
  </g>

  <!-- right column: events -->
  <g>
    <text x="1120" y="200" font-size="19" font-weight="600" fill="#16202b">Кто в кадре</text>
    <text x="1120" y="234" font-size="17" fill="#3b4652">16:55:04 — служебная дверь, человек</text>
    <text x="1120" y="256" font-size="16" fill="#3b4652">в серой куртке, рост 188 см, лицом</text>
    <text x="1120" y="278" font-size="16" fill="#3b4652">от камеры; бейдж Г-118 выдан на посту</text>
    <text x="1120" y="300" font-size="16" fill="#3b4652">охраны в 16:53 за подписью.</text>
    <text x="1120" y="338" font-size="17" fill="#3b4652">16:58:31 — стоит у окна приёмной,</text>
    <text x="1120" y="360" font-size="16" fill="#3b4652">ждёт; к двери бокса не подходит.</text>
    <text x="1120" y="398" font-size="17" fill="#3b4652">17:07:00 — дверь склада открывается</text>
    <text x="1120" y="420" font-size="16" fill="#3b4652">изнутри, кладовщик выходит на</text>
    <text x="1120" y="442" font-size="16" fill="#3b4652">24 секунды и возвращается.</text>
    <text x="1120" y="480" font-size="17" fill="#3b4652">17:11:52 — сидит на подоконнике,</text>
    <text x="1120" y="502" font-size="16" fill="#3b4652">смотрит в телефон.</text>
    <text x="1120" y="540" font-size="17" fill="#3b4652">17:14:20 — выходит той же дверью;</text>
    <text x="1120" y="562" font-size="16" fill="#3b4652">в кадр не возвращается.</text>
  </g>

  <!-- notes -->
  <g>
    <text x="60" y="620" font-size="19" font-weight="600" fill="#16202b">Почему коридор ничего не даёт</text>
    <text x="60" y="654" font-size="17" fill="#3b4652">Девятнадцать минут в коридоре идёт один человек и ни разу не поворачивается к камере лицом. За это время дверь бокса не открывалась:</text>
    <text x="60" y="678" font-size="17" fill="#3b4652">её состояние фиксируется независимо от бейджа, и в 17:03—17:07 она была закрыта. Гостевой пропуск Г-118 открывает служебную дверь</text>
    <text x="60" y="702" font-size="17" fill="#3b4652">и окно приёмной, но не зону постов, поэтому пройти к подъёмнику из коридора нельзя, не оставив записи на считывателе Б-02.</text>
    <text x="60" y="744" font-size="17" fill="#16202b">Одновременно с этим в соседнем кадре CAM 03 у поднятой машины стоит человек ростом 182 см в синей робе и с нашивкой «пост 2».</text>
    <text x="60" y="786" font-size="17" fill="#3b4652">Расхождение по росту — шесть сантиметров; куртка и бейдж остаются в коридоре, роба и гайковёрт — в боксе.</text>
  </g>
  <text x="1140" y="854" font-size="16" fill="#a8321f">Выгрузка журнала СКУД сделана 07.10 в 10:05</text>
</svg>
