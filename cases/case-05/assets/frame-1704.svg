<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3b4652" stroke-width="1.6" opacity=".35"/>
    </pattern>
    <pattern id="tread" width="18" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0 12 L9 2 L18 12" fill="none" stroke="#16202b" stroke-width="1.8" opacity=".7"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Кадр 17:03:41, увеличение 2,2: роба, рука и след ботинка</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Кадры сняты с архива CAM 03 следователем 07.10 при понятых. Линейка уложена на пол в той же плоскости, что и объект съёмки.</text>

  <!-- panel A: shoulder patch -->
  <g>
    <text x="110" y="180" font-size="19" font-weight="600" fill="#16202b">А. Нашивка на правом плече</text>
    <path d="M110 210 q 90 -26 190 0 l 20 200 q -116 26 -230 0 Z" fill="#2f4258" stroke="#16202b" stroke-width="2.6"/>
    <rect x="168" y="268" width="120" height="56" rx="4" fill="#e8e2d4" stroke="#16202b" stroke-width="2"/>
    <text x="184" y="304" font-size="20" font-weight="600" fill="#16202b">пост 2</text>
    <g stroke="#a8321f" stroke-width="1.8">
      <line x1="168" y1="340" x2="288" y2="340"/>
      <line x1="152" y1="268" x2="152" y2="324"/>
    </g>
    <text x="300" y="288" font-size="16" fill="#a8321f">8 см</text>
    <text x="212" y="362" font-size="16" fill="#a8321f">4 см</text>
    <text x="110" y="452" font-size="16" fill="#3b4652">Пришита машинной строчкой, нитки те же, что</text>
    <text x="110" y="474" font-size="16" fill="#3b4652">на обшлагах. Ткань вокруг швов светлее: нашивка</text>
    <text x="110" y="496" font-size="16" fill="#3b4652">не снималась с момента выдачи робы.</text>
  </g>

  <!-- panel B: torn sleeve and wrist -->
  <g>
    <text x="560" y="180" font-size="19" font-weight="600" fill="#16202b">Б. Правый рукав и запястье</text>
    <path d="M560 220 h 250 v 60 q 40 40 0 80 h -250 Z" fill="#2f4258" stroke="#16202b" stroke-width="2.6"/>
    <path d="M700 236 l 14 42 l -18 30 l 16 34" fill="none" stroke="#e8e2d4" stroke-width="5"/>
    <path d="M700 236 l 14 42 l -18 30 l 16 34" fill="none" stroke="#a8321f" stroke-width="1.8"/>
    <rect x="812" y="244" width="120" height="96" rx="46" fill="#d9c6ae" stroke="#16202b" stroke-width="2.4"/>
    <g stroke="#8a5a3b" stroke-width="2.2" fill="none">
      <path d="M828 268 q 34 -10 68 4"/>
      <path d="M830 288 q 36 -8 70 6"/>
      <path d="M834 308 q 32 -8 62 4"/>
    </g>
    <g stroke="#a8321f" stroke-width="1.6">
      <line x1="700" y1="228" x2="716" y2="346"/>
    </g>
    <text x="640" y="392" font-size="16" fill="#a8321f">разрыв 4 см от края манжеты</text>
    <text x="820" y="372" font-size="16" fill="#a8321f">полоса ссадин, 3 см</text>
    <text x="560" y="440" font-size="16" fill="#3b4652">Край разрыва светлый, без потёртости: ткань</text>
    <text x="560" y="462" font-size="16" fill="#3b4652">порвалась недавно. Ссадины идут по тыльной</text>
    <text x="560" y="484" font-size="16" fill="#3b4652">стороне запястья, в месте хвата рукоятки.</text>
  </g>

  <!-- panel C: shoe print with ruler -->
  <g>
    <text x="1060" y="180" font-size="19" font-weight="600" fill="#16202b">В. Оттиск подошвы у колеса</text>
    <g transform="translate(1080 220)">
      <path d="M0 40 q 10 -40 70 -40 q 70 0 78 44 q 6 40 -12 96 q -8 30 -38 30 q -34 0 -44 -32 q -14 -46 -18 -70 q -4 -24 -36 -28 Z" fill="url(#tread)" stroke="#16202b" stroke-width="2.6"/>
      <line x1="-16" y1="0" x2="-16" y2="170" stroke="#a8321f" stroke-width="2"/>
      <line x1="-24" y1="0" x2="-8" y2="0" stroke="#a8321f" stroke-width="2"/>
      <line x1="-24" y1="170" x2="-8" y2="170" stroke="#a8321f" stroke-width="2"/>
      <text x="-120" y="90" font-size="16" fill="#a8321f">290 мм</text>
      <text x="160" y="196" font-size="16" fill="#a8321f">ширина 110 мм</text>
      <text x="180" y="60" font-size="16" fill="#3b4652">рисунок «ёлочка»,</text>
      <text x="180" y="82" font-size="16" fill="#3b4652">вершина косых</text>
      <text x="180" y="104" font-size="16" fill="#3b4652">к носку</text>
    </g>
    <text x="1060" y="452" font-size="16" fill="#3b4652">Носком к колесу. Второй оттиск в 1,4 м,</text>
    <text x="1060" y="474" font-size="16" fill="#3b4652">у тележки, развернут на пятнадцать градусов.</text>
  </g>

  <line x1="60" y1="530" x2="1540" y2="530" stroke="#16202b" stroke-width="2"/>

  <!-- height reconstruction -->
  <g>
    <text x="60" y="576" font-size="19" font-weight="600" fill="#16202b">Рост по плитке</text>
    <g stroke="#3b4652" stroke-width="1.6" fill="none">
      <rect x="60" y="600" width="150" height="60"/>
      <rect x="210" y="600" width="150" height="60"/>
      <rect x="360" y="600" width="150" height="60"/>
      <rect x="510" y="600" width="150" height="60"/>
      <rect x="660" y="600" width="150" height="60"/>
    </g>
    <g font-size="15" fill="#3b4652">
      <text x="106" y="686">300 мм</text>
      <text x="256" y="686">300 мм</text>
      <text x="406" y="686">300 мм</text>
      <text x="556" y="686">300 мм</text>
      <text x="706" y="686">300 мм</text>
    </g>
    <g>
      <path d="M300 600 v -210" stroke="#a8321f" stroke-width="2.6"/>
      <path d="M288 400 h 24 M288 390 h 24" stroke="#a8321f" stroke-width="2"/>
      <path d="M300 372 q -22 0 -22 22 q 0 16 22 16 q 26 0 26 -22 q 0 -16 -26 -16" fill="#2f4258" stroke="#16202b" stroke-width="2"/>
      <path d="M270 372 h 60 l 8 -14 h -60 Z" fill="#2f4258" stroke="#16202b" stroke-width="2"/>
      <text x="330" y="410" font-size="18" fill="#a8321f">182 см, плюс-минус 2</text>
      <text x="330" y="434" font-size="16" fill="#3b4652">макушка под козырьком кепки,</text>
      <text x="330" y="454" font-size="16" fill="#3b4652">лицо в тень, кадров с лицом нет</text>
    </g>
    <g font-size="16" fill="#3b4652">
      <text x="900" y="576">Сравнение по тому же полу:</text>
      <text x="900" y="606">человек у окна коридора — 188 см, серая куртка,</text>
      <text x="900" y="628">в кадре коридора видны лицо и куртка.</text>
      <text x="900" y="666">У колеса в боксе — 182 см, синяя роба с нашивкой,</text>
      <text x="900" y="688">оттиск 290 на 110 мм, носком к колесу,</text>
      <text x="900" y="710">лицо закрыто козырьком кепки.</text>
      <text x="900" y="756">Разница шесть сантиметров по вертикали кадра</text>
      <text x="900" y="778">и разная одежда: описаны два разных человека.</text>
    </g>
  </g>

  <text x="60" y="854" font-size="16" fill="#a8321f">Масштаб выверен по шву плитки: погрешность измерения роста не более 2 см</text>
</svg>
