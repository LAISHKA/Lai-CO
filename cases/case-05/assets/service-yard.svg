<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3b4652" stroke-width="1.6" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Двор станции: ворота, бокс и приёмная</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Камеры CAM 01 (ворота) и CAM 05 (приёмная), 06.10.2025. Часы обеих камер ведутся от сервера стойки, расхождение 0 секунд.</text>

  <!-- plan -->
  <g>
    <!-- road / entrance -->
    <path d="M60 700 H 940" stroke="#16202b" stroke-width="3"/>
    <path d="M60 740 H 940" stroke="#16202b" stroke-width="3"/>
    <text x="70" y="690" font-size="16" fill="#3b4652">улица Автомобильная</text>

    <!-- gate -->
    <g>
      <rect x="300" y="694" width="16" height="52" fill="#16202b"/>
      <rect x="470" y="694" width="16" height="52" fill="#16202b"/>
      <path d="M316 720 H 470" stroke="#a8321f" stroke-width="3" stroke-dasharray="14 10"/>
      <text x="292" y="774" font-size="17" fill="#16202b">ворота Б-02 (считыватель)</text>
      <text x="292" y="796" font-size="15" fill="#3b4652">въезд 16:47:12, выезд 17:41:22</text>
    </g>

    <!-- CAM 01 sector -->
    <path d="M390 690 L 250 470 L 620 470 Z" fill="url(#hatch)" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="12 8" opacity=".5"/>
    <text x="252" y="460" font-size="16" fill="#3b4652">CAM 01, сектор ворот</text>

    <!-- car path -->
    <path d="M392 720 C 400 640, 430 600, 470 566" fill="none" stroke="#a8321f" stroke-width="2.6"/>
    <text x="404" y="636" font-size="15" fill="#a8321f">К 417 НР 716</text>

    <!-- bay -->
    <g>
      <rect x="360" y="300" width="470" height="240" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
      <text x="376" y="330" font-size="17" fill="#16202b">бокс, посты 1—3</text>
      <text x="376" y="352" font-size="15" fill="#3b4652">из кадра CAM 05 закрыт стеной</text>
      <rect x="470" y="530" width="120" height="14" fill="#16202b"/>
      <text x="452" y="566" font-size="15" fill="#16202b">дверь бокса</text>
    </g>

    <!-- office / reception -->
    <g>
      <rect x="880" y="240" width="420" height="300" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
      <text x="898" y="270" font-size="17" fill="#16202b">приёмная</text>
      <rect x="880" y="330" width="10" height="90" fill="#a8321f"/>
      <text x="900" y="366" font-size="15" fill="#a8321f">окно выдачи документов</text>
      <text x="900" y="388" font-size="15" fill="#3b4652">клиент расписывается стоя,</text>
      <text x="900" y="406" font-size="15" fill="#3b4652">не проходя вглубь комнаты</text>
      <text x="900" y="446" font-size="15" fill="#3b4652">стойка, журнал, шкаф инструмента</text>
    </g>

    <!-- CAM 05 sector -->
    <path d="M1060 240 L 860 120 L 1420 120 Z" fill="url(#hatch)" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="12 8" opacity=".5"/>
    <text x="1180" y="140" font-size="16" fill="#3b4652">CAM 05, сектор приёмной</text>

    <!-- service corridor -->
    <g>
      <rect x="830" y="540" width="120" height="120" fill="none" stroke="#16202b" stroke-width="2.4"/>
      <text x="838" y="596" font-size="15" fill="#16202b">служебный</text>
      <text x="838" y="616" font-size="15" fill="#16202b">коридор, CAM 06</text>
      <path d="M880 660 V 700" stroke="#3b4652" stroke-width="2.4" stroke-dasharray="8 6"/>
      <text x="890" y="690" font-size="14" fill="#3b4652">дверь Г-118</text>
    </g>

    <!-- parking -->
    <g>
      <rect x="1330" y="560" width="200" height="120" fill="none" stroke="#16202b" stroke-width="2.4"/>
      <text x="1344" y="588" font-size="15" fill="#16202b">стоянка клиентов</text>
      <text x="1344" y="610" font-size="15" fill="#3b4652">Солярис стоит с 17:41</text>
      <text x="1344" y="630" font-size="15" fill="#3b4652">до выемки 07.10</text>
    </g>
  </g>

  <!-- timeline -->
  <g>
    <line x1="180" y1="150" x2="180" y2="640" stroke="#16202b" stroke-width="2.5"/>
    <g font-size="17" fill="#3b4652">
      <text x="60" y="140" font-size="19" font-weight="600" fill="#16202b">Журнал ворот и приёмной</text>
      <text x="202" y="180">16:47:12 — CAM 01: Солярис входит в ворота,</text>
      <text x="202" y="202" font-size="16">за ним пеших на территорию не было</text>
      <text x="202" y="242">16:52:03 — CAM 05: приёмщик в пиджаке</text>
      <text x="202" y="264" font-size="16">и клиент идут от ворот к окну приёмной</text>
      <text x="202" y="304">16:55:04 — CAM 06: служебная дверь,</text>
      <text x="202" y="326" font-size="16">гостевой бейдж Г-118, серая куртка</text>
      <text x="202" y="366">17:35:40 — CAM 05: клиент расписывается</text>
      <text x="202" y="388" font-size="16">у окна стоя, бумагу в руки не получает</text>
      <text x="202" y="428">17:41:22 — CAM 01: выезд К 417 НР</text>
      <text x="202" y="468">17:46 — ворота Б-02: выход пропуска Б-02,</text>
      <text x="202" y="490" font-size="16">мастер поста 2 уходит с территории</text>
      <text x="202" y="530">20:05:31 — CAM 05: приёмщик возвращается</text>
      <text x="202" y="552" font-size="16">на станцию на своём автомобиле</text>
      <text x="202" y="592">20:22 — логин PRM01 на просмотр записи</text>
      <text x="202" y="614" font-size="16">CAM 03 в архиве регистратора</text>
    </g>
    <g fill="#a8321f">
      <circle cx="172" cy="174" r="6"/>
      <circle cx="172" cy="236" r="6"/>
      <circle cx="172" cy="298" r="6"/>
      <circle cx="172" cy="360" r="6"/>
      <circle cx="172" cy="424" r="6"/>
      <circle cx="172" cy="464" r="6"/>
      <circle cx="172" cy="526" r="6"/>
      <circle cx="172" cy="588" r="6"/>
    </g>
  </g>

  <!-- notes -->
  <g>
    <text x="60" y="836" font-size="17" fill="#16202b">Между 17:46 и 20:05 въездов и выездов через ворота не зафиксировано; за это же время складскую дверь Б-03 никто не открывал.</text>
    <text x="1080" y="860" font-size="16" fill="#a8321f">Слепая зона от угла бокса до поста 2: 26 шагов</text>
  </g>
</svg>
