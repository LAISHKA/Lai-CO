<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#3b4652" stroke-width="0.5" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Фототаблица этикеток: ампулы и пачки</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Съёмка 14.11.2025 в фотолаборатории ЭКЦ, масштаб 1:1. Формат маркировки: РГ2 - лот - серия / номер ампулы.</text>

  <g>
    <text x="100" y="176" font-size="19" font-weight="600" fill="#16202b">Кадры 1 — 2: квартира 47</text>
    <g transform="translate(100 200)">
      <path d="M40 0 h 40 v 26 q 22 16 22 60 v 96 q 0 22 -42 22 q -42 0 -42 -22 v -96 q 0 -44 22 -60 Z" fill="#cfd8dc" stroke="#16202b" stroke-width="2.4"/>
      <path d="M18 92 h 108" stroke="#2f4258" stroke-width="1.6"/>
      <text x="24" y="126" font-size="15" fill="#16202b">РГ2-5280-</text>
      <text x="24" y="146" font-size="16" font-weight="600" fill="#a8321f">3106/03</text>
      <circle cx="60" cy="18" r="7" fill="none" stroke="#3b4652" stroke-width="1.8"/>
    </g>
    <g transform="translate(300 200)">
      <path d="M40 0 h 40 v 26 q 22 16 22 60 v 96 q 0 22 -42 22 q -42 0 -42 -22 v -96 q 0 -44 22 -60 Z" fill="#cfd8dc" stroke="#16202b" stroke-width="2.4"/>
      <path d="M18 92 h 108" stroke="#2f4258" stroke-width="1.6"/>
      <text x="24" y="126" font-size="15" fill="#16202b">РГ2-5280-</text>
      <text x="24" y="146" font-size="16" font-weight="600" fill="#a8321f">3106/04</text>
      <circle cx="60" cy="18" r="7" fill="none" stroke="#3b4652" stroke-width="1.8"/>
    </g>
    <text x="100" y="452" font-size="16" fill="#3b4652">Обе ампулы со дна ведра, стекло в</text>
    <text x="100" y="474" font-size="16" fill="#3b4652">одной плоскости с чайным сервизом.</text>
    <text x="100" y="496" font-size="16" fill="#3b4652">Номера 03 и 04, лот 5280.</text>
  </g>

  <g>
    <text x="600" y="176" font-size="19" font-weight="600" fill="#16202b">Кадр 3: клиника «Люцерн»</text>
    <g transform="translate(620 200)">
      <path d="M36 0 h 36 v 24 q 20 16 20 56 v 90 q 0 20 -38 20 q -38 0 -38 -20 v -90 q 0 -40 20 -56 Z" fill="#cfd8dc" stroke="#16202b" stroke-width="2.4"/>
      <path d="M14 86 h 96" stroke="#2f4258" stroke-width="1.6"/>
      <text x="20" y="118" font-size="15" fill="#16202b">РГ2-5280-</text>
      <text x="20" y="138" font-size="16" font-weight="600" fill="#2f4258">3105/04</text>
      <path d="M30 22 q 24 10 48 0" fill="none" stroke="#2f6fb5" stroke-width="4" opacity=".8"/>
      <text x="140" y="60" font-size="16" fill="#2f6fb5">ободок синего лака</text>
      <text x="140" y="84" font-size="16" fill="#3b4652">на стекле печатная серия</text>
      <text x="140" y="106" font-size="16" fill="#3b4652">и номер, не рукописные</text>
    </g>
    <text x="600" y="452" font-size="16" fill="#3b4652">Пачка 3105 числится в аптеке</text>
    <text x="600" y="474" font-size="16" fill="#3b4652">вскрытой: в ней остались № 07 и № 08.</text>
  </g>

  <g>
    <text x="1040" y="176" font-size="19" font-weight="600" fill="#16202b">Кадры 4 — 6: торцы пачек</text>
    <g transform="translate(1040 200)">
      <g font-size="15" fill="#16202b">
        <rect x="0" y="0" width="150" height="88" fill="#f2ede1" stroke="#16202b" stroke-width="2.2"/>
        <rect x="0" y="104" width="150" height="88" fill="#f2ede1" stroke="#16202b" stroke-width="2.2"/>
        <rect x="0" y="208" width="150" height="88" fill="#f2ede1" stroke="#16202b" stroke-width="2.2"/>
      </g>
      <g fill="#e8e2d4" stroke="#a8321f" stroke-width="1.8">
        <rect x="16" y="26" width="118" height="38"/>
        <rect x="16" y="142" width="118" height="24"/>
        <rect x="16" y="234" width="118" height="38"/>
      </g>
      <g font-size="14" fill="#a8321f">
        <text x="24" y="50">инв. 14/207</text>
        <text x="24" y="160">инв. 14/2..</text>
        <text x="24" y="258">инв. 14/207</text>
      </g>
      <path d="M120 142 l 14 12 l -12 12" fill="none" stroke="#a8321f" stroke-width="1.6"/>
      <g font-size="15" fill="#16202b">
        <text x="164" y="30">пачка 3111</text>
        <text x="164" y="134">пачка 3118</text>
        <text x="164" y="238">пачка 3120</text>
      </g>
      <g font-size="15" fill="#3b4652">
        <text x="164" y="54">целая, 8 ампул</text>
        <text x="164" y="158">наклейка надорвана</text>
        <text x="164" y="262">целая, 8 ампул</text>
      </g>
    </g>
  </g>

  <line x1="60" y1="540" x2="1540" y2="540" stroke="#16202b" stroke-width="2"/>

  <g>
    <text x="60" y="586" font-size="19" font-weight="600" fill="#16202b">Кадр 7: обрывок полоски из ведра, пакет № 6</text>
    <g transform="translate(60 606)">
      <path d="M0 20 q 60 -22 140 -12 l 180 8 q 90 4 170 -6 l 8 56 q -110 16 -220 8 l -160 -8 q -80 -4 -118 10 Z" fill="#f7f3e8" stroke="#16202b" stroke-width="2.4"/>
      <path d="M500 10 l 8 56" stroke="#a8321f" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="120" y="52" font-size="22" fill="#16202b">…инв. 14/2</text>
      <text x="512" y="46" font-size="15" fill="#a8321f">обрыв 20 мм</text>
    </g>
    <g font-size="16" fill="#3b4652">
      <text x="60" y="716">Бумажная полоска от этикетки инвентарного номера. Совмещается</text>
      <text x="60" y="738">с остатком этикетки на обороте карточки ОС-1 № 14/207 по волокну</text>
      <text x="60" y="760">и по клеевому следу прямоугольной формы.</text>
    </g>
  </g>

  <g>
    <text x="900" y="586" font-size="19" font-weight="600" fill="#16202b">Кадр 8: коробка квартиры 49</text>
    <g transform="translate(900 606)">
      <path d="M30 0 h 34 v 22 q 18 14 18 50 v 76 q 0 18 -35 18 q -35 0 -35 -18 v -76 q 0 -36 18 -50 Z" fill="#cfd8dc" stroke="#16202b" stroke-width="2.2"/>
      <text x="14" y="76" font-size="14" fill="#16202b">3106/02</text>
      <path d="M140 0 h 34 v 22 q 18 14 18 50 v 76 q 0 18 -35 18 q -35 0 -35 -18 v -76 q 0 -36 18 -50 Z" fill="#cfd8dc" stroke="#16202b" stroke-width="2.2"/>
      <text x="124" y="76" font-size="14" fill="#16202b">3106/05</text>
      <rect x="220" y="6" width="300" height="160" fill="url(#paper)" stroke="#16202b" stroke-width="2"/>
      <g font-size="15" fill="#16202b">
        <text x="238" y="40">В коробке шесть ампул:</text>
        <text x="252" y="66">01, 02, 05, 06, 07, 08</text>
        <text x="238" y="102">Отсутствуют 03 и 04 -</text>
        <text x="252" y="126">они изъяты в квартире 47</text>
      </g>
    </g>
  </g>

  <text x="60" y="836" font-size="16" fill="#a8321f">Печать этикеток на ампулах из квартиры 47 и из клиники - одна струйная печать, установленная специалистом 22.11.2025</text>
</svg>
