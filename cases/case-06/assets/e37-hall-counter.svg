<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="tiles" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#4a6076" stroke-width="0.9" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Камера № 1 «Зал, стойки 1—2»: 12.11.2025</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Объектив 4 мм, угол 88°, 1280 на 720. Метка регистратора, расхождение с ККМ — 2 секунды.</text>

  <g>
    <rect x="60" y="140" width="740" height="384" fill="#16202b" stroke="#16202b" stroke-width="3"/>
    <rect x="72" y="152" width="716" height="360" fill="#243444"/>
    <rect x="72" y="330" width="716" height="182" fill="url(#tiles)"/>
    <g>
      <rect x="110" y="266" width="230" height="76" rx="4" fill="#33465c" stroke="#8fa3b5" stroke-width="2"/>
      <rect x="150" y="232" width="60" height="34" rx="3" fill="#1d2b38" stroke="#8fa3b5" stroke-width="1.6"/>
      <text x="112" y="366" font-size="15" fill="#c9d4de">стойка № 1</text>
      <rect x="400" y="280" width="220" height="70" rx="4" fill="#33465c" stroke="#8fa3b5" stroke-width="2"/>
      <rect x="470" y="248" width="64" height="32" rx="3" fill="#1d2b38" stroke="#8fa3b5" stroke-width="1.6"/>
      <text x="402" y="372" font-size="15" fill="#c9d4de">стойка № 2</text>
      <rect x="640" y="252" width="70" height="98" fill="#2f4258" stroke="#8fa3b5" stroke-width="1.6"/>
      <text x="632" y="372" font-size="14" fill="#c9d4de">стеллаж</text>
    </g>
    <g>
      <path d="M470 402 q 14 -20 30 0 l 3 34 q -18 8 -36 0 Z" fill="#3f5a72" stroke="#8fa3b5" stroke-width="1.4"/>
      <circle cx="485" cy="392" r="9" fill="#3f5a72" stroke="#8fa3b5" stroke-width="1.4"/>
      <rect x="516" y="420" width="26" height="20" fill="#2f4258" stroke="#8fa3b5" stroke-width="1.2"/>
      <path d="M529 420 v -34" stroke="#8fa3b5" stroke-width="1.6"/>
      <text x="548" y="440" font-size="14" fill="#c9d4de">уборщица, 13:41:02</text>
    </g>
    <rect x="72" y="152" width="716" height="360" fill="none" stroke="#4a6076" stroke-width="1.4"/>
    <text x="86" y="176" font-size="16" fill="#e8e2d4">12.11.2025  13:47:35</text>
    <text x="86" y="200" font-size="14" fill="#8fa3b5">CAM 01</text>
    <path d="M788 250 v 176" stroke="#a8321f" stroke-width="3"/>
    <text x="700" y="242" font-size="14" fill="#a8321f">левый край кадра</text>
  </g>

  <g>
    <text x="860" y="176" font-size="19" font-weight="600" fill="#16202b">Хронология по меткам регистра</text>
    <line x1="880" y1="200" x2="880" y2="596" stroke="#16202b" stroke-width="2"/>
    <g font-size="16" fill="#3b4652">
      <circle cx="880" cy="222" r="5" fill="#2f4258"/>
      <text x="900" y="218">07:44:11 — входит в светлом пальто поверх халата</text>
      <circle cx="880" cy="250" r="5" fill="#2f4258"/>
      <text x="900" y="246">08:06:52 — выходит на улицу, кадр 2</text>
      <circle cx="880" cy="278" r="5" fill="#2f4258"/>
      <text x="900" y="274">08:41:07 — возвращается с бумажным пакетом</text>
      <circle cx="880" cy="306" r="5" fill="#a8321f"/>
      <text x="900" y="302" fill="#16202b">13:22:00 — зал пуст, у стойки № 2 ведро с шваброй</text>
      <circle cx="880" cy="334" r="5" fill="#2f4258"/>
      <text x="900" y="330">13:41:02 — уборщица наклоняется к ведру, кадр 4</text>
      <circle cx="880" cy="362" r="5" fill="#a8321f"/>
      <text x="900" y="358" fill="#16202b">13:47:35 — в зале никого, экран терминала погас</text>
      <circle cx="880" cy="390" r="5" fill="#2f4258"/>
      <text x="900" y="386">14:05:00 — входит покупатель, кадр 6</text>
      <circle cx="880" cy="418" r="5" fill="#2f4258"/>
      <text x="900" y="414">15:02:40 — у стойки № 1 две сотрудницы, считка</text>
      <text x="900" y="436">наличности, смена закрыта в 15:02:40</text>
    </g>
    <g font-size="16" fill="#3b4652">
      <text x="860" y="482">Промежуток без движения в зале: 13:22:00 — 14:05:00,</text>
      <text x="860" y="504">43 минуты. Уборщица в кадре один раз, 28 секунд.</text>
      <text x="860" y="540">Дверь комнаты хранения — за левым краем кадра,</text>
      <text x="860" y="562">в поле зрения не попадает ни разу за сутки.</text>
    </g>
  </g>

  <line x1="60" y1="640" x2="1540" y2="640" stroke="#16202b" stroke-width="2"/>

  <g>
    <text x="60" y="686" font-size="19" font-weight="600" fill="#16202b">Схема зала и зон обзора</text>
    <g fill="none" stroke="#16202b" stroke-width="2.2">
      <rect x="60" y="706" width="620" height="140"/>
      <rect x="120" y="736" width="140" height="34"/>
      <rect x="320" y="736" width="140" height="34"/>
      <rect x="680" y="706" width="220" height="140" stroke-dasharray="8 6"/>
    </g>
    <text x="132" y="758" font-size="14" fill="#16202b">стойка № 1</text>
    <text x="332" y="758" font-size="14" fill="#16202b">стойка № 2</text>
    <text x="692" y="730" font-size="14" fill="#3b4652">комната хранения</text>
    <text x="692" y="752" font-size="14" fill="#3b4652">АРМ № 3, весы, сейф</text>
    <circle cx="100" cy="826" r="8" fill="#a8321f"/>
    <text x="118" y="832" font-size="14" fill="#a8321f">камера № 1</text>
    <path d="M100 826 L660 700" stroke="#a8321f" stroke-width="1.4" stroke-dasharray="6 6"/>
    <path d="M100 826 L660 846" stroke="#a8321f" stroke-width="1.4" stroke-dasharray="6 6"/>
    <path d="M680 776 h -20 v -30" stroke="#2f4258" stroke-width="2"/>
    <text x="500" y="800" font-size="14" fill="#3b4652">дверь вне кадра</text>
    <text x="80" y="726" font-size="14" fill="#3b4652">улица</text>
  </g>

  <g font-size="16" fill="#3b4652">
    <text x="960" y="686">Три носителя за один день</text>
    <g fill="#2f4258">
      <rect x="960" y="702" width="560" height="26"/>
      <rect x="960" y="734" width="560" height="26"/>
      <rect x="960" y="766" width="560" height="26"/>
    </g>
    <g font-size="15" fill="#e8e2d4">
      <text x="972" y="720">13:19:40 — чек ККМ № 00000087, последний чек смены 41</text>
      <text x="972" y="752">13:47:35 — документ 004118 создан на АРМ № 3</text>
      <text x="972" y="784">13:48:02 — печать чека отменена, оператор не выбран</text>
    </g>
    <g font-size="16" fill="#a8321f">
      <text x="960" y="820">От последнего чека до создания документа — 27 минут 55 секунд.</text>
      <text x="960" y="842">Весь этот промежуток зал по камере пуст.</text>
    </g>
  </g>
</svg>
