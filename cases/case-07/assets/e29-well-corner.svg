<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid29" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid29)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Камера бокса «Калитка»: угол Мельничной, 9</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Запись по движению, хранение две недели. В деле фрагменты за 14—15.01.2026, снятые до окончания срока.</text>

  <g>
    <rect x="60" y="140" width="800" height="420" fill="#16202b" stroke="#16202b" stroke-width="3"/>
    <rect x="72" y="152" width="776" height="396" fill="#243444"/>
    <path d="M72 424 L848 388 L848 548 L72 548 Z" fill="#2f4258"/>

    <rect x="96" y="212" width="250" height="176" fill="#33465c" stroke="#4a6076" stroke-width="2"/>
    <path d="M150 388 h 74 v -58 h -74 Z" fill="#1d2b38" stroke="#8fa3b5" stroke-width="1.8"/>
    <text x="104" y="200" font-size="15" fill="#8fa3b5">бокс мойки, ворота в створ</text>

    <circle cx="560" cy="452" r="48" fill="#33465c" stroke="#8fa3b5" stroke-width="3"/>
    <path d="M516 442 h 88" stroke="#8fa3b5" stroke-width="2"/>
    <path d="M548 424 l 24 -18 l 24 18" fill="none" stroke="#c9d4de" stroke-width="3"/>
    <text x="470" y="530" font-size="15" fill="#c9d4de">колодец № 118, крышка сдвинута</text>

    <path d="M756 168 h 84 v 26 h -84 Z" fill="#e8e2d4" opacity=".8"/>
    <text x="700" y="156" font-size="15" fill="#c9d4de">проезд к ЦТП-6</text>

    <g>
      <path d="M300 428 h 210 v 56 h -210 Z" fill="#3a4f66" stroke="#8fa3b5" stroke-width="2"/>
      <path d="M332 428 v -34 h 150 v 34" fill="#2f4258" stroke="#8fa3b5" stroke-width="2"/>
      <circle cx="336" cy="492" r="17" fill="#16202b" stroke="#8fa3b5" stroke-width="2"/>
      <circle cx="476" cy="492" r="17" fill="#16202b" stroke="#8fa3b5" stroke-width="2"/>
      <text x="300" y="410" font-size="15" fill="#c9d4de">автомобиль Т 300 ЕК 7..</text>
    </g>

    <g>
      <path d="M628 400 q 15 -21 32 0 l 4 40 q -19 9 -38 0 Z" fill="#e08a2e" stroke="#8fa3b5" stroke-width="1.6"/>
      <circle cx="644" cy="384" r="11" fill="#dfe6ea" stroke="#8fa3b5" stroke-width="1.6"/>
      <path d="M632 394 h 26" stroke="#f2e6c8" stroke-width="3"/>
      <text x="612" y="470" font-size="14" fill="#c9d4de">оранжевая куртка</text>
    </g>

    <g>
      <path d="M356 396 q 15 -21 32 0 l 4 42 q -19 9 -38 0 Z" fill="#232f3b" stroke="#8fa3b5" stroke-width="1.6"/>
      <path d="M356 392 q 16 -18 32 0 q -16 8 -32 0 Z" fill="#4a6076"/>
      <text x="318" y="372" font-size="14" fill="#c9d4de">тёмная куртка, дутая шапка</text>
    </g>

    <text x="88" y="180" font-size="16" fill="#e8e2d4">14.01.2026  23:47:12</text>
    <circle cx="826" cy="530" r="7" fill="#a8321f"/>
    <text x="784" y="526" font-size="14" fill="#a8321f">фрагмент 3</text>
  </g>

  <g>
    <text x="900" y="176" font-size="19" font-weight="600" fill="#16202b">Фрагменты архива</text>
    <line x1="920" y1="200" x2="920" y2="700" stroke="#16202b" stroke-width="2"/>
    <g font-size="16" fill="#3b4652">
      <circle cx="920" cy="222" r="5" fill="#a8321f"/>
      <text x="940" y="218" fill="#16202b">23:40:08 — автомобиль встаёт у ворот бокса,</text>
      <text x="940" y="240">двигатель не глушится</text>
      <circle cx="920" cy="270" r="5" fill="#a8321f"/>
      <text x="940" y="266" fill="#16202b">23:41:12 — человек в оранжевой куртке идёт от машины</text>
      <text x="940" y="288">к колодцу, в руке предмет длинный</text>
      <circle cx="920" cy="318" r="5" fill="#a8321f"/>
      <text x="940" y="314" fill="#16202b">23:47:12 — крышка открыта, второй стоит у автомобиля,</text>
      <text x="940" y="336">спиной к камере, руки в карманах</text>
      <circle cx="920" cy="366" r="5" fill="#2f4258"/>
      <text x="940" y="362">23:49:30 — движение у колодца, далее запись прервана</text>
      <circle cx="920" cy="396" r="5" fill="#2f4258"/>
      <text x="940" y="392">23:56:05 — возобновление: оранжевая куртка у горловины</text>
      <circle cx="920" cy="426" r="5" fill="#2f4258"/>
      <text x="940" y="422">00:02:18 — оранжевая куртка вдвигает крышку</text>
      <circle cx="920" cy="456" r="5" fill="#a8321f"/>
      <text x="940" y="452" fill="#16202b">00:02:40 — автомобиль с двумя силуэтами уходит</text>
      <text x="940" y="474">на Мельничную в сторону Ковыльной</text>
    </g>
  </g>

  <line x1="60" y1="612" x2="860" y2="612" stroke="#16202b" stroke-width="2"/>

  <g>
    <text x="60" y="658" font-size="19" font-weight="600" fill="#16202b">Две записи одного времени</text>
    <g font-size="16" fill="#3b4652">
      <text x="60" y="696">В 23:47:12 на колодец смотрит и окно квартиры 41: телефон</text>
      <text x="60" y="718">потерпевшего пишет 12 секунд, двое у крышки, те же силуэты.</text>
      <text x="60" y="754">От окна до колодца 28 м, от ворот бокса до колодца 41 м —</text>
      <text x="60" y="776">оба расстояния измерены по фототаблице с рулеткой в кадре.</text>
    </g>
  </g>

  <g>
    <text x="940" y="658" font-size="19" font-weight="600" fill="#16202b">Ограничения носителя</text>
    <g font-size="16" fill="#3b4652">
      <text x="940" y="696">Регистратор пишет по движению: пауза 23:49:30 —</text>
      <text x="940" y="718">23:56:05 объясняется тем, что кадр был неподвижен.</text>
    </g>
    <g font-size="16" fill="#a8321f">
      <text x="940" y="754">Директор бокса подтвердил: хранится две недели,</text>
      <text x="940" y="776">ночной архив он не смотрел и не удалял.</text>
      <text x="940" y="818">Фрагменты изъяты 20.01, до окончания</text>
      <text x="940" y="840">срока хранения — записей за 06—13.01 в деле нет.</text>
    </g>
  </g>
</svg>
