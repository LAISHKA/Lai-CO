<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="gridPlan08" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <marker id="arwPlan08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4652"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridPlan08)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Усадьба «Жар-Птица»: план площадки и зоны четырёх камер</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Фототаблица от 23.08.2026, кадр 1 — кадр 8. Объектив 24 мм. Схема составлена специалистом по данным паспортов камер и акта осмотра.</text>

  <g>
    <text x="60" y="164" font-size="19" font-weight="600" fill="#16202b">План: ворота, парковка, шатры, служебный коридор, холодный цех, тамбур</text>

    <rect x="60" y="186" width="900" height="520" fill="none" stroke="#16202b" stroke-width="3"/>

    <rect x="150" y="560" width="150" height="120" fill="none" stroke="#16202b" stroke-width="2"/>
    <text x="162" y="590" font-size="15" fill="#3b4652">главный дом</text>
    <text x="162" y="612" font-size="14" fill="#3b4652">кабинет, дверь 4</text>

    <rect x="430" y="250" width="300" height="180" fill="#dcd3bf" stroke="#16202b" stroke-width="2.5"/>
    <text x="446" y="280" font-size="15" fill="#16202b">шатёр № 1</text>

    <rect x="430" y="470" width="380" height="220" fill="#cfd8d0" stroke="#16202b" stroke-width="3"/>
    <text x="446" y="500" font-size="16" font-weight="600" fill="#16202b">шатёр № 2, 18 х 24 м</text>
    <text x="446" y="522" font-size="14" fill="#3b4652">120 мест, бронь 96</text>
    <rect x="470" y="546" width="120" height="34" fill="none" stroke="#a8321f" stroke-width="2"/>
    <text x="478" y="568" font-size="13" fill="#a8321f">стол президиума</text>
    <text x="470" y="614" font-size="13" fill="#3b4652">пушка № 7 у стола 5</text>
    <text x="470" y="634" font-size="13" fill="#3b4652">пушка № 8 у стола 11</text>

    <rect x="810" y="500" width="120" height="44" fill="none" stroke="#16202b" stroke-width="2.5"/>
    <text x="818" y="528" font-size="13" fill="#16202b">холодный цех</text>
    <text x="818" y="600" font-size="13" fill="#a8321f">дверь 3</text>
    <path d="M810 606 h -4" stroke="#a8321f" stroke-width="3"/>

    <rect x="810" y="544" width="120" height="2" stroke="#16202b" stroke-width="0"/>
    <path d="M930 522 H810" stroke="#16202b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="836" y="512" font-size="12" fill="#3b4652">коридор 1,8 х 11,4 м</text>

    <rect x="330" y="600" width="90" height="60" fill="none" stroke="#16202b" stroke-width="2"/>
    <text x="336" y="622" font-size="12" fill="#3b4652">тамбур:</text>
    <text x="336" y="638" font-size="12" fill="#3b4652">гардероб, щит № 4</text>

    <path d="M60 340 H150" stroke="#16202b" stroke-width="3"/>
    <text x="66" y="328" font-size="13" fill="#16202b">ворота, створ 6,4 м</text>
    <rect x="180" y="200" width="180" height="90" fill="none" stroke="#16202b" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="190" y="226" font-size="13" fill="#3b4652">парковка гостей</text>
    <rect x="180" y="640" width="130" height="52" fill="none" stroke="#16202b" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="188" y="662" font-size="12" fill="#3b4652">стоянка персонала</text>
    <text x="188" y="680" font-size="12" fill="#a8321f">Н 904 МР 716, Р 218 ТТ 716</text>

    <g stroke="#3b4652" stroke-width="1.5" marker-end="url(#arwPlan08)" fill="none">
      <path d="M120 470 H420"/>
      <path d="M600 460 V430"/>
    </g>
    <text x="196" y="462" font-size="12" fill="#3b4652">ворота — шатёр № 2: 46 м</text>

    <g stroke="#a8321f" stroke-width="1.5" marker-end="url(#arwPlan08)" fill="none">
      <path d="M806 560 H816"/>
      <path d="M420 640 V560 H806"/>
    </g>
    <text x="560" y="692" font-size="12" fill="#a8321f">дверь 3 — дверь 6: 18 м; дверь 6 — стойка гардероба: 21 м</text>

    <g fill="#16202b">
      <circle cx="92" cy="316" r="7"/>
      <circle cx="770" cy="486" r="7"/>
      <circle cx="884" cy="470" r="7"/>
      <circle cx="352" cy="586" r="7"/>
    </g>
    <text x="70" y="300" font-size="13" font-weight="600" fill="#16202b">камера № 1</text>
    <text x="700" y="474" font-size="13" font-weight="600" fill="#16202b">камера № 2</text>
    <text x="856" y="456" font-size="13" font-weight="600" fill="#16202b">№ 3</text>
    <text x="300" y="576" font-size="13" font-weight="600" fill="#16202b">камера № 4</text>
    <text x="700" y="732" font-size="13" fill="#3b4652">След протектора 40-го размера на 2,6 м от двери цеха, направление к шатру (кадр 3).</text>
  </g>

  <g>
    <text x="1000" y="164" font-size="19" font-weight="600" fill="#16202b">Паспорта камер</text>
    <rect x="1000" y="180" width="540" height="226" fill="none" stroke="#16202b" stroke-width="2"/>
    <text x="1016" y="210" font-size="15" fill="#16202b">№ 1 «Ворота» — улица, угол 96°, регистратор № 1</text>
    <text x="1016" y="240" font-size="15" fill="#16202b">№ 2 «Шатёр № 2» — потолок, угол 118°, президиум и дверь 6</text>
    <text x="1016" y="270" font-size="15" fill="#a8321f">№ 3 «Коридор» — на маятниковую дверь, угол 74°, слепая зона</text>
    <text x="1016" y="294" font-size="14" fill="#a8321f">полоса 1,2 м у самого полотна двери</text>
    <text x="1016" y="324" font-size="15" fill="#16202b">№ 4 «Тамбур» — стойка гардероба и щит № 4, угол 88°</text>
    <text x="1016" y="356" font-size="14" fill="#3b4652">Шаг кадра 125 миллисекунд, архив за 22—23.08 изъят целиком.</text>
    <text x="1016" y="380" font-size="14" fill="#3b4652">Часы регистратора синхронизированы с сетевым временем.</text>

    <text x="1000" y="448" font-size="19" font-weight="600" fill="#16202b">Ориентировки силуэта с кадров № 3 и № 6</text>
    <rect x="1000" y="464" width="540" height="242" fill="none" stroke="#16202b" stroke-width="2"/>
    <text x="1016" y="494" font-size="15" fill="#16202b">Рост по кадру: 168—172 см</text>
    <text x="1016" y="522" font-size="15" fill="#16202b">Обувь тёмная, низкая, примерно 37—39-й размер</text>
    <text x="1016" y="550" font-size="15" fill="#16202b">Одет: чёрный жилет поверх светлого верха, тёмные брюки</text>
    <text x="1016" y="578" font-size="15" fill="#16202b">На груди бейдж на шнуре; голова собрана под косынку</text>
    <text x="1016" y="612" font-size="14" fill="#a8321f">Лицо не читается ни в одном кадре: угол съёмки</text>
    <text x="1016" y="634" font-size="14" fill="#a8321f">и контражур от открытой двери.</text>
    <text x="1016" y="676" font-size="14" fill="#3b4652">Штатив фотографа у стены гардероба, 11 м от двери цеха.</text>

    <text x="1000" y="752" font-size="19" font-weight="600" fill="#16202b">Что держит план</text>
    <rect x="1000" y="768" width="540" height="86" fill="none" stroke="#16202b" stroke-width="2"/>
    <text x="1016" y="796" font-size="14" fill="#16202b">Один служебный путь из цеха в шатёр, мимо линии счётчика</text>
    <text x="1016" y="820" font-size="14" fill="#16202b">в 1,4 м от двери 6. Щит № 4 в тамбуре не был опечатан;</text>
    <text x="1016" y="844" font-size="14" fill="#16202b">автомат группы 4-2 розеток обогрева шатра № 2 включён.</text>
  </g>
</svg>
