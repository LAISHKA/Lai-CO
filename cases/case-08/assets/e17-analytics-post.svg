<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="gridPost08" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <marker id="arwPost08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4652"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridPost08)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Пост видеоаналитики у гардероба: схема и лента печати событий</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Выгрузка снята 23.08.2026 в 08:40 инженером ООО «Бастион-СБ». Лента встроенного принтера изъята целиком; печать событий включена 20.08.2026.</text>

  <g>
    <text x="60" y="164" font-size="19" font-weight="600" fill="#16202b">Тамбур, вид сверху</text>
    <rect x="60" y="182" width="700" height="420" fill="none" stroke="#16202b" stroke-width="3"/>

    <rect x="60" y="300" width="8" height="150" fill="#a8321f"/>
    <text x="78" y="330" font-size="14" fill="#a8321f">дверь 6 в шатёр № 2</text>
    <text x="78" y="352" font-size="13" fill="#3b4652">маятниковая, двойная</text>

    <path d="M190 300 V450" stroke="#16202b" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M190 300 V450" stroke="#3b4652" stroke-width="1" marker-end="url(#arwPost08)"/>
    <text x="200" y="322" font-size="13" fill="#16202b">линия инфракрасного счётчика</text>
    <text x="200" y="342" font-size="13" fill="#a8321f">1,4 м от полотна двери</text>

    <rect x="330" y="196" width="180" height="120" fill="#dcd3bf" stroke="#16202b" stroke-width="2"/>
    <text x="342" y="222" font-size="13" fill="#16202b">напольный шкафчик</text>
    <text x="342" y="242" font-size="13" fill="#16202b">поста: сервер, монитор,</text>
    <text x="342" y="262" font-size="13" fill="#16202b">системный блок, принтер</text>
    <text x="342" y="292" font-size="12" fill="#3b4652">заперт, ключ у администрации</text>

    <rect x="560" y="196" width="180" height="86" fill="none" stroke="#16202b" stroke-width="2"/>
    <text x="572" y="222" font-size="13" fill="#16202b">стойка гардероба</text>
    <text x="572" y="244" font-size="12" fill="#3b4652">12 крючков, жетоны</text>
    <text x="572" y="264" font-size="12" fill="#3b4652">выдано 104, сдано 97</text>

    <rect x="560" y="330" width="180" height="90" fill="#cfd8d0" stroke="#16202b" stroke-width="2"/>
    <text x="572" y="356" font-size="13" fill="#16202b">щит № 4</text>
    <text x="572" y="378" font-size="12" fill="#3b4652">группа 4-1 — пост,</text>
    <text x="572" y="396" font-size="12" fill="#3b4652">группа 4-2 — пушки</text>

    <path d="M560 372 H510" stroke="#3b4652" stroke-width="1.5" marker-end="url(#arwPost08)"/>
    <text x="60" y="634" font-size="13" fill="#3b4652">Питания от отдельной линии нет: пост сидит на той же группе щита, что и обогрев шатра. При пропадании питания счётчик считает во внутренней памяти.</text>

    <text x="60" y="682" font-size="19" font-weight="600" fill="#16202b">Итог смены на печати</text>
    <g fill="none" stroke="#16202b" stroke-width="2">
      <rect x="60" y="700" width="160" height="96"/>
      <rect x="230" y="700" width="160" height="96"/>
      <rect x="400" y="700" width="160" height="96"/>
      <rect x="570" y="700" width="190" height="96"/>
    </g>
    <text x="76" y="742" font-size="26" font-weight="700" fill="#16202b">118</text>
    <text x="76" y="772" font-size="13" fill="#3b4652">входов</text>
    <text x="246" y="742" font-size="26" font-weight="700" fill="#16202b">109</text>
    <text x="246" y="772" font-size="13" fill="#3b4652">выходов</text>
    <text x="416" y="742" font-size="26" font-weight="700" fill="#16202b">104</text>
    <text x="416" y="772" font-size="13" fill="#3b4652">жетона выдано</text>
    <text x="586" y="742" font-size="26" font-weight="700" fill="#a8321f">96</text>
    <text x="586" y="772" font-size="13" fill="#a8321f">мест по брони № 8-42</text>
  </g>

  <g>
    <text x="800" y="164" font-size="19" font-weight="600" fill="#16202b">Лента принтера событий: две шкалы времени</text>
    <rect x="800" y="182" width="740" height="614" fill="#f3efe4" stroke="#16202b" stroke-width="2.5"/>
    <path d="M800 220 H1540" stroke="#16202b" stroke-width="1.5"/>
    <text x="816" y="210" font-size="14" font-weight="600" fill="#16202b">часы поста</text>
    <text x="1030" y="210" font-size="14" font-weight="600" fill="#16202b">сетевое время</text>
    <text x="1230" y="210" font-size="14" font-weight="600" fill="#16202b">событие</text>

    <g font-size="14" fill="#16202b">
      <text x="816" y="256">19:00:04</text>
      <text x="1030" y="256">19:00:51</text>
      <text x="1230" y="256">пуск смены, счётчик в работе</text>

      <text x="816" y="300">20:38:05</text>
      <text x="1030" y="300">20:38:52</text>
      <text x="1230" y="300">проход, жетон не предъявлен</text>

      <text x="816" y="344">21:05:53</text>
      <text x="1030" y="344">21:06:40</text>
      <text x="1230" y="344">кадр «коридор, движение у двери»</text>

      <text x="816" y="388">21:07:12</text>
      <text x="1030" y="388">21:07:59</text>
      <text x="1230" y="388">кадр «тамбур, человек у стойки»</text>

      <text x="816" y="432">21:26:40</text>
      <text x="1030" y="432">21:27:27</text>
      <text x="1230" y="432">кадр «экран, съёмка на телефон»</text>

      <text x="816" y="476">23:16:00</text>
      <text x="1030" y="476">23:16:47</text>
      <text x="1230" y="476">проход в шатёр № 2</text>

      <text x="816" y="520">23:39:11</text>
      <text x="1030" y="520">23:39:58</text>
      <text x="1230" y="520">выход из шатра № 2</text>

      <text x="816" y="564">00:26:04</text>
      <text x="1030" y="564">00:26:51</text>
      <text x="1230" y="564">проход, срабатывание по предмету</text>
      <text x="1230" y="584">на полу</text>
    </g>

    <path d="M810 604 H1530" stroke="#a8321f" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="816" y="636" font-size="14" fill="#a8321f">Справка ООО «Бастион-СБ» от 24.08.2026: часы сервера поста</text>
    <text x="816" y="658" font-size="14" fill="#a8321f">автономные, сетевой синхронизации нет, расхождение минус 47 секунд.</text>
    <text x="816" y="694" font-size="14" fill="#16202b">Регистратор № 1 и фискальный накопитель кассы идут по сетевому</text>
    <text x="816" y="714" font-size="14" fill="#16202b">времени; сверка накопителя 22.08 в 18:40 дала расхождение 0 секунд.</text>
    <text x="816" y="756" font-size="14" fill="#3b4652">Лица на кадрах 21:05:53 и 21:07:12 не читаются: контражур от двери.</text>

    <text x="800" y="838" font-size="14" fill="#3b4652">Пост не имеет отдельного оператора: настройки и печать событий включала администрация площадки.</text>
  </g>
</svg>
