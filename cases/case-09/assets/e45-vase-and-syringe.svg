<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid45" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid45)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Фототаблица № 2: ваза, пергамент и шприцы. Кадры 11—18</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Осмотр кухни 25.09.2026, 13:30 — 13:52. Семь «грибочков» из вазы, пергамент под ней, контейнер из комнаты жены.</text>

  <g>
    <text x="120" y="176" font-size="18" font-weight="600" fill="#16202b">Кадр 11. Ваза сверху, семь шляпок</text>
    <circle cx="360" cy="400" r="190" fill="none" stroke="#16202b" stroke-width="3"/>
    <circle cx="360" cy="400" r="170" fill="none" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="6 5"/>

    <g>
      <circle cx="360" cy="270" r="42" fill="#c9bfa4" stroke="#16202b" stroke-width="2"/>
      <path d="M330 300 a42 42 0 0 0 60 0" fill="none" stroke="#16202b" stroke-width="2"/>
      <text x="352" y="278" font-size="15" fill="#16202b">1</text>
    </g>
    <g>
      <circle cx="240" cy="340" r="42" fill="#c9bfa4" stroke="#16202b" stroke-width="2"/>
      <text x="232" y="348" font-size="15" fill="#16202b">2</text>
    </g>
    <g>
      <circle cx="480" cy="340" r="42" fill="#c9bfa4" stroke="#16202b" stroke-width="2"/>
      <text x="472" y="348" font-size="15" fill="#16202b">3</text>
    </g>
    <g>
      <circle cx="228" cy="470" r="42" fill="#a8321f" stroke="#16202b" stroke-width="2"/>
      <text x="220" y="478" font-size="15" fill="#e8e2d4">4</text>
    </g>
    <g>
      <circle cx="492" cy="470" r="42" fill="#c9bfa4" stroke="#16202b" stroke-width="2"/>
      <text x="484" y="478" font-size="15" fill="#16202b">5</text>
    </g>
    <g>
      <circle cx="300" cy="540" r="42" fill="#a8321f" stroke="#16202b" stroke-width="2"/>
      <text x="292" y="548" font-size="15" fill="#e8e2d4">6</text>
    </g>
    <g>
      <circle cx="420" cy="540" r="42" fill="#a8321f" stroke="#16202b" stroke-width="2"/>
      <text x="412" y="548" font-size="15" fill="#e8e2d4">7</text>
    </g>
    <text x="252" y="632" font-size="16" fill="#a8321f">тёмным помечены номера 4, 6, 7 — у них дно с пятном</text>
    <text x="252" y="658" font-size="16" fill="#3b4652">номера на планшете проставлены от руки мелом</text>
    <text x="252" y="684" font-size="16" fill="#3b4652">крышка стеклянная, снята и положена вверх стеклом</text>
  </g>

  <g>
    <text x="640" y="176" font-size="18" font-weight="600" fill="#16202b">Кадр 12. Шляпка с фонарём сверху</text>
    <path d="M660 300 q 90 -110 200 0 Z" fill="#c9bfa4" stroke="#16202b" stroke-width="2.5"/>
    <rect x="660" y="300" width="200" height="16" fill="#a8321f" stroke="#16202b" stroke-width="2"/>
    <text x="700" y="272" font-size="15" fill="#16202b">верх: сухой, крахмальный</text>
    <text x="676" y="296" font-size="15" fill="#16202b">бок: без пятна</text>
    <text x="686" y="340" font-size="16" fill="#a8321f">дно: пятно 12—16 мм, край неровный</text>
    <path d="M760 316 v18" stroke="#a8321f" stroke-width="2"/>
    <text x="620" y="386" font-size="15" fill="#3b4652">Пятно не проходит по боковой поверхности и не</text>
    <text x="620" y="410" font-size="15" fill="#3b4652">захватывает край; при касании стеклянной палочкой</text>
    <text x="620" y="434" font-size="15" fill="#3b4652">поверхность пятна липкая, у остальных — сухая.</text>

    <text x="640" y="486" font-size="18" font-weight="600" fill="#16202b">Кадр 13. Пергамент под вазой</text>
    <rect x="660" y="510" width="380" height="150" fill="#dcd4c0" stroke="#16202b" stroke-width="2"/>
    <circle cx="740" cy="580" r="11" fill="#a8321f"/>
    <circle cx="850" cy="620" r="11" fill="#a8321f"/>
    <circle cx="960" cy="580" r="11" fill="#a8321f"/>
    <text x="716" y="556" font-size="14" fill="#16202b">бурые точки, сухие</text>
    <text x="660" y="688" font-size="15" fill="#3b4652">Лист 21 на 18 см, снят со стороны, прилегавшей к столу;</text>
    <text x="660" y="712" font-size="15" fill="#3b4652">на просвет пропитан в трёх местах, вне их — ровный.</text>
  </g>

  <g>
    <text x="1120" y="176" font-size="18" font-weight="600" fill="#16202b">Кадр 16. Седьмой шприц, пакет № 10</text>
    <g>
      <rect x="1140" y="210" width="300" height="46" fill="#dfe6ea" stroke="#16202b" stroke-width="2.5"/>
      <rect x="1440" y="228" width="70" height="10" fill="#8fa3b5" stroke="#16202b" stroke-width="2"/>
      <path d="M1510 233 l 34 0" stroke="#16202b" stroke-width="3"/>
      <rect x="1108" y="200" width="18" height="66" fill="#a8321f" stroke="#16202b" stroke-width="2"/>
      <g stroke="#3b4652" stroke-width="1.2">
        <path d="M1180 210 v14 M1220 210 v14 M1260 210 v14 M1300 210 v14 M1340 210 v14 M1380 210 v14"/>
      </g>
      <rect x="1300" y="240" width="140" height="16" fill="#a8321f" opacity=".55"/>
      <text x="1140" y="292" font-size="15" fill="#a8321f">номер на цилиндре: 7372</text>
      <text x="1140" y="316" font-size="15" fill="#3b4652">поршень на 0,2; игла загнута в сторону на 3 градуса</text>
      <text x="1140" y="340" font-size="15" fill="#3b4652">с обратной стороны цилиндра продавлена цифра «2»</text>
      <text x="1140" y="376" font-size="15" fill="#16202b">обёртка из-под пачки отсутствует; в канале</text>
      <text x="1140" y="400" font-size="15" fill="#16202b">желтоватый налёт, в цилиндре изнутри мутная плёнка</text>
    </g>

    <g>
      <text x="1120" y="464" font-size="18" font-weight="600" fill="#16202b">Кадр 15. Шесть других из контейнера</text>
      <g font-size="15" fill="#3b4652">
        <rect x="1140" y="482" width="60" height="20" fill="#8fa3b5"/><text x="1210" y="498">7014</text>
        <rect x="1310" y="482" width="60" height="20" fill="#8fa3b5"/><text x="1380" y="498">7031</text>
        <rect x="1140" y="514" width="60" height="20" fill="#8fa3b5"/><text x="1210" y="530">7046</text>
        <rect x="1310" y="514" width="60" height="20" fill="#8fa3b5"/><text x="1380" y="530">7055</text>
        <rect x="1140" y="546" width="60" height="20" fill="#8fa3b5"/><text x="1210" y="562">7079</text>
        <rect x="1310" y="546" width="60" height="20" fill="#8fa3b5"/><text x="1380" y="562">7098</text>
      </g>
      <text x="1140" y="598" font-size="15" fill="#16202b">Контейнер 0,3 л с крышкой, на дне слой ваты.</text>
      <text x="1140" y="622" font-size="15" fill="#3b4652">Пять со вскрытой упаковкой, два без следов вскрытия.</text>
    </g>

    <text x="1120" y="676" font-size="18" font-weight="600" fill="#16202b">Кадр 17. Цилиндр с фотомасштабом</text>
    <g font-size="15" fill="#3b4652">
      <text x="1120" y="706">след папиллярного рисунка, ширина 23,1 мм</text>
      <text x="1120" y="730">четыре пальца без большого, край рисунка читаем</text>
      <text x="1120" y="754">кадр снят с линейкой в кадре, без порошка</text>
    </g>
    <text x="1120" y="786" font-size="15" fill="#16202b">Кадр 18: пакет № 10 с биркой и подписями понятых.</text>
  </g>

  <line x1="60" y1="720" x2="1060" y2="720" stroke="#16202b" stroke-width="2"/>
  <g font-size="16" fill="#3b4652">
    <text x="60" y="756">Каждый «грибочек» завернут в отдельный кусок пергамента и уложен в пакет № 1;</text>
    <text x="60" y="782">лист с тремя точками — пакет № 2; смыв со стола у вазы — пакет № 7.</text>
    <text x="60" y="818">Аппарат следственного отдела, объектив 60 мм с макрокольцом, вспышка выносная,</text>
    <text x="60" y="844">фотомасштаб в кадрах 12, 13 и 17. Понятые при съёмке: Картушов О. П., Юдина А. С.</text>
  </g>
</svg>
