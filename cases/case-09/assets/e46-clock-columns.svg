<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid19" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid19)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Снимок распечатки журнала: две колонки часов</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Приложение 1 к заключению № 33-ТС от 05.10.2026. Слева внутреннее время устройства RT-24-118-706,</text>
  <text x="60" y="132" font-size="19" fill="#3b4652">справа поясное время, вписанное экспертом при сверке с эталоном.</text>

  <g>
    <text x="180" y="176" font-size="18" font-weight="600" fill="#16202b">по часам роутера</text>
    <text x="700" y="176" font-size="18" font-weight="600" fill="#a8321f">поясное время</text>
    <line x1="430" y1="196" x2="430" y2="700" stroke="#16202b" stroke-width="2"/>
    <line x1="960" y1="196" x2="960" y2="700" stroke="#a8321f" stroke-width="2"/>

    <g font-size="17">
      <text x="180" y="240" fill="#16202b">19:29:11</text>
      <text x="290" y="240" fill="#3b4652">вход в сеть, адрес C8-3A-B2-17-04-91</text>
      <path d="M440 234 h250" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M690 234 l -12 -6 v 12 Z" fill="#3b4652"/>
      <text x="720" y="240" fill="#a8321f">19:26:11</text>
      <text x="840" y="240" fill="#3b4652">первая строка сессии у провайдера</text>

      <text x="180" y="290" fill="#16202b">19:29:58</text>
      <text x="290" y="290" fill="#3b4652">выдача адреса 192.168.0.50, аренда 120 минут</text>
      <path d="M440 284 h250" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M690 284 l -12 -6 v 12 Z" fill="#3b4652"/>
      <text x="720" y="290" fill="#a8321f">19:26:58</text>
      <text x="840" y="290" fill="#3b4652">тот же адрес закрепляется за аппаратом</text>

      <rect x="150" y="316" width="820" height="86" fill="#a8321f" opacity=".08"/>
      <text x="180" y="348" fill="#a8321f" font-weight="600">пусто</text>
      <text x="290" y="348" fill="#3b4652">с 19:00:00 по 20:21:36 в журнале нет ни одной строки</text>
      <text x="290" y="376" fill="#3b4652">строки этого окна восстановлены из образа памяти</text>

      <text x="180" y="436" fill="#16202b">20:21:29</text>
      <text x="290" y="436" fill="#3b4652">вход в административную панель из 192.168.0.50</text>
      <path d="M440 430 h250" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M690 430 l -12 -6 v 12 Z" fill="#3b4652"/>
      <text x="720" y="436" fill="#a8321f">20:18:29</text>
      <text x="840" y="436" fill="#3b4652">панель открывается только из внутренней сети</text>

      <text x="180" y="486" fill="#16202b">20:21:37</text>
      <text x="290" y="486" fill="#16202b">очистка журнала ассоциаций, сохранение конфига</text>
      <path d="M440 480 h250" stroke="#a8321f" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M690 480 l -12 -6 v 12 Z" fill="#a8321f"/>
      <text x="720" y="486" fill="#a8321f">20:18:37</text>
      <text x="840" y="486" fill="#16202b">сама очистка оставляет служебную строку</text>

      <text x="180" y="536" fill="#16202b">20:21:52</text>
      <text x="290" y="536" fill="#3b4652">перезагрузка беспроводного модуля</text>
      <path d="M440 530 h250" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M690 530 l -12 -6 v 12 Z" fill="#3b4652"/>
      <text x="720" y="536" fill="#a8321f">20:18:52</text>
      <text x="840" y="536" fill="#3b4652">кнопка сброса не нажималась, прошивка с 12.11.2024</text>

      <text x="180" y="586" fill="#16202b">20:22:10</text>
      <text x="290" y="586" fill="#3b4652">выход из панели</text>
      <path d="M440 580 h250" stroke="#3b4652" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M690 580 l -12 -6 v 12 Z" fill="#3b4652"/>
      <text x="720" y="586" fill="#a8321f">20:19:10</text>
      <text x="840" y="586" fill="#3b4652">иных входов за 24.09 служебный раздел не показывает</text>

      <text x="180" y="636" fill="#16202b">20:23:15</text>
      <text x="290" y="636" fill="#16202b">обрыв связи, минус 71 дБм</text>
      <path d="M440 630 h250" stroke="#a8321f" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M690 630 l -12 -6 v 12 Z" fill="#a8321f"/>
      <text x="720" y="636" fill="#a8321f">20:20:15</text>
      <text x="840" y="636" fill="#16202b">последняя строка сессии у провайдера</text>
    </g>
  </g>

  <g>
    <text x="1150" y="176" font-size="19" font-weight="600" fill="#16202b">Три аппарата, три строки</text>
    <g font-size="16" fill="#3b4652">
      <rect x="1150" y="200" width="360" height="120" fill="none" stroke="#16202b" stroke-width="1.5"/>
      <text x="1166" y="230">телефон Мелитонова А. Л.</text>
      <text x="1166" y="256">C8-3A-B2-17-04-91</text>
      <text x="1166" y="282">держал канал 54 минуты</text>
      <text x="1166" y="308">18,9 Мбайт, 24.09 вечер</text>

      <rect x="1150" y="340" width="360" height="98" fill="none" stroke="#16202b" stroke-width="1.5"/>
      <text x="1166" y="370">телефон Батюшкова В. С.</text>
      <text x="1166" y="396">A4-29-B4-88-1C-07</text>
      <text x="1166" y="422">20:52:12 — 20:58:44 по часам роутера</text>

      <rect x="1150" y="458" width="360" height="98" fill="none" stroke="#16202b" stroke-width="1.5"/>
      <text x="1166" y="488">телефон Зазубриной Н. Е.</text>
      <text x="1166" y="514">D0-C2-91-35-77-2A</text>
      <text x="1166" y="540">вечером 24.09 — ни одной строки</text>
    </g>
    <text x="1150" y="600" font-size="16" fill="#16202b">Устройство ведёт журнал в оперативной памяти:</text>
    <text x="1150" y="624" font-size="16" fill="#16202b">строка стирается из обычной папки за две минуты,</text>
    <text x="1150" y="648" font-size="16" fill="#16202b">но сессию провайдер хранит тридцать суток</text>
    <text x="1150" y="672" font-size="16" fill="#a8321f">и абонентским оборудованием не правится.</text>
  </g>

  <line x1="60" y1="720" x2="1540" y2="720" stroke="#16202b" stroke-width="2"/>
  <g font-size="16" fill="#3b4652">
    <text x="60" y="762">Рядом стоят часы трёх приборов: роутер спешит на три минуты, камера у ворот — на шесть минут двенадцать секунд,</text>
    <text x="60" y="788">домашний телефон с определителем — на минуту. Выгрузка сессий ведётся по поясному времени и не правится вовсе.</text>
  </g>
  <g font-size="16" fill="#a8321f">
    <text x="60" y="828">Сведённые к одной шкале, строки 20:23:15 и 20:20:15 оказываются одним и тем же обрывом связи.</text>
  </g>
</svg>
