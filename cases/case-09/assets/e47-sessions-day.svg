<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid22" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid22)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="72" font-size="26" font-weight="600" fill="#16202b">Сессии абонентского оборудования: вечер 24.09.2026</text>
  <text x="60" y="102" font-size="19" fill="#3b4652">Выгрузка № 402-1, узел «Глухари-2». Шкала поясная; абонентским оборудованием не правится.</text>

  <g>
    <text x="60" y="150" font-size="18" font-weight="600" fill="#16202b">Главная шкала: 18:00 — 22:00</text>
    <rect x="160" y="170" width="1300" height="210" fill="#dcd4c0" stroke="#16202b" stroke-width="2"/>
    <g stroke="#3b4652" stroke-width="1" opacity=".5">
      <path d="M485 170 v210 M810 170 v210 M1135 170 v210"/>
    </g>
    <g stroke="#3b4652" stroke-width="1" opacity=".25">
      <path d="M322 170 v210 M647 170 v210 M972 170 v210 M1297 170 v210"/>
    </g>
    <g font-size="15" fill="#3b4652">
      <text x="150" y="404">18:00</text>
      <text x="475" y="404">19:00</text>
      <text x="800" y="404">20:00</text>
      <text x="1125" y="404">21:00</text>
      <text x="1450" y="404">22:00</text>
    </g>

    <line x1="550" y1="170" x2="550" y2="380" stroke="#a8321f" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="360" y="200" font-size="15" fill="#a8321f">19:12 — время спорной отметки на КПП</text>
    <text x="360" y="222" font-size="15" fill="#a8321f">в шестидесяти восьми километрах отсюда</text>

    <rect x="627" y="248" width="293" height="40" fill="#a8321f"/>
    <text x="636" y="274" font-size="15" fill="#e8e2d4">Мелитонов А. Л. 19:26:11 — 20:20:15</text>
    <text x="936" y="266" font-size="15" fill="#16202b">54 минуты · 18,9 Мбайт</text>
    <text x="936" y="288" font-size="15" fill="#3b4652">аппарат C8-3A-B2-17-04-91</text>

    <rect x="1077" y="312" width="35" height="30" fill="#3b4652"/>
    <text x="1124" y="334" font-size="15" fill="#16202b">Батюшков В. С. 20:49:12 — 20:55:44 · 6 минут · 0,12 Мбайт</text>

    <text x="180" y="252" font-size="15" fill="#3b4652">18:00 — 19:26</text>
    <text x="180" y="274" font-size="15" fill="#a8321f">ни одной строки</text>
    <text x="180" y="330" font-size="15" fill="#3b4652">20:56 — 22:00</text>
    <text x="180" y="352" font-size="15" fill="#a8321f">ни одной строки</text>
    <text x="640" y="370" font-size="16" fill="#16202b">иных сессий 24.09 с 18:00 по 23:00 в выгрузке нет</text>
  </g>

  <g>
    <text x="60" y="452" font-size="18" font-weight="600" fill="#16202b">Те же сутки целиком: 24.09, 00:00 — 24:00</text>
    <rect x="160" y="470" width="1300" height="60" fill="none" stroke="#16202b" stroke-width="1.5"/>
    <g stroke="#3b4652" stroke-width="1" opacity=".4">
      <path d="M377 470 v60 M593 470 v60 M810 470 v60 M1027 470 v60 M1243 470 v60"/>
    </g>
    <g font-size="14" fill="#3b4652">
      <text x="152" y="556">00</text>
      <text x="369" y="556">04</text>
      <text x="585" y="556">08</text>
      <text x="802" y="556">12</text>
      <text x="1019" y="556">16</text>
      <text x="1235" y="556">20</text>
    </g>
    <g fill="#8fa3b5">
      <rect x="713" y="478" width="8" height="18"/>
      <rect x="798" y="478" width="6" height="18"/>
      <rect x="866" y="478" width="70" height="18"/>
      <rect x="979" y="478" width="42" height="18"/>
    </g>
    <rect x="1213" y="478" width="98" height="18" fill="#a8321f"/>
    <rect x="1332" y="478" width="14" height="18" fill="#3b4652"/>
    <g font-size="14" fill="#3b4652">
      <text x="660" y="520">10:12 · 11:47 — два коротких входа хозяйки</text>
      <text x="860" y="536">13:02 ноутбук в доме, 44,0 Мбайт · 15:07 телефон зятя, 9,6 Мбайт</text>
      <text x="1140" y="520" fill="#a8321f">вечер: две строки</text>
    </g>
  </g>

  <g>
    <text x="60" y="614" font-size="18" font-weight="600" fill="#16202b">Утро 25.09: сборка выгрузки</text>
    <rect x="160" y="632" width="1300" height="72" fill="none" stroke="#16202b" stroke-width="1.5"/>
    <rect x="674" y="644" width="117" height="20" fill="#a4b0ba"/>
    <text x="800" y="660" font-size="14" fill="#3b4652">09:31:12 — 09:44:05 телефон зятя, 21,7 Мбайт</text>
    <rect x="690" y="674" width="230" height="20" fill="#a8321f"/>
    <text x="928" y="690" font-size="14" fill="#16202b">09:44:31 — 10:02:19 ноутбук в доме, 612 Мбайт — тот же интервал, что и метки монтажа</text>
    <text x="160" y="732" font-size="15" fill="#3b4652">Первый вход телефона хозяйки в домашнюю сеть — 25.09 в 08:55:06; вечером 24.09 её аппарата в журнале нет вовсе.</text>
  </g>

  <line x1="60" y1="762" x2="1540" y2="762" stroke="#16202b" stroke-width="2"/>
  <g font-size="16" fill="#3b4652">
    <text x="60" y="800">Сессия появляется там, где устройство держит канал: чтобы она шла пятьдесят четыре минуты, аппарат должен быть</text>
    <text x="60" y="824">в доме или не далее ста пятидесяти метров от точки доступа. От КПП базы в Мочилах до участка № 41 шестьдесят восемь километров.</text>
  </g>
  <text x="60" y="858" font-size="16" fill="#a8321f">Пункт 5.4 договора хранит эти сведения тридцать суток; пункт 6.2: журналы абонентского устройства провайдер не хранит.</text>
</svg>
