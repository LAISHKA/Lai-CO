<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid101" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <marker id="arr101" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#e08a2e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid101)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Камера башни: пятый заезд, отказ у водоёма</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">План круга 1 600 м с сектором «Б»; препятствие № 6 — водоём на 1 400-м метре. Метки времени наносит архиватор пульта.</text>

  <g>
    <rect x="60" y="140" width="800" height="430" fill="#16202b"/>
    <rect x="72" y="152" width="776" height="406" fill="#243444"/>

    <ellipse cx="460" cy="360" rx="330" ry="148" fill="#33465c" stroke="#8fa3b5" stroke-width="2"/>
    <ellipse cx="460" cy="360" rx="205" ry="66" fill="#243444" stroke="#8fa3b5" stroke-width="2"/>
    <text x="386" y="238" font-size="14" fill="#c9d4de">противопологий поворот</text>
    <text x="404" y="372" font-size="14" fill="#8fa3b5">внутреннее поле</text>

    <rect x="148" y="330" width="78" height="62" rx="4" fill="#24506b" stroke="#8fa3b5" stroke-width="2"/>
    <path d="M148 372 h 78" stroke="#4a7ea0" stroke-width="1.4" opacity=".8"/>
    <path d="M186 330 v 40" stroke="#f2e6c8" stroke-width="2.6" stroke-dasharray="7 5"/>
    <text x="86" y="318" font-size="13" fill="#f2e6c8">осевая метка</text>
    <text x="86" y="416" font-size="13" fill="#c9d4de">препятствие № 6, водоём</text>
    <text x="86" y="434" font-size="13" fill="#8fa3b5">1 400-й метр сектора «Б»</text>

    <g>
      <path d="M404 300 l 22 -8 l 20 10 l -6 16 l -30 2 Z" fill="#e08a2e" stroke="#16202b" stroke-width="1.4"/>
      <circle cx="400" cy="306" r="6" fill="#dfe6ea" stroke="#16202b" stroke-width="1.2"/>
      <text x="440" y="292" font-size="13" fill="#e08a2e">«Гроза-3», восьмой номер</text>
    </g>
    <g>
      <circle cx="330" cy="470" r="7" fill="#c9d4de" stroke="#16202b" stroke-width="1.2"/>
      <circle cx="358" cy="478" r="7" fill="#c9d4de" stroke="#16202b" stroke-width="1.2"/>
      <circle cx="386" cy="468" r="7" fill="#c9d4de" stroke="#16202b" stroke-width="1.2"/>
      <circle cx="414" cy="480" r="7" fill="#c9d4de" stroke="#16202b" stroke-width="1.2"/>
      <circle cx="442" cy="470" r="7" fill="#c9d4de" stroke="#16202b" stroke-width="1.2"/>
      <circle cx="470" cy="480" r="7" fill="#c9d4de" stroke="#16202b" stroke-width="1.2"/>
      <text x="330" y="508" font-size="13" fill="#8fa3b5">группа, восемь корпусов в поле</text>
    </g>
    <path d="M396 322 C 320 330, 260 336, 232 352" fill="none" stroke="#e08a2e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr101)"/>
    <text x="248" y="300" font-size="13" fill="#e08a2e">21:11:50 — отстаёт, идёт у бровки</text>

    <path d="M560 426 v 82" stroke="#f2e6c8" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="596" y="444" font-size="13" fill="#8fa3b5">финишная прямая</text>
    <text x="500" y="528" font-size="13" fill="#f2e6c8">старт 21:10:35, финиш 21:13:15</text>

    <rect x="140" y="176" width="58" height="30" fill="#1d2b38" stroke="#8fa3b5" stroke-width="1.6"/>
    <text x="126" y="168" font-size="13" fill="#c9d4de">служебный вход</text>
    <path d="M170 208 C 176 250, 180 290, 184 324" fill="none" stroke="#e08a2e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr101)"/>
    <text x="188" y="252" font-size="13" fill="#e08a2e">21:08:10 — второй человек</text>

    <rect x="726" y="500" width="48" height="34" fill="#1d2b38" stroke="#8fa3b5" stroke-width="1.8"/>
    <text x="654" y="492" font-size="13" fill="#c9d4de">башня, камера № 1</text>
    <path d="M726 506 L 232 396 M726 528 L 232 356" stroke="#8fa3b5" stroke-width="1.2" opacity=".55"/>

    <rect x="380" y="512" width="120" height="30" fill="#33465c" stroke="#8fa3b5" stroke-width="1.6"/>
    <text x="404" y="532" font-size="13" fill="#c9d4de">трибуна</text>

    <text x="88" y="180" font-size="16" fill="#e8e2d4">26.09.2026  21:12:40</text>
    <circle cx="826" cy="538" r="7" fill="#a8321f"/>
    <text x="768" y="534" font-size="14" fill="#a8321f">кадр 6</text>
  </g>

  <g>
    <text x="900" y="176" font-size="19" font-weight="600" fill="#16202b">Раскадровка архива</text>
    <line x1="920" y1="200" x2="920" y2="644" stroke="#16202b" stroke-width="2"/>
    <g font-size="14" fill="#3b4652">
      <circle cx="920" cy="214" r="5" fill="#2f4258"/>
      <text x="940" y="218">21:07:45 — у осевой метки стоит человек в тёмной куртке, правит разметку</text>
      <circle cx="920" cy="254" r="5" fill="#2f4258"/>
      <text x="940" y="258">21:08:10 — со стороны служебного входа идёт второй, в светлом пальто</text>
      <circle cx="920" cy="294" r="5" fill="#2f4258"/>
      <text x="940" y="298">21:09:25 — второй уходит к служебному входу, первый остаётся в чаше</text>
      <circle cx="920" cy="334" r="5" fill="#2f4258"/>
      <text x="940" y="338">21:10:35 — стартовый выстрел, восемь корпусов в поле</text>
      <circle cx="920" cy="374" r="5" fill="#2f4258"/>
      <text x="940" y="378">21:11:50 — на подходе к повороту «Гроза-3» отстаёт, идёт у бровки</text>
      <circle cx="920" cy="414" r="5" fill="#a8321f"/>
      <text x="940" y="418" fill="#16202b">21:12:40 — отказ у водоёма: конь сваливается вправо за бровку чаши</text>
      <circle cx="920" cy="454" r="5" fill="#a8321f"/>
      <text x="940" y="458" fill="#16202b">21:13:02 — жокей поднимается, коня поднимают, у кромки воды лежит человек</text>
      <circle cx="920" cy="494" r="5" fill="#2f4258"/>
      <text x="940" y="498">21:13:15 — первым пришёл «Перевал», «Гроза-3» четвёртая, без седока</text>
      <circle cx="920" cy="534" r="5" fill="#2f4258"/>
      <text x="940" y="538">21:13:45 — на круг бегут объездчики и фельдшер, кадр закрыт людьми</text>
      <circle cx="920" cy="574" r="5" fill="#a8321f"/>
      <text x="940" y="578" fill="#16202b">Девять кадров середины записи сорваны на полосы: в это время сел свет</text>
      <circle cx="920" cy="614" r="5" fill="#2f4258"/>
      <text x="940" y="618">Микрофона на этой камере нет: разговор на разметке не записан</text>
    </g>
  </g>

  <line x1="60" y1="648" x2="860" y2="648" stroke="#16202b" stroke-width="2"/>
  <line x1="900" y1="648" x2="1560" y2="648" stroke="#16202b" stroke-width="2"/>

  <g>
    <text x="60" y="686" font-size="19" font-weight="600" fill="#16202b">Сверка с документами дня</text>
    <g font-size="15" fill="#3b4652">
      <text x="60" y="718">Пятый заезд, ночной приз на 1 600 м; препятствие № 6 — водоём в секторе «Б».</text>
      <text x="60" y="742">Состав: восемь лошадей; «Гроза-3» — восьмой номер, владелец Кобызев, тренер Скворцов.</text>
      <text x="60" y="766">Победитель — «Перевал», ООО «Слобода», чистый проход по внутренней бровке.</text>
      <text x="60" y="790">Погода: дождь 11 мм за два часа, гроза, ветер 3 м/с, грунт переувлажнён.</text>
    </g>
    <g font-size="15" fill="#a8321f">
      <text x="60" y="826">По регламенту на круге во время прогона никого быть не должно.</text>
      <text x="60" y="850">Прожекторы сектора «Б» погасли 21:11:06, включились 21:15:19.</text>
    </g>
  </g>

  <g>
    <text x="900" y="686" font-size="19" font-weight="600" fill="#16202b">Что читается и что нет</text>
    <g font-size="15" fill="#3b4652">
      <text x="900" y="718">До старта на разметке стоят двое; в журнале прохода это владельцы карт 02 и 04.</text>
      <text x="900" y="742">Лица второго в кадре нет: он идёт против солнца, по бетону бровки.</text>
      <text x="900" y="766">Съёмка поперёк сектора: выход с поворота, чаша и начало финишной прямой.</text>
    </g>
    <g font-size="15" fill="#a8321f">
      <text x="900" y="802">Камеры № 4 «Кассовый зал» и № 6 «Паддок» в этот вечер обесточены.</text>
      <text x="900" y="826">Конь падает на левый бок и корпусом накрывает человека, стоящего в воде.</text>
      <text x="900" y="850">Носитель изъят 27.09 в 11:20, копия снята оператором при понятых.</text>
    </g>
  </g>
</svg>
