<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid102" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid102)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Термобирка пробирки № 17: надлом, таймер, отпечаток</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Областная ветеринарная лаборатория, приёмное отделение; съёмка 28.09.2026, макрообъектив, без вспышки.</text>

  <g>
    <rect x="60" y="140" width="800" height="440" fill="#16202b"/>
    <rect x="72" y="152" width="776" height="416" fill="#243444"/>

    <rect x="140" y="206" width="560" height="196" rx="10" fill="#dfe6ea" stroke="#8fa3b5" stroke-width="2"/>
    <text x="160" y="240" font-size="17" fill="#16202b">ТЕРМОБИРКА ТБ-2 · СЕРИЯ 2026-04</text>
    <text x="160" y="266" font-size="20" font-weight="600" fill="#16202b">НОСИТЕЛЬ 7714-17</text>
    <text x="160" y="292" font-size="14" fill="#3b4652">одноразовый надлом, внутренний таймер</text>

    <path d="M300 206 l 12 26 l -16 24 l 16 26 l -12 24 l 14 26 l -10 26 l 12 24" fill="none" stroke="#a8321f" stroke-width="3"/>
    <text x="216" y="344" font-size="13" fill="#a8321f">линия надлома, однократного</text>

    <rect x="160" y="356" width="520" height="26" fill="#b9c4cc" stroke="#8fa3b5" stroke-width="1.2"/>
    <rect x="160" y="356" width="196" height="26" fill="#3b4652"/>
    <text x="160" y="402" font-size="13" fill="#c9d4de">индикаторная полоска: потемнела с левой стороны</text>

    <rect x="476" y="248" width="196" height="88" rx="6" fill="#16202b" stroke="#8fa3b5" stroke-width="1.8"/>
    <text x="492" y="292" font-size="32" font-weight="600" fill="#e08a2e">21:34:20</text>
    <text x="492" y="318" font-size="15" fill="#c9d4de">26.09.2026</text>
    <text x="476" y="358" font-size="13" fill="#8fa3b5">окно внутреннего таймера</text>

    <g stroke="#3b4652" stroke-width="1.6" fill="none" opacity=".85">
      <path d="M596 356 a 44 30 0 0 1 88 0"/>
      <path d="M606 356 a 34 22 0 0 1 68 0"/>
      <path d="M616 356 a 24 15 0 0 1 48 0"/>
      <path d="M626 356 a 14 9 0 0 1 28 0"/>
    </g>
    <text x="556" y="392" font-size="13" fill="#a8321f">половинчатый отпечаток поверх клеевого края</text>

    <path d="M700 206 l 0 34 l -34 -34 Z" fill="#f2e6c8" stroke="#8fa3b5" stroke-width="1.4"/>
    <text x="646" y="196" font-size="13" fill="#f2e6c8">отгиб наклейки 6 мм</text>

    <rect x="140" y="440" width="240" height="86" rx="8" fill="#33465c" stroke="#8fa3b5" stroke-width="1.8"/>
    <text x="156" y="468" font-size="14" fill="#c9d4de">ОБОРОТ БИРКИ</text>
    <text x="156" y="492" font-size="14" fill="#8fa3b5">след клея от пенала</text>
    <text x="156" y="512" font-size="14" fill="#8fa3b5">процарапанная иглой «3»</text>

    <g stroke="#f2e6c8" stroke-width="1.6">
      <path d="M440 500 h 400"/>
      <path d="M440 490 v 20 M520 494 v 12 M600 494 v 12 M680 494 v 12 M760 494 v 12 M840 490 v 20"/>
    </g>
    <text x="440" y="482" font-size="13" fill="#f2e6c8">масштабная линейка 50 мм</text>

    <text x="88" y="182" font-size="16" fill="#e8e2d4">кадр 1 · 4 000 × 3 000</text>
    <circle cx="826" cy="556" r="7" fill="#a8321f"/>
  </g>

  <g>
    <text x="900" y="176" font-size="19" font-weight="600" fill="#16202b">Что замерено на снимке</text>
    <line x1="920" y1="200" x2="920" y2="618" stroke="#16202b" stroke-width="2"/>
    <g font-size="14" fill="#3b4652">
      <circle cx="920" cy="216" r="5" fill="#2f4258"/>
      <text x="940" y="220">Носитель: термобирка ТБ-2, серия 2026-04, номер 7714-17</text>
      <circle cx="920" cy="254" r="5" fill="#2f4258"/>
      <text x="940" y="258">Показания таймера: 21:34:20, 26.09.2026</text>
      <text x="940" y="278">Погрешность бирки по паспорту — 2 секунды</text>
      <circle cx="920" cy="312" r="5" fill="#2f4258"/>
      <text x="940" y="316">Надлом однократный, доходит до индикатора</text>
      <text x="940" y="336">Повторных перегибов на линии разрыва нет</text>
      <circle cx="920" cy="370" r="5" fill="#a8321f"/>
      <text x="940" y="374" fill="#16202b">Отпечаток половинчатый, дактилоскопически пригоден,</text>
      <text x="940" y="394" fill="#16202b">лежит поверх клеевого края: бирку держали уже надломленной</text>
      <circle cx="920" cy="428" r="5" fill="#2f4258"/>
      <text x="940" y="432">Отгиб наклейки справа на 6 мм обнажает слой бумаги,</text>
      <text x="940" y="452">на котором читается только хвост цифры</text>
      <circle cx="920" cy="486" r="5" fill="#2f4258"/>
      <text x="940" y="490">Правый нижний угол бирки на снимке смазан</text>
      <circle cx="920" cy="520" r="5" fill="#2f4258"/>
      <text x="940" y="524">Сверка отпечатка выполнена 28.09</text>
      <circle cx="920" cy="554" r="5" fill="#2f4258"/>
      <text x="940" y="558">Упаковано в конверт № 1, опечатанный в лаборатории,</text>
      <text x="940" y="578">пломба целая</text>
      <circle cx="920" cy="600" r="5" fill="#2f4258"/>
      <text x="940" y="604">До 27.09 бирка лежала в общей куче проб,</text>
      <text x="940" y="624">в холодильник не возвращалась</text>
    </g>
  </g>

  <line x1="60" y1="648" x2="860" y2="648" stroke="#16202b" stroke-width="2"/>
  <line x1="900" y1="648" x2="1560" y2="648" stroke="#16202b" stroke-width="2"/>

  <g>
    <text x="60" y="686" font-size="19" font-weight="600" fill="#16202b">Сличение времени</text>
    <g font-size="15" fill="#3b4652">
      <text x="60" y="718">В протоколе отбора пробы вскрытие термобирки записано 21:35:01.</text>
      <text x="60" y="742">По таймеру самой бирки — 21:34:20. Разница между двумя метками — 41 секунда.</text>
      <text x="60" y="766">Пробы: 10 мл крови, две пробирки — № 17 на сыворотку, № 18 на токсикологию.</text>
      <text x="60" y="790">Отбор 26.09 в 21:34, венепункция яремной вены на месте падения.</text>
    </g>
    <g font-size="15" fill="#a8321f">
      <text x="60" y="826">Строки о времени вскрытия и о постановке пробы в журнал выведены</text>
      <text x="60" y="850">другой рукой, с наклоном влево, цифра «5» с петлёй.</text>
    </g>
  </g>

  <g>
    <text x="900" y="686" font-size="19" font-weight="600" fill="#16202b">Движение пробы</text>
    <g font-size="15" fill="#3b4652">
      <text x="900" y="718">Хранение по протоколу: холодильник «Полюс-3», секция 4, режим +4 °C.</text>
      <text x="900" y="742">Пенал пластиковый, пломба № 3; в графе «опломбировано» прочерк и слово «утром».</text>
      <text x="900" y="766">Отправка 27.09 курьером в областную лабораторию.</text>
    </g>
    <g font-size="15" fill="#a8321f">
      <text x="900" y="802">Подпись получателя в квитанции не найдена.</text>
      <text x="900" y="826">Особая отметка протокола: «проба чистая, гемолиза нет».</text>
      <text x="900" y="850">Ниже той же строкой — карандашная помета, приложена отдельным листом.</text>
    </g>
  </g>
</svg>
