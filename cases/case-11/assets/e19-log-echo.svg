<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid1119" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" style="fill:var(--paper,#e8e2d4)"/>
  <rect width="1600" height="900" fill="url(#grid1119)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" style="stroke:var(--paper-ink,#16202b)" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" style="fill:var(--paper-ink,#16202b)">Приборная доска мостика: два счётчика пути и лента эхолота за вахту</text>
  <text x="60" y="106" font-size="19" style="fill:var(--fg-dim,#3b4652)">Схема к снимку от 23.10, 12:05, в кадре масштабируемая линейка. Верхний счётчик — лаг относительно воды, нижний — трек процессора относительно грунта.</text>

  <g>
    <text x="60" y="164" font-size="19" font-weight="600" style="fill:var(--paper-ink,#16202b)">Счётчики пути на 04:20</text>

    <g stroke-width="2.4" fill="none" style="stroke:var(--paper-ink,#16202b)">
      <rect x="60" y="188" width="420" height="132"/>
      <rect x="60" y="344" width="420" height="132"/>
    </g>

    <rect x="80" y="212" width="180" height="72" fill="#243444" stroke="#8fa3b5" stroke-width="1.6"/>
    <text x="104" y="262" font-size="40" font-weight="700" fill="#f2e6c8">10,6</text>
    <text x="278" y="242" font-size="16" style="fill:var(--paper-ink,#16202b)">мили</text>
    <text x="278" y="266" font-size="14" style="fill:var(--fg-dim,#3b4652)">путь относительно воды</text>
    <text x="80" y="308" font-size="15" style="fill:var(--fg-dim,#3b4652)">лаг винтовой, блок на форштевне</text>

    <rect x="80" y="368" width="180" height="72" fill="#243444" stroke="#8fa3b5" stroke-width="1.6"/>
    <text x="104" y="418" font-size="40" font-weight="700" fill="#f2e6c8">12,4</text>
    <text x="278" y="398" font-size="16" style="fill:var(--paper-ink,#16202b)">мили</text>
    <text x="278" y="422" font-size="14" style="fill:var(--fg-dim,#3b4652)">путь относительно грунта</text>
    <text x="80" y="464" font-size="15" style="fill:var(--fg-dim,#3b4652)">трек процессора, шкала спутниковая</text>

    <g stroke-width="2.4" style="stroke:var(--danger,#a8321f)" fill="none">
      <path d="M506 248 H566 V404 H506"/>
      <path d="M540 248 V232 M540 404 V420"/>
    </g>
    <text x="580" y="322" font-size="22" font-weight="700" style="fill:var(--danger,#a8321f)">1,8 мили</text>
    <text x="580" y="348" font-size="15" style="fill:var(--fg-dim,#3b4652)">разница двух счётчиков</text>
    <text x="580" y="370" font-size="15" style="fill:var(--fg-dim,#3b4652)">за одну вахту</text>
  </g>

  <g>
    <text x="840" y="164" font-size="19" font-weight="600" style="fill:var(--paper-ink,#16202b)">Лента эхолота, фрагмент 02:40 — 04:20</text>
    <g stroke-width="2.4" fill="none" style="stroke:var(--paper-ink,#16202b)">
      <rect x="840" y="188" width="640" height="288"/>
    </g>
    <rect x="840" y="188" width="640" height="288" fill="#f7f2e6"/>
    <g stroke="#cbbfa8" stroke-width="1">
      <path d="M840 246 H1480 M840 304 H1480 M840 362 H1480 M840 420 H1480"/>
      <path d="M920 188 V476 M1000 188 V476 M1080 188 V476 M1160 188 V476 M1240 188 V476 M1320 188 V476 M1400 188 V476"/>
    </g>
    <g font-size="13" style="fill:var(--fg-dim,#3b4652)">
      <text x="852" y="240">2 м</text>
      <text x="852" y="298">3 м</text>
      <text x="852" y="356">4 м</text>
      <text x="852" y="414">5 м</text>
    </g>

    <path d="M840 300 l 14 -12 l 12 16 l 14 -18 l 12 20 l 14 -14 l 12 10 l 14 -16 l 12 18 l 14 -12 l 12 14 l 14 -10 l 12 12 l 14 -14 l 12 16" fill="none" stroke="#16202b" stroke-width="2.4"/>
    <path d="M1080 314 h 236" fill="none" style="stroke:var(--danger,#a8321f)" stroke-width="3.4"/>
    <rect x="1080" y="292" width="236" height="46" fill="#a8321f" opacity=".1"/>
    <path d="M1316 300 l 14 -14 l 12 18 l 14 -16 l 12 12 l 14 -18 l 12 20 l 14 -14 l 12 16 l 14 -12 l 12 14 l 14 -16 l 12 18" fill="none" stroke="#16202b" stroke-width="2.4"/>

    <g stroke-width="2" style="stroke:var(--danger,#a8321f)" stroke-dasharray="7 5" fill="none">
      <path d="M1080 188 V476 M1316 188 V476"/>
    </g>
    <text x="1086" y="210" font-size="14" style="fill:var(--danger,#a8321f)">03:19</text>
    <text x="1256" y="210" font-size="14" style="fill:var(--danger,#a8321f)">04:06</text>
    <text x="1096" y="366" font-size="15" style="fill:var(--danger,#a8321f)">ровная линия, 3,2 — 3,4 метра,</text>
    <text x="1096" y="388" font-size="15" style="fill:var(--danger,#a8321f)">зазубрин нет — корпус не идёт</text>
    <text x="856" y="498" font-size="15" style="fill:var(--fg-dim,#3b4652)">до 03:19 и после 04:06 линия с частыми зазубринами —</text>
    <text x="856" y="520" font-size="15" style="fill:var(--fg-dim,#3b4652)">обычный профиль дна на ходу и на стоянке у борта</text>
    <text x="856" y="270" font-size="14" fill="#8fa3b5">диапазон 0—20 метров, погрешность 0,1 метра, преобразователь кормовой</text>
  </g>

  <line x1="60" y1="540" x2="1540" y2="540" style="stroke:var(--paper-ink,#16202b)" stroke-width="2"/>

  <g>
    <text x="60" y="586" font-size="19" font-weight="600" style="fill:var(--paper-ink,#16202b)">Нижняя часть кадра</text>
    <g stroke-width="2.4" fill="none" style="stroke:var(--paper-ink,#16202b)">
      <rect x="60" y="608" width="300" height="120"/>
      <rect x="380" y="608" width="220" height="120"/>
    </g>
    <path d="M120 640 h 180 M120 668 h 180" stroke="#8fa3b5" stroke-width="2"/>
    <circle cx="120" cy="640" r="9" fill="#33465c" stroke="#16202b" stroke-width="2"/>
    <circle cx="120" cy="668" r="9" fill="#33465c" stroke="#16202b" stroke-width="2"/>
    <path d="M129 640 H250" stroke="#a8321f" stroke-width="4"/>
    <text x="262" y="646" font-size="15" style="fill:var(--paper-ink,#16202b)">рукоятка лага</text>
    <text x="262" y="668" font-size="15" style="fill:var(--danger,#a8321f)">«стоп»</text>
    <text x="120" y="712" font-size="14" style="fill:var(--fg-dim,#3b4652)">винт лага не вращается</text>
    <rect x="400" y="628" width="180" height="60" fill="#243444" stroke="#8fa3b5" stroke-width="1.6"/>
    <text x="424" y="670" font-size="30" font-weight="700" fill="#e08a2e">0,0</text>
    <text x="500" y="670" font-size="15" fill="#c9d4de">узла</text>
    <text x="392" y="712" font-size="14" style="fill:var(--fg-dim,#3b4652)">скорость относительно воды</text>
  </g>

  <g>
    <text x="700" y="586" font-size="19" font-weight="600" style="fill:var(--paper-ink,#16202b)">Как это читается вместе с журналом</text>
    <g font-size="16" style="fill:var(--fg-dim,#3b4652)">
      <text x="700" y="624">02:47 по судовым часам — приказ «стоп-машина», и до 04:04</text>
      <text x="700" y="646">лента дублёра телеграфа больше не знает ни одного пуска</text>
      <text x="700" y="684">10,6 мили лаг против 12,4 мили трек: разницу в 1,8 мили</text>
      <text x="700" y="706">дал час, когда машина стояла, а глубина держалась 3,2—3,4</text>
      <text x="700" y="744">Лента эхолота и трек процессора пишут по береговому</text>
      <text x="700" y="766">эталону, вахтенный журнал — по судовым часам</text>
    </g>
    <g font-size="16" style="fill:var(--danger,#a8321f)">
      <text x="700" y="806">Судно не шло над грунтом, его несло течением,</text>
      <text x="700" y="828">а «ход тихой» и «полный ход» в журнале — запись на бумаге</text>
    </g>
  </g>
</svg>
