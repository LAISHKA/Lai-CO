<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="gridY12" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridY12)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Камера PO-017: двор дома № 6 по улице Пивоварной, ночь с 11.02 на 12.02.2026</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Запись по датчику движения, 720p, четыре кадра в секунду. Камера на углу дома, высота 4,1 м, поле — двор 38 на 22 м, погребица в правом нижнем секторе.</text>

  <g>
    <rect x="60" y="150" width="900" height="480" fill="#c9d4de" stroke="#16202b" stroke-width="3"/>

    <rect x="60" y="150" width="640" height="96" fill="#33465c" stroke="#16202b" stroke-width="3"/>
    <text x="380" y="196" font-size="18" fill="#dfe6ea" text-anchor="middle">Дом № 6, четыре подъезда</text>
    <text x="380" y="222" font-size="15" fill="#8fa3b5" text-anchor="middle">Клубов — квартира 3, третий подъезд</text>
    <rect x="330" y="238" width="60" height="18" fill="#e08a2e" stroke="#16202b" stroke-width="2"/>
    <text x="360" y="286" font-size="15" fill="#16202b" text-anchor="middle">Подъезд, окно Двурыгина</text>

    <rect x="700" y="150" width="260" height="480" fill="#8fa3b5" stroke="#16202b" stroke-width="3"/>
    <text x="830" y="186" font-size="16" fill="#16202b" text-anchor="middle">Погребица, 14 ячеек</text>
    <text x="830" y="206" font-size="15" fill="#3b4652" text-anchor="middle">вход один, по лестнице</text>
    <g stroke="#33465c" stroke-width="2" fill="#4a6076">
      <rect x="720" y="228" width="46" height="60"/>
      <rect x="770" y="228" width="46" height="60"/>
      <rect x="820" y="228" width="46" height="60"/>
      <rect x="870" y="228" width="46" height="60"/>
      <rect x="720" y="300" width="46" height="60"/>
      <rect x="770" y="300" width="46" height="60"/>
      <rect x="820" y="300" width="46" height="60"/>
      <rect x="870" y="300" width="46" height="60"/>
      <rect x="720" y="372" width="46" height="60"/>
      <rect x="770" y="372" width="46" height="60"/>
      <rect x="820" y="372" width="46" height="60"/>
      <rect x="870" y="372" width="46" height="60"/>
    </g>
    <rect x="770" y="470" width="56" height="40" fill="#16202b" stroke="#a8321f" stroke-width="3"/>
    <text x="798" y="546" font-size="16" font-weight="600" fill="#a8321f" text-anchor="middle">Лаз, ячейка</text>
    <text x="798" y="566" font-size="16" fill="#a8321f" text-anchor="middle">Клубова</text>

    <g stroke="#8fa3b5" stroke-width="14" opacity=".85">
      <line x1="90" y1="340" x2="700" y2="340"/>
      <line x1="90" y1="430" x2="700" y2="430"/>
      <line x1="90" y1="520" x2="700" y2="520"/>
    </g>
    <text x="106" y="336" font-size="14" fill="#3b4652">Первая дорожка</text>
    <text x="106" y="426" font-size="14" fill="#3b4652">Вторая дорожка</text>
    <text x="106" y="516" font-size="14" fill="#3b4652">Третья дорожка</text>

    <g fill="#4a6076" stroke="#16202b" stroke-width="2">
      <rect x="500" y="470" width="44" height="34"/>
      <rect x="552" y="470" width="44" height="34"/>
      <rect x="604" y="470" width="44" height="34"/>
    </g>
    <text x="574" y="536" font-size="14" fill="#3b4652" text-anchor="middle">Мусорные баки</text>

    <rect x="470" y="404" width="150" height="44" rx="12" fill="#33465c" stroke="#16202b" stroke-width="3"/>
    <circle cx="500" cy="452" r="9" fill="#16202b"/>
    <circle cx="590" cy="452" r="9" fill="#16202b"/>
    <text x="545" y="432" font-size="14" fill="#dfe6ea" text-anchor="middle">О 092 МН 716</text>
    <text x="545" y="392" font-size="15" fill="#a8321f" text-anchor="middle">За баками, фары погашены</text>

    <path d="M620 426 L770 490" stroke="#e08a2e" stroke-width="3" stroke-dasharray="9 7" fill="none"/>
    <text x="666" y="482" font-size="14" fill="#3b4652">Двенадцать шагов от машины</text>
    <text x="666" y="500" font-size="14" fill="#3b4652">до лаза по третьей дорожке</text>

    <path d="M120 600 L760 600 L880 480 L880 180" stroke="#e08a2e" stroke-width="3" stroke-dasharray="12 8" fill="none" opacity=".7"/>
    <text x="120" y="622" font-size="14" fill="#3b4652">Улица</text>
    <circle cx="880" cy="180" r="9" fill="#e08a2e" stroke="#16202b" stroke-width="2"/>
    <text x="864" y="166" font-size="15" fill="#16202b" text-anchor="end">Камера на углу дома</text>

    <text x="96" y="196" font-size="14" fill="#a8321f">Слепые зоны: вход в погребицу изнутри,</text>
    <text x="96" y="214" font-size="14" fill="#a8321f">торец погребицы, двор за баками</text>
  </g>

  <g>
    <text x="1000" y="172" font-size="19" font-weight="600" fill="#16202b">Отметки кадров по минутам</text>
    <line x1="1000" y1="184" x2="1540" y2="184" stroke="#8fa3b5" stroke-width="1.5"/>

    <g font-size="16" fill="#3b4652">
      <text x="1000" y="214">20:04</text>
      <text x="1080" y="214">Клубов с мешком у подъезда, поднимается, возвращается</text>
      <text x="1000" y="244">22:22</text>
      <text x="1080" y="244">тёмный легковой въезжает, встаёт за баками; видно «092» и 716</text>
      <text x="1000" y="274">22:26</text>
      <text x="1080" y="274">Клубов поднимает крышку лаза, спускается, крышку не закрывает</text>
      <text x="1000" y="304">22:30</text>
      <text x="1080" y="304">крышка падает до упора; в эту минуту сосед выходит в куртке</text>
      <text x="1000" y="334">22:35</text>
      <text x="1080" y="334">от машины отходит вторая фигура: светлая куртка с капюшоном,</text>
      <text x="1080" y="358">фонарь внизу, сумка через плечо, рост по кадру 168 см</text>
      <text x="1000" y="388">22:41</text>
      <text x="1080" y="388">сосед стоит у баков с телефоном, к лазу не подходит; свет гаснет</text>
      <text x="1000" y="418">23:26</text>
      <text x="1080" y="418">из лаза выходит тот же человек: смотанный шнур и кусок плёнки</text>
      <text x="1000" y="448">23:31</text>
      <text x="1080" y="448">крышка лаза падает, но остаётся щель</text>
      <text x="1000" y="478">23:33</text>
      <text x="1080" y="478">легковой уезжает со двора</text>
      <text x="1000" y="508">23:41</text>
      <text x="1080" y="508">за ворота проходит пешком мужчина в куртке с полосой</text>
      <text x="1000" y="538">12.02 07:12</text>
      <text x="1120" y="538">Двурыгин с ломом у лаза, затем во дворе патруль</text>
    </g>
    <text x="1000" y="572" font-size="16" fill="#a8321f">Шаг в 23:26: идущий касается правой рукой стороны лаза,</text>
    <text x="1000" y="594" font-size="16" fill="#a8321f">куртка застёгнута, шаги тяжёлые, постановка ног широкая.</text>

    <rect x="1000" y="616" width="540" height="104" fill="none" stroke="#8fa3b5" stroke-width="1.5"/>
    <text x="1016" y="644" font-size="17" font-weight="600" fill="#16202b">Что даёт сличение с камерой PO-014</text>
    <text x="1016" y="670" font-size="16" fill="#3b4652">Выход машины за ворота в 22:16, возврат в 23:37. Во дворе</text>
    <text x="1016" y="692" font-size="16" fill="#3b4652">на Пивоварной та же машина с 22:22 по 23:33 — восемьдесят</text>
    <text x="1016" y="714" font-size="16" fill="#3b4652">одна минута, которых нет ни в одном журнале отделения.</text>
  </g>

  <g>
    <text x="60" y="676" font-size="19" font-weight="600" fill="#16202b">Получасовое окно в погребе</text>
    <line x1="60" y1="688" x2="960" y2="688" stroke="#8fa3b5" stroke-width="1.5"/>

    <line x1="80" y1="760" x2="900" y2="760" stroke="#16202b" stroke-width="2.5"/>
    <circle cx="200" cy="760" r="8" fill="#33465c"/>
    <text x="200" y="736" font-size="15" fill="#16202b" text-anchor="middle">22:22 машина</text>
    <circle cx="320" cy="760" r="8" fill="#33465c"/>
    <text x="320" y="736" font-size="15" fill="#16202b" text-anchor="middle">22:26 спуск</text>
    <circle cx="380" cy="760" r="8" fill="#33465c"/>
    <text x="380" y="800" font-size="15" fill="#3b4652" text-anchor="middle">22:30 крышка</text>
    <circle cx="440" cy="760" r="10" fill="#a8321f"/>
    <text x="440" y="736" font-size="15" font-weight="600" fill="#a8321f" text-anchor="middle">22:35 подход</text>
    <circle cx="560" cy="760" r="8" fill="#33465c"/>
    <text x="560" y="800" font-size="15" fill="#3b4652" text-anchor="middle">22:41 сосед у баков</text>
    <circle cx="830" cy="760" r="10" fill="#a8321f"/>
    <text x="830" y="736" font-size="15" font-weight="600" fill="#a8321f" text-anchor="middle">23:26 выход</text>
    <circle cx="890" cy="760" r="8" fill="#33465c"/>
    <text x="890" y="800" font-size="15" fill="#3b4652" text-anchor="middle">23:33 уезд</text>
    <path d="M440 760 L830 760" stroke="#a8321f" stroke-width="3" opacity=".5"/>
    <text x="635" y="742" font-size="16" fill="#a8321f" text-anchor="middle">51 минута в ячейке вдвоём</text>

    <g font-size="15" fill="#3b4652">
      <text x="80" y="850">Файлы ночи 22:20—23:40 присутствуют целиком, разрывов нет; запись ведётся по движению, паузы по 6—40 секунд.</text>
      <text x="80" y="872">Ни одного кадра с машиной участкового или морговозки в этом дворе за ночь не записано.</text>
    </g>
  </g>
</svg>
