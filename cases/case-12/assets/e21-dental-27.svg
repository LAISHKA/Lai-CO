<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="gridD12" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="hatchD12" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e08a2e" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridD12)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Карта ЗК-27: лицевая сторона и оборот, два ряда в одном бланке</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Кабинет протезирования клиники «Тихий Двор». Сканирование 300 dpi, копия приобщена 14.02.2026. Номера зубов даны по международной схеме.</text>

  <g>
    <text x="60" y="152" font-size="20" font-weight="600" fill="#16202b">Лицевая сторона — формула А, заполнена 03.02.2026 в 10:40</text>
    <text x="60" y="178" font-size="16" fill="#3b4652">Снята со слов стоматолога по архиву слепков 11.09.2019. Почерк: тёмная синька, штамп клиники, строка «пациент» заполнена.</text>


    <g fill="#f2e6c8" stroke="#16202b" stroke-width="1.5">
      <rect x="60" y="266" width="34" height="38"/><rect x="100" y="266" width="34" height="38"/><rect x="140" y="266" width="34" height="38"/><rect x="180" y="266" width="34" height="38"/><rect x="220" y="266" width="34" height="38"/><rect x="260" y="266" width="34" height="38"/><rect x="300" y="266" width="34" height="38"/><rect x="340" y="266" width="34" height="38"/><rect x="380" y="266" width="34" height="38"/><rect x="420" y="266" width="34" height="38"/><rect x="460" y="266" width="34" height="38"/><rect x="500" y="266" width="34" height="38"/><rect x="540" y="266" width="34" height="38"/><rect x="580" y="266" width="34" height="38"/><rect x="620" y="266" width="34" height="38"/><rect x="660" y="266" width="34" height="38"/>
      <rect x="60" y="330" width="34" height="38"/><rect x="100" y="330" width="34" height="38"/><rect x="140" y="330" width="34" height="38"/><rect x="180" y="330" width="34" height="38"/><rect x="220" y="330" width="34" height="38"/><rect x="260" y="330" width="34" height="38"/><rect x="300" y="330" width="34" height="38"/><rect x="340" y="330" width="34" height="38"/><rect x="380" y="330" width="34" height="38"/><rect x="420" y="330" width="34" height="38"/><rect x="460" y="330" width="34" height="38"/><rect x="500" y="330" width="34" height="38"/><rect x="540" y="330" width="34" height="38"/><rect x="580" y="330" width="34" height="38"/><rect x="620" y="330" width="34" height="38"/><rect x="660" y="330" width="34" height="38"/>
    </g>
    <line x1="377" y1="258" x2="377" y2="374" stroke="#16202b" stroke-width="2" stroke-dasharray="6 5"/>
    <g font-size="12" fill="#16202b" text-anchor="middle">
      <text x="77" y="290">1.8</text><text x="117" y="290">1.7</text><text x="157" y="290">1.6</text><text x="197" y="290">1.5</text><text x="237" y="290">1.4</text><text x="277" y="290">1.3</text><text x="317" y="290">1.2</text><text x="357" y="290">1.1</text><text x="397" y="290">2.1</text><text x="437" y="290">2.2</text><text x="477" y="290">2.3</text><text x="517" y="290">2.4</text><text x="557" y="290">2.5</text><text x="597" y="290">2.6</text><text x="637" y="290">2.7</text><text x="677" y="290">2.8</text>
      <text x="77" y="354">4.8</text><text x="117" y="354">4.7</text><text x="157" y="354">4.6</text><text x="197" y="354">4.5</text><text x="237" y="354">4.4</text><text x="277" y="354">4.3</text><text x="317" y="354">4.2</text><text x="357" y="354">4.1</text><text x="397" y="354">3.1</text><text x="437" y="354">3.2</text><text x="477" y="354">3.3</text><text x="517" y="354">3.4</text><text x="557" y="354">3.5</text><text x="597" y="354">3.6</text><text x="637" y="354">3.7</text><text x="677" y="354">3.8</text>
    </g>
    <rect x="96" y="262" width="122" height="46" fill="none" stroke="#2f4258" stroke-width="3"/>
    <text x="160" y="256" font-size="16" fill="#a8321f" text-anchor="middle">Мост 1.5—1.7</text>
    <text x="160" y="402" font-size="14" fill="#a8321f" text-anchor="middle">1.6 под мостом</text>
    <path d="M589 274 L611 296 M611 274 L589 296" stroke="#a8321f" stroke-width="3"/>
    <path d="M589 338 L611 360 M611 338 L589 360" stroke="#a8321f" stroke-width="3"/>
    <rect x="626" y="340" width="22" height="18" fill="#16202b"/>
    <rect x="346" y="272" width="22" height="26" fill="url(#hatchD12)"/>
    <rect x="386" y="272" width="22" height="26" fill="url(#hatchD12)"/>

    <g font-size="15" fill="#3b4652">
      <text x="60" y="432">Отсутствуют: 2.6, 3.6.</text>
      <text x="60" y="456">Мост на опорах 1.5 и 1.7, три позиции в ряду.</text>
      <text x="60" y="480">Пломба 3.7 — амальгама, тёмное пятно 4 мм.</text>
      <text x="60" y="504">Коронки 1.1 и 2.1, скол эмали 1.1 высотой 2 мм.</text>
      <text x="60" y="528">Прикус обратный, резцы перекрываются в обратную сторону.</text>
    </g>
  </g>

  <g>
    <text x="830" y="152" font-size="20" font-weight="600" fill="#a8321f">Оборот той же карты — формула Б, заполнен 04.02.2026 в 10:45</text>
    <text x="830" y="178" font-size="16" fill="#3b4652">После осмотра тела в ритуальном зале. Графа «осмотр произведён» — надпись «по телу, зал, без карты», строка «пациент» пуста.</text>

    <g fill="#f2e6c8" stroke="#16202b" stroke-width="1.5">
      <rect x="830" y="266" width="34" height="38"/><rect x="870" y="266" width="34" height="38"/><rect x="910" y="266" width="34" height="38"/><rect x="950" y="266" width="34" height="38"/><rect x="990" y="266" width="34" height="38"/><rect x="1030" y="266" width="34" height="38"/><rect x="1070" y="266" width="34" height="38"/><rect x="1110" y="266" width="34" height="38"/><rect x="1150" y="266" width="34" height="38"/><rect x="1190" y="266" width="34" height="38"/><rect x="1230" y="266" width="34" height="38"/><rect x="1270" y="266" width="34" height="38"/><rect x="1310" y="266" width="34" height="38"/><rect x="1350" y="266" width="34" height="38"/><rect x="1390" y="266" width="34" height="38"/><rect x="1430" y="266" width="34" height="38"/>
      <rect x="830" y="330" width="34" height="38"/><rect x="870" y="330" width="34" height="38"/><rect x="910" y="330" width="34" height="38"/><rect x="950" y="330" width="34" height="38"/><rect x="990" y="330" width="34" height="38"/><rect x="1030" y="330" width="34" height="38"/><rect x="1070" y="330" width="34" height="38"/><rect x="1110" y="330" width="34" height="38"/><rect x="1150" y="330" width="34" height="38"/><rect x="1190" y="330" width="34" height="38"/><rect x="1230" y="330" width="34" height="38"/><rect x="1270" y="330" width="34" height="38"/><rect x="1310" y="330" width="34" height="38"/><rect x="1350" y="330" width="34" height="38"/><rect x="1390" y="330" width="34" height="38"/><rect x="1430" y="330" width="34" height="38"/>
    </g>
    <line x1="1147" y1="258" x2="1147" y2="374" stroke="#16202b" stroke-width="2" stroke-dasharray="6 5"/>
    <g font-size="12" fill="#16202b" text-anchor="middle">
      <text x="847" y="290">1.8</text><text x="887" y="290">1.7</text><text x="927" y="290">1.6</text><text x="967" y="290">1.5</text><text x="1007" y="290">1.4</text><text x="1047" y="290">1.3</text><text x="1087" y="290">1.2</text><text x="1127" y="290">1.1</text><text x="1167" y="290">2.1</text><text x="1207" y="290">2.2</text><text x="1247" y="290">2.3</text><text x="1287" y="290">2.4</text><text x="1327" y="290">2.5</text><text x="1367" y="290">2.6</text><text x="1407" y="290">2.7</text><text x="1447" y="290">2.8</text>
      <text x="847" y="354">4.8</text><text x="887" y="354">4.7</text><text x="927" y="354">4.6</text><text x="967" y="354">4.5</text><text x="1007" y="354">4.4</text><text x="1047" y="354">4.3</text><text x="1087" y="354">4.2</text><text x="1127" y="354">4.1</text><text x="1167" y="354">3.1</text><text x="1207" y="354">3.2</text><text x="1247" y="354">3.3</text><text x="1287" y="354">3.4</text><text x="1327" y="354">3.5</text><text x="1367" y="354">3.6</text><text x="1407" y="354">3.7</text><text x="1447" y="354">3.8</text>
    </g>
    <rect x="1266" y="262" width="202" height="46" fill="none" stroke="#2f4258" stroke-width="3"/>
    <text x="1407" y="256" font-size="16" fill="#a8321f" text-anchor="middle">Мост 2.4—2.8</text>
    <path d="M919 274 L941 296 M941 274 L919 296" stroke="#a8321f" stroke-width="3"/>
    <path d="M1399 274 L1421 296 M1421 274 L1399 296" stroke="#a8321f" stroke-width="3"/>
    <circle cx="1367" cy="349" r="9" fill="none" stroke="#e08a2e" stroke-width="3"/>
    <rect x="1116" y="284" width="22" height="12" fill="url(#hatchD12)"/>
    <rect x="1156" y="284" width="22" height="12" fill="url(#hatchD12)"/>

    <g font-size="15" fill="#3b4652">
      <text x="830" y="432">Отсутствуют: 1.6, 2.7. Мост на опорах 2.4 и 2.8.</text>
      <text x="830" y="456">Резцы 1.1 и 2.1 стёрты до шеек, высота 3—4 мм.</text>
      <text x="830" y="480">3.6 — кариозная полость, а не отсутствие зуба.</text>
      <text x="830" y="504">3.7 — своя коронка, амальгамы нет.</text>
      <text x="830" y="528">Прикус прямой. Почерк тот же, нажим ручки иной.</text>
    </g>
  </g>

  <g>
    <text x="60" y="590" font-size="19" font-weight="600" fill="#16202b">Сличение формул: ни одной совпадающей позиции в семи промежуточных зубах</text>
    <line x1="60" y1="602" x2="1540" y2="602" stroke="#8fa3b5" stroke-width="1.5"/>

    <rect x="60" y="616" width="900" height="188" fill="none" stroke="#16202b" stroke-width="2"/>
    <g font-size="16">
      <rect x="60" y="616" width="900" height="34" fill="#33465c"/>
      <text x="76" y="639" fill="#dfe6ea">Позиция</text>
      <text x="300" y="639" fill="#dfe6ea">Формула А, 03.02, 10:40</text>
      <text x="640" y="639" fill="#dfe6ea">Формула Б, 04.02, 10:45</text>

      <text x="76" y="676" fill="#16202b">1.6</text>
      <text x="300" y="676" fill="#3b4652">под мостом 1.5—1.7</text>
      <text x="640" y="676" fill="#a8321f">отсутствует, моста нет</text>

      <text x="76" y="706" fill="#16202b">2.6</text>
      <text x="300" y="706" fill="#a8321f">отсутствует</text>
      <text x="640" y="706" fill="#3b4652">под мостом 2.4—2.8</text>

      <text x="76" y="736" fill="#16202b">3.6</text>
      <text x="300" y="736" fill="#a8321f">отсутствует</text>
      <text x="640" y="736" fill="#3b4652">кариозная полость</text>

      <text x="76" y="766" fill="#16202b">3.7</text>
      <text x="300" y="766" fill="#3b4652">амальгама 4 мм</text>
      <text x="640" y="766" fill="#3b4652">своя коронка, пломбы нет</text>

      <line x1="60" y1="650" x2="960" y2="650" stroke="#8fa3b5" stroke-width="1"/>
      <line x1="60" y1="682" x2="960" y2="682" stroke="#8fa3b5" stroke-width="1"/>
      <line x1="60" y1="712" x2="960" y2="712" stroke="#8fa3b5" stroke-width="1"/>
      <line x1="60" y1="742" x2="960" y2="742" stroke="#8fa3b5" stroke-width="1"/>
      <line x1="286" y1="616" x2="286" y2="804" stroke="#8fa3b5" stroke-width="1"/>
      <line x1="626" y1="616" x2="626" y2="804" stroke="#8fa3b5" stroke-width="1"/>
    </g>

    <rect x="990" y="616" width="550" height="188" fill="none" stroke="#a8321f" stroke-width="2"/>
    <text x="1006" y="644" font-size="17" font-weight="600" fill="#a8321f">Слепки 2019 года спорят с оборотом</text>
    <text x="1006" y="672" font-size="16" fill="#3b4652">Гипсовые модели верхнего и нижнего рядов,</text>
    <text x="1006" y="694" font-size="16" fill="#3b4652">полка 4, ячейка 27, номер ЗК-27 выцарапан</text>
    <text x="1006" y="716" font-size="16" fill="#3b4652">на основании. Ряды повторяют формулу А:</text>
    <text x="1006" y="738" font-size="16" fill="#3b4652">нет 2.6 и 3.6, мост 1.5—1.7, коронки 1.1 и 2.1.</text>
    <text x="1006" y="764" font-size="16" fill="#16202b">Слепки не трогали шесть лет. Значит, неверна</text>
    <text x="1006" y="786" font-size="16" fill="#16202b">запись от 04.02, сделанная в ритуальном зале.</text>

    <text x="60" y="846" font-size="16" fill="#16202b">Заключение 7-СЗЭ: в зале 04.02 и в горелке в 11:40 лежало тело с формулой Б, то есть не Островерхова И. В.</text>
  </g>
</svg>
