<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="gridC12" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridC12)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Камера PO-031: приёмное окно и зал кремации, крематорий «Полынь», 04.02.2026</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">720p, пять кадров в секунду, регистратор в конторе. Камера на стене зала, высота 3,0 м, поле — окно, каталочная площадка, горелка и ширма.</text>

  <g>
    <rect x="60" y="150" width="900" height="420" fill="#c9d4de" stroke="#16202b" stroke-width="3"/>

    <rect x="60" y="150" width="900" height="60" fill="#33465c" stroke="#16202b" stroke-width="3"/>
    <text x="510" y="188" font-size="17" fill="#dfe6ea" text-anchor="middle">Стена зала, камера на высоте 3,0 м</text>
    <circle cx="700" cy="210" r="9" fill="#e08a2e" stroke="#16202b" stroke-width="2"/>
    <text x="722" y="216" font-size="14" fill="#16202b">Поле: окно, площадка, горелка</text>

    <rect x="100" y="210" width="200" height="150" fill="#2f4258" stroke="#16202b" stroke-width="3"/>
    <rect x="120" y="240" width="160" height="70" fill="#8fa3b5" stroke="#16202b" stroke-width="2"/>
    <text x="200" y="284" font-size="16" fill="#16202b" text-anchor="middle">Приёмное окно</text>
    <text x="200" y="336" font-size="15" fill="#3b4652" text-anchor="middle">конторский столик слева</text>
    <text x="200" y="196" font-size="15" fill="#a8321f">Слепая зона: столик у окна</text>

    <rect x="120" y="400" width="180" height="120" fill="none" stroke="#16202b" stroke-width="2"/>
    <text x="210" y="450" font-size="15" fill="#3b4652" text-anchor="middle">Двор,</text>
    <text x="210" y="472" font-size="15" fill="#3b4652" text-anchor="middle">въезд с улицы</text>
    <rect x="132" y="436" width="86" height="30" rx="7" fill="#33465c" stroke="#16202b" stroke-width="2"/>
    <text x="175" y="428" font-size="14" fill="#16202b" text-anchor="middle">ГАЗ-3009 № 71</text>
    <rect x="240" y="486" width="52" height="24" rx="6" fill="#4a6076" stroke="#16202b" stroke-width="2"/>
    <text x="266" y="534" font-size="14" fill="#a8321f" text-anchor="middle">О 092 МН 716</text>

    <g>
      <rect x="360" y="420" width="200" height="48" rx="8" fill="#dfe6ea" stroke="#16202b" stroke-width="3"/>
      <circle cx="392" cy="474" r="10" fill="#16202b"/>
      <circle cx="460" cy="474" r="10" fill="#16202b"/>
      <circle cx="530" cy="474" r="10" fill="#16202b"/>
      <rect x="372" y="428" width="176" height="32" rx="6" fill="#f2e6c8" stroke="#3b4652" stroke-width="1.5"/>
      <text x="460" y="412" font-size="15" fill="#16202b" text-anchor="middle">Каталка, чехол ПХ-Т</text>
    </g>

    <rect x="620" y="300" width="40" height="180" fill="#8fa3b5" stroke="#16202b" stroke-width="3"/>
    <text x="640" y="292" font-size="15" fill="#3b4652" text-anchor="middle">Ширма</text>

    <rect x="700" y="280" width="220" height="230" fill="#3b4652" stroke="#16202b" stroke-width="3"/>
    <rect x="730" y="330" width="160" height="110" rx="10" fill="#16202b" stroke="#16202b" stroke-width="2"/>
    <path d="M740 430 L810 350 L880 430 Z" fill="#a8321f" opacity=".55"/>
    <text x="810" y="318" font-size="17" fill="#dfe6ea" text-anchor="middle">Горелка ПГ-02</text>
    <rect x="700" y="510" width="220" height="40" fill="#2f4258" stroke="#16202b" stroke-width="3"/>
    <text x="810" y="536" font-size="15" fill="#dfe6ea" text-anchor="middle">Ниша загрузки</text>
    <rect x="920" y="300" width="26" height="150" fill="#4a6076" stroke="#16202b" stroke-width="2"/>
    <text x="908" y="292" font-size="14" fill="#3b4652">Дымоход</text>

    <g>
      <rect x="380" y="240" width="150" height="40" fill="#dfe6ea" stroke="#16202b" stroke-width="2"/>
      <line x1="455" y1="240" x2="455" y2="280" stroke="#16202b" stroke-width="1.5"/>
      <text x="455" y="232" font-size="14" fill="#3b4652" text-anchor="middle">Напольные весы</text>
      <text x="455" y="300" font-size="14" fill="#a8321f" text-anchor="middle">прах: 2 640 г и 3 020 г</text>
    </g>

    <rect x="600" y="150" width="360" height="130" fill="none" stroke="#8fa3b5" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="612" y="176" font-size="14" fill="#3b4652">Утренняя каталка: чехол светлый, тугая укладка,</text>
    <text x="612" y="196" font-size="14" fill="#3b4652">по высоте ложа тело небольшое — 74,2 кг</text>
    <text x="612" y="226" font-size="14" fill="#a8321f">Вечерняя каталка: чехол лежит высоко,</text>
    <text x="612" y="246" font-size="14" fill="#a8321f">укладка длинная — тело около 90 кг</text>
  </g>

  <g>
    <text x="1000" y="172" font-size="19" font-weight="600" fill="#16202b">Отметки кадров за 4 февраля</text>
    <line x1="1000" y1="184" x2="1540" y2="184" stroke="#8fa3b5" stroke-width="1.5"/>

    <g font-size="16" fill="#3b4652">
      <text x="1000" y="214">11:05</text>
      <text x="1090" y="214">выдано удостоверение № 4-219 по документу опознания</text>
      <text x="1000" y="244">11:22</text>
      <text x="1090" y="244">ГАЗ-3009 № 71 у ворот; выгружают каталку, двое у кузова</text>
      <text x="1000" y="274">11:28</text>
      <text x="1090" y="274">каталка в окне; Рубец держит лист и сверяет с книжкой</text>
      <text x="1000" y="304">11:34</text>
      <text x="1090" y="304">Рубец показывает через стекло книжку женщине в полупальто</text>
      <text x="1000" y="334">11:40</text>
      <text x="1090" y="334">горелка ПГ-02, цикл 12: 41,8 кубометра газа, до 14:08</text>
      <text x="1000" y="364">14:08</text>
      <text x="1090" y="364">выгрузка праха, контейнер опечатан, 2 640 г</text>
      <text x="1000" y="394">15:40</text>
      <text x="1090" y="394">весы морга: 92,8 кг по бирке М-338, подпись заведующей</text>
      <text x="1000" y="424">15:58</text>
      <text x="1090" y="424">во двор въезжает тёмный легковой, выходит женщина с папкой</text>
      <text x="1000" y="454">16:04</text>
      <text x="1090" y="454">каталку выкатывают без сопровождающих, подпись у окна</text>
      <text x="1000" y="484">16:16</text>
      <text x="1090" y="484">горелка ПГ-02, цикл 17: 52,3 кубометра газа, до 19:14</text>
      <text x="1000" y="514">19:14</text>
      <text x="1090" y="514">второй контейнер, Рубец взвешивает и записывает: 3 020 г</text>
    </g>
    <text x="1000" y="548" font-size="16" fill="#a8321f">Номер 4-219 в журнале один. Тела, прошедшие по нему,</text>
    <text x="1000" y="570" font-size="16" fill="#a8321f">разнятся по газу на 10,5 кубометра и по праху на 380 граммов.</text>

    <rect x="1000" y="592" width="540" height="128" fill="none" stroke="#8fa3b5" stroke-width="1.5"/>
    <text x="1016" y="620" font-size="17" font-weight="600" fill="#16202b">Что видно в кадре 16:04</text>
    <text x="1016" y="646" font-size="16" fill="#3b4652">Лицо женщины читается на двух полукадрах: то же</text>
    <text x="1016" y="668" font-size="16" fill="#3b4652">полупальто, что в тамбуре морга в 21:04 одиннадцатого</text>
    <text x="1016" y="690" font-size="16" fill="#3b4652">числа; машина с «092» и 716 стоит под окном без номеров.</text>
    <text x="1016" y="712" font-size="16" fill="#3b4652">Сопровождающих при выдаче «бесхозного» нет ни одного.</text>
  </g>

  <g>
    <text x="60" y="616" font-size="19" font-weight="600" fill="#16202b">Два цикла одной печи по одному основанию</text>
    <line x1="60" y1="628" x2="960" y2="628" stroke="#8fa3b5" stroke-width="1.5"/>

    <line x1="80" y1="700" x2="940" y2="700" stroke="#16202b" stroke-width="2.5"/>
    <g font-size="15" fill="#3b4652" text-anchor="middle">
      <text x="80" y="734">10:00</text>
      <text x="223" y="734">11:00</text>
      <text x="366" y="734">12:00</text>
      <text x="509" y="734">13:00</text>
      <text x="652" y="734">14:00</text>
      <text x="795" y="734">15:00</text>
      <text x="938" y="734">16:00</text>
    </g>
    <path d="M265 692 L265 708" stroke="#16202b" stroke-width="2"/>
    <path d="M580 692 L580 708" stroke="#16202b" stroke-width="2"/>
    <rect x="265" y="676" width="315" height="16" fill="#a8321f" opacity=".35"/>
    <text x="422" y="668" font-size="15" fill="#a8321f" text-anchor="middle">Цикл 12: 11:40—14:08, 41,8 кубометра, прах 2 640 г</text>

    <line x1="80" y1="806" x2="940" y2="806" stroke="#16202b" stroke-width="2.5"/>
    <path d="M553 798 L553 814" stroke="#16202b" stroke-width="2"/>
    <path d="M867 798 L867 814" stroke="#16202b" stroke-width="2"/>
    <rect x="553" y="782" width="314" height="16" fill="#33465c" opacity=".5"/>
    <text x="710" y="774" font-size="15" fill="#16202b" text-anchor="middle">Цикл 17: 16:16—19:14, 52,3 кубометра, прах 3 020 г</text>

    <text x="60" y="856" font-size="16" fill="#16202b">Файлы за 11:00—19:30 целы, выгрузка снята 18.02.2026 по запросу. Звук регистратором не пишется.</text>
  </g>
</svg>
