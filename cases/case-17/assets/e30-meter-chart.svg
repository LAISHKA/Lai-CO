<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="gE30" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gE30)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="74" font-size="26" font-weight="600" fill="#16202b">Нагрузка линии бокса № 24 за 21.10.2025: выгрузка из архива счётчика</text>
  <text x="60" y="104" font-size="19" fill="#3b4652">ГК «Слип-4», щитовая ряда Б. Выгрузка 25.10.2025, специалист Тимонин А. В. Прибор однофазный электронный, импульсный выход 1600 имп/кВт·ч, архив 400 суток.</text>

  <!-- ============ CHART ============ -->
  <rect x="60" y="140" width="940" height="470" rx="8" fill="#16202b"/>
  <text x="88" y="180" font-size="17" fill="#9fb1c1">КАНАЛ «БОКС 24» · ИМПУЛЬСНЫЙ ВЫХОД 1600 ИМП/КВт·Ч · ОТСЧЁТ 30 МИН</text>

  <!-- grid -->
  <g stroke="#3b4652" stroke-width="1">
    <line x1="120" y1="520" x2="972" y2="520"/>
    <line x1="120" y1="410" x2="972" y2="410" stroke-dasharray="6 6"/>
    <line x1="120" y1="300" x2="972" y2="300" stroke-dasharray="6 6"/>
    <line x1="263" y1="210" x2="263" y2="520" stroke-dasharray="4 8"/>
    <line x1="407" y1="210" x2="407" y2="520" stroke-dasharray="4 8"/>
    <line x1="550" y1="210" x2="550" y2="520" stroke-dasharray="4 8"/>
    <line x1="693" y1="210" x2="693" y2="520" stroke-dasharray="4 8"/>
    <line x1="837" y1="210" x2="837" y2="520" stroke-dasharray="4 8"/>
  </g>
  <g font-size="14" fill="#9fb1c1">
    <text x="112" y="525" text-anchor="end">0</text>
    <text x="112" y="415" text-anchor="end">0,9</text>
    <text x="112" y="305" text-anchor="end">1,8</text>
  </g>

  <!-- load line -->
  <path d="M120 520 H299 V498 H357 V300 H457 V520 H486 V498 H777 V520 H972"
        fill="none" stroke="#e8e2d4" stroke-width="3.5"/>
  <rect x="357" y="300" width="100" height="220" fill="#a8321f" opacity=".22"/>
  <rect x="299" y="498" width="58" height="22" fill="#9fb1c1" opacity=".25"/>
  <rect x="486" y="498" width="291" height="22" fill="#9fb1c1" opacity=".25"/>

  <!-- impulse ticks under kettle -->
  <g stroke="#f4c9bd" stroke-width="2">
    <line x1="364" y1="540" x2="364" y2="552"/><line x1="374" y1="540" x2="374" y2="552"/>
    <line x1="384" y1="540" x2="384" y2="552"/><line x1="394" y1="540" x2="394" y2="552"/>
    <line x1="404" y1="540" x2="404" y2="552"/><line x1="414" y1="540" x2="414" y2="552"/>
    <line x1="424" y1="540" x2="424" y2="552"/><line x1="434" y1="540" x2="434" y2="552"/>
    <line x1="444" y1="540" x2="444" y2="552"/>
  </g>
  <text x="364" y="574" font-size="14" fill="#f4c9bd">импульс каждые 2 с</text>

  <!-- last impulse marker -->
  <line x1="777" y1="212" x2="777" y2="520" stroke="#a8321f" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="777" y="240" font-size="17" fill="#a8321f" text-anchor="middle">20:11:40</text>
  <text x="777" y="262" font-size="14" fill="#a8321f" text-anchor="middle">последний импульс</text>

  <!-- markers -->
  <g stroke="#9fb1c1" stroke-width="1.6" stroke-dasharray="5 5">
    <line x1="299" y1="470" x2="299" y2="520"/>
    <line x1="357" y1="270" x2="357" y2="520"/>
    <line x1="457" y1="270" x2="457" y2="520"/>
    <line x1="486" y1="470" x2="486" y2="520"/>
  </g>
  <text x="299" y="462" font-size="15" fill="#e8e2d4" text-anchor="middle">19:05</text>
  <text x="330" y="330" font-size="15" fill="#e8e2d4">лампа 60 Вт</text>
  <text x="370" y="288" font-size="15" fill="#e8e2d4" text-anchor="middle">19:13</text>
  <text x="407" y="342" font-size="15" fill="#e8e2d4" text-anchor="middle">чайник 1,8 кВт</text>
  <text x="457" y="288" font-size="15" fill="#e8e2d4" text-anchor="middle">19:27</text>
  <text x="486" y="462" font-size="15" fill="#e8e2d4" text-anchor="middle">19:31</text>
  <text x="520" y="440" font-size="15" fill="#f4c9bd">пауза четыре минуты</text>
  <text x="620" y="490" font-size="15" fill="#e8e2d4">лампа</text>

  <!-- axis labels -->
  <g font-size="14" fill="#9fb1c1">
    <text x="120" y="596">18:40</text>
    <text x="263" y="596" text-anchor="middle">19:00</text>
    <text x="407" y="596" text-anchor="middle">19:20</text>
    <text x="550" y="596" text-anchor="middle">19:40</text>
    <text x="693" y="596" text-anchor="middle">20:00</text>
    <text x="837" y="596" text-anchor="middle">20:20</text>
    <text x="972" y="596" text-anchor="end">20:40</text>
  </g>
  <text x="870" y="602" font-size="13" fill="#9fb1c1">время по прибору</text>

  <!-- ============ DAY TABLE ============ -->
  <rect x="1030" y="140" width="510" height="470" rx="8" fill="#f2e6c8" stroke="#16202b" stroke-width="2.5"/>
  <text x="1058" y="182" font-size="19" font-weight="600" fill="#16202b">СУТОЧНЫЕ СРЕЗЫ, ШКАЛА ПРИБОРА</text>
  <line x1="1058" y1="198" x2="1512" y2="198" stroke="#16202b" stroke-width="1.4"/>
  <g font-size="15" fill="#3b4652">
    <text x="1058" y="228">Дата</text>
    <text x="1180" y="228">Интервал нагрузки</text>
    <text x="1392" y="228">КВт·ч</text>
  </g>
  <line x1="1058" y1="242" x2="1512" y2="242" stroke="#3b4652" stroke-width="1.2"/>
  <g font-size="16" fill="#16202b">
    <text x="1058" y="276">19.10</text>
    <text x="1180" y="276">17:44 — 21:02</text>
    <text x="1392" y="276">0,92</text>
    <text x="1180" y="298" font-size="14" fill="#3b4652">лампа и чайник</text>

    <rect x="1050" y="316" width="462" height="76" rx="4" fill="#a8321f" opacity=".18"/>
    <text x="1058" y="344">21.10</text>
    <text x="1180" y="344" fill="#a8321f">19:05 · 19:13—19:27 · до 20:11:40</text>
    <text x="1392" y="344">0,64</text>
    <text x="1180" y="368" font-size="14" fill="#a8321f">лампа, чайник, пауза четыре минуты</text>
    <text x="1058" y="386" font-size="14" fill="#a8321f">розетка не использовалась</text>

    <text x="1058" y="420">20.10</text>
    <text x="1180" y="420">18:12 — 22:31</text>
    <text x="1392" y="420">1,46</text>
    <text x="1180" y="442" font-size="14" fill="#3b4652">лампа, чайник, розетка</text>

    <text x="1058" y="474">22.10</text>
    <text x="1180" y="474">08:55 — 09:40</text>
    <text x="1392" y="474">0,11</text>
    <text x="1180" y="496" font-size="14" fill="#3b4652">лампа при осмотре</text>

    <text x="1058" y="528">23.10</text>
    <text x="1180" y="528">нагрузка не наблюдалась</text>
    <text x="1392" y="528">—</text>
  </g>
  <text x="1058" y="574" font-size="15" fill="#3b4652">Плоская линия после 20:11:40 держится сутки.</text>
  <text x="1058" y="596" font-size="15" fill="#3b4652">Локальный архив прибора — 400 суток.</text>

  <!-- ============ BOTTOM: SCALE ============ -->
  <rect x="60" y="636" width="1480" height="112" rx="6" fill="none" stroke="#a8321f" stroke-width="2"/>
  <text x="88" y="672" font-size="17" font-weight="600" fill="#a8321f">Часы прибора спешат на восемь минут: перевод в поясное время</text>
  <g font-size="16" fill="#16202b">
    <text x="88" y="706">19:05 → 18:57</text>
    <text x="280" y="706">19:13 → 19:05</text>
    <text x="472" y="706">19:27 → 19:19</text>
    <text x="664" y="706">19:31 → 19:23</text>
    <text x="856" y="706" fill="#a8321f" font-weight="600">20:11:40 → 20:03:40</text>
    <text x="1120" y="706" fill="#3b4652">сверка по эталону 05.11.2025</text>
  </g>
  <text x="88" y="734" font-size="15" fill="#3b4652">Чайник в боксе работал 19:05—19:19 по поясному, лампа горела до 20:03:40.</text>

  <rect x="60" y="768" width="1480" height="96" rx="6" fill="none" stroke="#3b4652" stroke-width="1.6"/>
  <text x="88" y="804" font-size="17" font-weight="600" fill="#16202b">Что даёт перевод стрелок</text>
  <text x="88" y="834" font-size="16" fill="#3b4652">После 20:03:40 поясного линия стоит на нуле сутки; 22.10 прибор показал нагрузку только в часы осмотра — 08:55—09:40 по прибору, 23.10 — ноль.</text>
</svg>
