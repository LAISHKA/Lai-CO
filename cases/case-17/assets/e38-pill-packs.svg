    <rect x="1016" y="228" width="168" height="58" rx="4" fill="#f2e6c8" stroke="#16202b" stroke-width="1.6"/>
    <text x="1100" y="252" font-size="15" fill="#16202b" text-anchor="middle">Метиглюкон 850 мг</text>
    <text x="1100" y="274" font-size="15" fill="#a8321f" text-anchor="middle">№ 60</text>
    <g fill="#c9d4de" stroke="#16202b" stroke-width="1.4">
      <ellipse cx="1040" cy="392" rx="13" ry="9"/><ellipse cx="1074" cy="392" rx="13" ry="9"/>
      <ellipse cx="1108" cy="392" rx="13" ry="9"/><ellipse cx="1142" cy="392" rx="13" ry="9"/>
      <ellipse cx="1056" cy="418" rx="13" ry="9"/><ellipse cx="1090" cy="418" rx="13" ry="9"/>
      <ellipse cx="1124" cy="418" rx="13" ry="9"/>
    </g>
    <text x="1100" y="446" font-size="15" fill="#a8321f" text-anchor="middle">в банке 22 таблетки</text>

    <ellipse cx="1250" cy="470" rx="52" ry="18" fill="#f2e6c8" stroke="#16202b" stroke-width="2"/>
    <text x="1250" y="474" font-size="12" fill="#3b4652" text-anchor="middle">на донышке пластырь</text>
    <text x="1320" y="252" font-size="16" fill="#16202b">Крышка отвинчена,</text>
    <text x="1320" y="276" font-size="16" fill="#16202b">лежала рядом</text>
    <text x="1320" y="312" font-size="16" fill="#16202b">Пластырь на донышке:</text>
    <text x="1320" y="336" font-size="16" fill="#16202b">«д. Авдей, утром и вечером»</text>
    <text x="1320" y="372" font-size="16" fill="#3b4652">Смыв с крышки направлен</text>
    <text x="1320" y="396" font-size="16" fill="#3b4652">на химию, пакет № 7</text>
  </g>

