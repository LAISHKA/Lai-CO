      <ellipse cx="177" cy="353" rx="13" ry="9"/>
    </g>
    <text x="80" y="400" font-size="15" fill="#a8321f">26 ячеек из 30 пусты</text>
    <text x="80" y="424" font-size="15" fill="#3b4652">в четырёх — целые таблетки</text>
    <text x="80" y="446" font-size="15" fill="#3b4652">серия 4112, срок 07.2027</text>
  </g>

  <!-- ================= PACK 2 ================= -->
  <g>
    <rect x="350" y="150" width="270" height="300" rx="8" fill="#f2e6c8" stroke="#16202b" stroke-width="2.5"/>
