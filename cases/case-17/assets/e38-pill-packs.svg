    <text x="540" y="814" font-size="15" fill="#3b4652" text-anchor="middle">совпадают форма, фаска</text>
    <text x="540" y="836" font-size="15" fill="#3b4652" text-anchor="middle">и тиснёный знак</text>
  </g>
  <text x="700" y="718" font-size="30" fill="#3b4652" text-anchor="middle">≠</text>
  <g>
    <circle cx="810" cy="712" r="50" fill="#e8e2d4" stroke="#16202b" stroke-width="3"/>
    <path d="M770 712 H850" stroke="#16202b" stroke-width="3"/>
    <text x="810" y="694" font-size="18" fill="#16202b" text-anchor="middle">850</text>
    <text x="810" y="790" font-size="15" fill="#16202b" text-anchor="middle">контроль: домашняя</text>
    <text x="810" y="814" font-size="15" fill="#3b4652" text-anchor="middle">круглая, плоская, риска,</text>
    <text x="810" y="836" font-size="15" fill="#3b4652" text-anchor="middle">знак «850»</text>
  </g>

