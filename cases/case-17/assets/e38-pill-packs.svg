      <ellipse cx="397" cy="251" rx="12" ry="8"/><ellipse cx="432" cy="251" rx="12" ry="8"/><ellipse cx="467" cy="251" rx="12" ry="8"/><ellipse cx="502" cy="251" rx="12" ry="8"/><ellipse cx="537" cy="251" rx="12" ry="8"/><ellipse cx="572" cy="251" rx="12" ry="8"/>
      <ellipse cx="397" cy="285" rx="12" ry="8"/><ellipse cx="432" cy="285" rx="12" ry="8"/><ellipse cx="467" cy="285" rx="12" ry="8"/><ellipse cx="502" cy="285" rx="12" ry="8"/><ellipse cx="537" cy="285" rx="12" ry="8"/><ellipse cx="572" cy="285" rx="12" ry="8"/>
      <ellipse cx="397" cy="319" rx="12" ry="8"/><ellipse cx="432" cy="319" rx="12" ry="8"/><ellipse cx="467" cy="319" rx="12" ry="8"/><ellipse cx="502" cy="319" rx="12" ry="8"/><ellipse cx="537" cy="319" rx="12" ry="8"/><ellipse cx="572" cy="319" rx="12" ry="8"/>
      <ellipse cx="397" cy="353" rx="12" ry="8"/><ellipse cx="432" cy="353" rx="12" ry="8"/><ellipse cx="467" cy="353" rx="12" ry="8"/><ellipse cx="502" cy="353" rx="12" ry="8"/><ellipse cx="537" cy="353" rx="12" ry="8"/><ellipse cx="572" cy="353" rx="12" ry="8"/>
