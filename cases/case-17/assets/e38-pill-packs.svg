  <text x="436" y="506" font-size="16" font-weight="600" fill="#a8321f">Дата на оттиске и в кассовой выгрузке — 21.10.2025</text>
  <text x="436" y="534" font-size="15" fill="#3b4652">Чек № 6014 от 18:36:12, три упаковки «Реглипон 30 мг № 30»,</text>
  <text x="436" y="556" font-size="15" fill="#3b4652">оплата корпоративной картой водителя серия К 14 № 0773</text>

  <!-- ================= JAR ================= -->
  <g>
    <rect x="960" y="150" width="580" height="416" rx="8" fill="#c9d4de" stroke="#16202b" stroke-width="2.5" opacity=".45"/>
