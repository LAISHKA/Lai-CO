  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="74" font-size="26" font-weight="600" fill="#16202b">Изъятое: три упаковки «Реглипон 30 мг № 30» и банка из бокса № 24</text>
  <text x="60" y="104" font-size="19" fill="#3b4652">Фотофиксация 27.10.2025 в 16:20, специалист-криминалист, кадр 41 из 68. Упаковки подняты 22.10.2025 в 16:05 из бардачка К 108 НВ 716; банка изъята в боксе № 24.</text>

  <!-- ================= PACK 1 ================= -->
  <g>
    <rect x="60" y="150" width="270" height="300" rx="8" fill="#f2e6c8" stroke="#a8321f" stroke-width="3"/>
    <text x="80" y="182" font-size="16" font-weight="600" fill="#a8321f">Упаковка 1 · блистер вскрыт</text>
    <!-- blister 6x5 -->
    <rect x="90" y="200" width="210" height="170" rx="4" fill="none" stroke="#16202b" stroke-width="2"/>
    <path d="M125 200 V370 M160 200 V370 M195 200 V370 M230 200 V370 M265 200 V370
             M90 234 H300 M90 268 H300 M90 302 H300 M90 336 H300" stroke="#3b4652" stroke-width="1"/>
    <rect x="90" y="200" width="210" height="136" fill="#a8321f" opacity=".16"/>
    <rect x="90" y="336" width="70" height="34" fill="#a8321f" opacity=".16"/>
    <g fill="#c9d4de" stroke="#16202b" stroke-width="1.6">
