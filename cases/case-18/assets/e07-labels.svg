<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <title>Бирки лотка: две новые наклеены поверх старой, под углом читается конец строки старой бирки</title>
  <defs>
    <pattern id="gridLab18" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridLab18)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="74" font-size="26" font-weight="600" fill="#16202b">Бирки лотков партии 17-С: что наклеено и что под этим лежит</text>
  <text x="60" y="104" font-size="18" fill="#3b4652">Съёмка 19.07.2026 в 12:20, склад на Каширной, 14. Бирка 60 × 40 мм, масштаб 1:5. На каждом лотке две бирки: верхняя — продуктовая, нижняя — логистическая.</text>

  <g>
    <text x="60" y="152" font-size="19" font-weight="600" fill="#16202b">Лоток № 5, боковая стенка</text>
    <rect x="60" y="168" width="600" height="600" fill="#f3efe4" stroke="#16202b" stroke-width="2.5"/>

    <rect x="130" y="252" width="470" height="430" fill="#e8e2d4" stroke="#16202b" stroke-width="1.4" stroke-dasharray="8 5"/>
    <text x="142" y="244" font-size="14" fill="#a8321f">контур старой бирки, напечатана 17.07 в 01:22:10</text>
    <text x="142" y="286" font-size="15" font-weight="600" fill="#a8321f">…выработка 17.07.2026 01:2…</text>
    <text x="142" y="662" font-size="15" font-weight="600" fill="#a8321f">…камеры 17.07.2026 08:…</text>

    <rect x="150" y="310" width="420" height="180" fill="#e8e2d4" stroke="#16202b" stroke-width="1.8"/>
    <text x="166" y="344" font-size="17" font-weight="600" fill="#16202b">ПАШТЕТ «ПЕЧЁНОЧНЫЙ»</text>
    <text x="166" y="374" font-size="16" fill="#16202b">выработка 16.07.2026 21:40</text>
    <text x="166" y="400" font-size="16" fill="#16202b">годен до 18.07.2026 03:40</text>
    <text x="166" y="426" font-size="16" fill="#16202b">партия 17-С, лоток 5 из 6</text>
    <text x="166" y="456" font-size="14" fill="#3b4652">масса нетто 12,0 кг</text>

    <rect x="150" y="520" width="420" height="130" fill="#e8e2d4" stroke="#16202b" stroke-width="1.8"/>
    <text x="166" y="556" font-size="17" font-weight="600" fill="#16202b">ПАРТИЯ 17-С</text>
    <text x="166" y="586" font-size="16" fill="#16202b">выход из камеры</text>
    <text x="166" y="612" font-size="16" fill="#16202b">17.07.2026 03:00</text>

    <path d="M570 310 L472 310 L570 402 Z" fill="#a8321f" opacity=".16" stroke="#a8321f" stroke-width="1.4"/>
    <path d="M472 310 L570 402" stroke="#16202b" stroke-width="1.6"/>
    <text x="584" y="700" font-size="14" fill="#a8321f">верхний правый угол</text>
    <text x="584" y="720" font-size="14" fill="#a8321f">оттопырен на 6 мм</text>
    <path d="M500 356 L566 322" stroke="#a8321f" stroke-width="1.2"/>
    <path d="M150 490h420" stroke="#a8321f" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="300" y="506" font-size="13" fill="#a8321f">валик второго слоя клея</text>
  </g>

  <g>
    <text x="700" y="152" font-size="19" font-weight="600" fill="#16202b">Разрез наклеенного пакета</text>
    <g stroke="#16202b" stroke-width="1.6">
      <rect x="700" y="220" width="560" height="30" fill="#e8e2d4"/>
      <rect x="700" y="250" width="560" height="22" fill="#a8321f" opacity=".25"/>
      <rect x="700" y="272" width="560" height="30" fill="#e8e2d4"/>
      <rect x="700" y="302" width="560" height="22" fill="#a8321f" opacity=".25"/>
      <rect x="700" y="324" width="560" height="34" fill="#cfc7b3"/>
    </g>
    <text x="1272" y="240" font-size="15" fill="#16202b">новая бирка, печать 07:12:41</text>
    <text x="1272" y="266" font-size="15" fill="#a8321f">второй клеевой слой, валик по краю</text>
    <text x="1272" y="292" font-size="15" fill="#16202b">старая бирка, печать 01:22:10</text>
    <text x="1272" y="318" font-size="15" fill="#a8321f">первый клеевой слой</text>
    <text x="1272" y="346" font-size="15" fill="#16202b">стенка лотка</text>
    <g stroke="#3b4652" stroke-width="1.2">
      <path d="M1260 235h12"/>
      <path d="M1260 261h12"/>
      <path d="M1260 287h12"/>
      <path d="M1260 313h12"/>
      <path d="M1260 341h12"/>
    </g>
    <text x="700" y="390" font-size="15" fill="#3b4652">Клей верхней бирки не растворил нижнюю: строки старой печати читаются под углом,</text>
    <text x="700" y="412" font-size="15" fill="#3b4652">краска на обоих слоях термотрансферная одна и та же, следы ролля принтера совпадают</text>
    <text x="700" y="434" font-size="15" fill="#3b4652">с распечаткой, извлечённой из лотка замятия.</text>
  </g>

  <g>
    <text x="700" y="500" font-size="19" font-weight="600" fill="#16202b">Пересчёт наклеек по логу принтера</text>
    <rect x="700" y="516" width="840" height="150" fill="#f3efe4" stroke="#16202b" stroke-width="1.4"/>
    <text x="716" y="548" font-size="16" fill="#16202b">Лотков в партии 6, на каждом лотке две бирки — на комплект нужно 12.</text>
    <text x="716" y="578" font-size="16" fill="#16202b">Ночная печать 17.07 в 01:22:10 — один лист, 6 наклеек: «выработка 17.07.2026 01:20, годен до 07:20».</text>
    <text x="716" y="608" font-size="16" fill="#a8321f">Утренняя печать 17.07 в 07:12:41 — два листа, 12 наклеек: верхняя «выработка 16.07.2026 21:40,</text>
    <text x="716" y="634" font-size="16" fill="#a8321f">годен до 03:40», нижняя «выход из камеры 17.07.2026 03:00». Старая бирка несла обе строки вместе.</text>
  </g>

  <g>
    <text x="700" y="716" font-size="19" font-weight="600" fill="#16202b">Итог осмотра шести лотков</text>
    <rect x="700" y="732" width="840" height="150" fill="#f3efe4" stroke="#16202b" stroke-width="1.4"/>
    <text x="716" y="764" font-size="16" fill="#16202b">Второй клеевой слой — на всех шести лотках; оттопыренный край 3—7 мм — на четырёх.</text>
    <text x="716" y="792" font-size="16" fill="#16202b">Нижняя строка читается под углом на лотках № 5 и № 2.</text>
    <text x="716" y="820" font-size="16" fill="#16202b">Регламент, пункт 8: перепечатка бирки — по акту комиссии, на лотке один клеевой слой.</text>
    <text x="716" y="848" font-size="16" fill="#a8321f">Акта комиссии на партию 17-С среди документов цеха нет.</text>
  </g>
</svg>
