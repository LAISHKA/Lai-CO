<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <title>Три графика чипов термостатов термосумок на одной шкале температур за вечер 17.07</title>
  <defs>
    <pattern id="gridChip18" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridChip18)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="74" font-size="26" font-weight="600" fill="#16202b">Чипы термостатов трёх термосумок, вечер 17.07.2026</text>
  <text x="60" y="104" font-size="18" fill="#3b4652">Выгрузка с сервера Сервиса «Терра-Курьер» от 19.07. Шаг записи пять минут, память чипа автономная. По горизонтали минуты с 16:50 до 19:40, по вертикали температура внутри сумки от нуля до плюс 16.</text>

  <rect x="200" y="535" width="1190" height="150" fill="#a8321f" opacity=".08"/>

  <g stroke="#16202b" stroke-width="1.6" fill="none">
    <path d="M200 160V760H1390"/>
  </g>
  <g stroke="#3b4652" stroke-width="0.8" opacity=".45">
    <path d="M200 722H1390M200 647H1390M200 572H1390M200 497H1390M200 422H1390M200 347H1390M200 272H1390M200 197H1390"/>
  </g>
  <g font-size="15" fill="#3b4652">
    <text x="152" y="766">0</text>
    <text x="128" y="690">+2,0</text>
    <text x="128" y="615">+4,0</text>
    <text x="128" y="540">+6,0</text>
    <text x="128" y="465">+8,0</text>
    <text x="124" y="390">+10,0</text>
    <text x="124" y="315">+12,0</text>
    <text x="124" y="240">+14,0</text>
    <text x="124" y="165">+16,0</text>
  </g>
  <path d="M200 535H1390" stroke="#a8321f" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1150" y="524" font-size="15" font-weight="600" fill="#a8321f">норма сервиса: не выше плюс 6,0</text>
  <path d="M200 610H1390" stroke="#3b4652" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="1150" y="600" font-size="14" fill="#3b4652">уставка плюс 4,0, коридор плюс 2 — плюс 6</text>

  <g font-size="14" fill="#3b4652">
    <text x="192" y="792">16:50</text>
    <text x="402" y="792">17:20</text>
    <text x="612" y="792">17:50</text>
    <text x="822" y="792">18:20</text>
    <text x="1032" y="792">18:50</text>
    <text x="1242" y="792">19:20</text>
    <text x="1340" y="792">19:40</text>
  </g>

  <polyline points="284,633 319,655 354,640 382,640" fill="none" stroke="#16202b" stroke-width="3"/>
  <polyline points="403,616 438,604 473,592 508,586 578,592 648,598 718,604 788,610 858,613 928,616 998,619 1068,622 1138,625 1208,628 1278,631 1348,634 1390,636" fill="none" stroke="#16202b" stroke-width="3"/>
  <polyline points="592,644 648,634 676,634" fill="none" stroke="#a8321f" stroke-width="3"/>
  <polyline points="704,612 739,600 774,590 809,584 844,586 914,592 984,598 1054,604 1124,607 1194,610 1264,613 1334,616 1390,618" fill="none" stroke="#a8321f" stroke-width="3"/>
  <polyline points="1054,626 1089,616 1124,608 1152,608" fill="none" stroke="#3b4652" stroke-width="3" stroke-dasharray="12 6"/>
  <polyline points="1180,550 1215,558 1250,566 1285,574 1320,580 1355,586 1390,590" fill="none" stroke="#3b4652" stroke-width="3" stroke-dasharray="12 6"/>

  <g stroke="#a8321f" stroke-width="2" fill="none">
    <path d="M382 620V186"/>
    <path d="M676 614V186"/>
    <path d="M1152 596V186"/>
  </g>
  <g fill="#a8321f">
    <path d="M382 168l-9 22h18z"/>
    <path d="M676 168l-9 22h18z"/>
    <path d="M1152 168l-9 22h18z"/>
  </g>
  <g font-size="14" fill="#a8321f">
    <text x="240" y="152">сумка № 12 открыта 17:16, закрыта 17:19</text>
    <text x="540" y="132">сумка № 7 открыта 17:58, закрыта 18:02</text>
    <text x="966" y="152">сумка № 3 открыта 19:06, закрыта 19:10</text>
  </g>

  <text x="222" y="702" font-size="14" fill="#3b4652">Утро: нулевая строка записи с 07:30 — хладоэлементы всех трёх сумок на зарядке в пункте выдачи.</text>
  <text x="222" y="726" font-size="14" fill="#3b4652">Открывание крышки даёт метку события и провал трассы на одну—две десятки градуса: стрелка уходит за верх шкалы.</text>
  <text x="222" y="750" font-size="14" fill="#a8321f">Закрытые промежутки: от плюс 2,8 до плюс 5,6, выходов за плюс 6,0 за вечер ни одного.</text>

  <g>
    <text x="60" y="836" font-size="16" font-weight="600" fill="#16202b">Три сумки за вечер</text>
    <text x="240" y="836" font-size="15" fill="#16202b">№ 12 — закрыта 17:02, минимум плюс 2,8 в 17:07, вручение заказа Д-402 в 17:20</text>
    <text x="900" y="836" font-size="15" fill="#16202b">№ 7 — закрыта 17:46, вручение заказа Д-418 в 18:05</text>
    <text x="240" y="862" font-size="15" fill="#16202b">№ 3 — закрыта 18:52, максимум плюс 5,6 сразу после открывания 19:06, вручение заказа Д-431 в 19:12</text>
    <text x="900" y="862" font-size="15" fill="#a8321f">Рейс целиком — 1 час 44 минуты, три открывания, по одному на адрес</text>
  </g>

  <g>
    <rect x="1420" y="160" width="160" height="180" fill="#f3efe4" stroke="#16202b" stroke-width="1.4"/>
    <text x="1432" y="188" font-size="15" font-weight="600" fill="#16202b">Прибор</text>
    <text x="1432" y="214" font-size="13" fill="#3b4652">чип термостата</text>
    <text x="1432" y="234" font-size="13" fill="#3b4652">термосумки,</text>
    <text x="1432" y="254" font-size="13" fill="#3b4652">шаг пять минут,</text>
    <text x="1432" y="274" font-size="13" fill="#3b4652">память автономная,</text>
    <text x="1432" y="294" font-size="13" fill="#3b4652">34 строки на сумку</text>
    <text x="1432" y="322" font-size="13" fill="#a8321f">метка открывания</text>
  </g>
</svg>
