<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <title>Кадр регистратора тамбура с отметкой 07:13:06 и лента СКУД по трём дверям за сутки</title>
  <defs>
    <pattern id="gridTamb18" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#gridTamb18)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="74" font-size="26" font-weight="600" fill="#16202b">Канал 4 и лента СКУД: девятнадцать минут у принтера бирок</text>
  <text x="60" y="104" font-size="18" fill="#3b4652">Пакет № 11, выемка 21.07.2026 из шкафа охраны. Регистратор «Стерег-8», два канала, архив за 31 сутки, восемь кадров в секунду, часы автономные.</text>

  <g>
    <rect x="60" y="140" width="700" height="470" fill="#16202b" stroke="#16202b" stroke-width="3"/>
    <g stroke="#e8e2d4" stroke-width="2" fill="none" opacity=".7">
      <path d="M60 520H760"/>
      <path d="M470 140V520"/>
      <rect x="500" y="300" width="200" height="220"/>
    </g>
    <rect x="530" y="330" width="140" height="70" fill="#3b4652" stroke="#e8e2d4" stroke-width="1.6"/>
    <text x="536" y="424" font-size="14" fill="#e8e2d4">полка принтера бирок</text>
    <g>
      <circle cx="392" cy="326" r="26" fill="#e8e2d4"/>
      <rect x="352" y="356" width="84" height="110" rx="20" fill="#3b4652" stroke="#e8e2d4" stroke-width="2"/>
      <rect x="382" y="358" width="22" height="86" fill="#e8e2d4" opacity=".85"/>
      <rect x="358" y="462" width="30" height="58" fill="#3b4652" stroke="#e8e2d4" stroke-width="1.6"/>
      <rect x="400" y="462" width="30" height="58" fill="#3b4652" stroke="#e8e2d4" stroke-width="1.6"/>
      <path d="M436 382L518 366" stroke="#3b4652" stroke-width="18" stroke-linecap="round"/>
      <circle cx="524" cy="364" r="11" fill="#e8e2d4"/>
    </g>
    <path d="M352 372L252 282" stroke="#a8321f" stroke-width="1.4"/>
    <text x="76" y="272" font-size="14" fill="#a8321f">куртка без нашивок, под ней светлая рубашка</text>
    <path d="M524 350L596 268" stroke="#a8321f" stroke-width="1.4"/>
    <text x="480" y="256" font-size="14" fill="#a8321f">правая рука на крышке лотка</text>
    <text x="76" y="182" font-size="22" font-weight="600" fill="#a8321f">17.07.2026 07:13:06</text>
    <text x="76" y="210" font-size="15" fill="#e8e2d4">канал 4 · тамбур камеры хранения № 2 · архив 31 сутки</text>
    <text x="76" y="580" font-size="15" fill="#e8e2d4">Стоит спиной и левым боком к оптике. Лица вечерней смены нет ни в одном кадре.</text>
    <text x="76" y="556" font-size="15" fill="#e8e2d4">На полу тамбура посторонних предметов не видно, свет верхний, дверь камеры закрыта.</text>
  </g>

  <g>
    <text x="60" y="656" font-size="19" font-weight="600" fill="#16202b">Что даёт разбор кадра</text>
    <g stroke="#16202b" stroke-width="1.2" fill="none">
      <path d="M300 356l120-60"/>
      <path d="M300 420l150-60"/>
    </g>
    <rect x="60" y="672" width="700" height="212" fill="#f3efe4" stroke="#16202b" stroke-width="1.4"/>
    <text x="76" y="704" font-size="15" fill="#16202b">Рост по кадру 180—184 см, лицом к полке, правая рука на крышке лотка принтера.</text>
    <text x="76" y="732" font-size="15" fill="#16202b">Тёмная куртка без нашивок поверх светлой рубашки; правая рука на крышке лотка принтера.</text>
    <text x="76" y="760" font-size="15" fill="#16202b">Дверь камеры № 2 в эти девятнадцать минут остаётся закрытой: человек работает у полки.</text>
    <text x="76" y="788" font-size="15" fill="#a8321f">Отметка 07:13:06 снята в 07:12:41 по сетевому времени: регистратор отстаёт ровно на 25 секунд.</text>
    <text x="76" y="816" font-size="15" fill="#a8321f">В ту же секунду лог принтера зафиксировал печать двух листов — двенадцати наклеек.</text>
    <text x="76" y="844" font-size="15" fill="#3b4652">Сверка: справка наладчика Овчинникова от 20.07 и журнал сетевой синхронизации, расхождение 0 секунд.</text>
  </g>

  <g>
    <text x="800" y="164" font-size="19" font-weight="600" fill="#16202b">Лента СКУД за 16—17.07, три двери</text>
    <rect x="800" y="180" width="740" height="430" fill="#f3efe4" stroke="#16202b" stroke-width="1.6"/>
    <g stroke="#3b4652" stroke-width="1" opacity=".5">
      <path d="M800 240H1540M800 292H1540M800 344H1540M800 396H1540M800 448H1540M800 500H1540M800 552H1540"/>
    </g>
    <g font-size="15">
      <text x="816" y="222" fill="#a8321f" font-weight="600">16.07 22:13:58</text>
      <text x="1010" y="222" fill="#16202b">дверь склада, выход смены</text>
      <text x="1400" y="222" fill="#3b4652">карта —</text>
      <text x="816" y="274" fill="#a8321f" font-weight="600">17.07 06:55:12</text>
      <text x="1010" y="274" fill="#16202b">дверь склада, вход</text>
      <text x="1400" y="274" fill="#16202b">карта 305</text>
      <text x="816" y="326" fill="#a8321f" font-weight="600">17.07 07:05:41</text>
      <text x="1010" y="326" fill="#16202b">тамбур, вход</text>
      <text x="1400" y="326" fill="#16202b">карта 305</text>
      <text x="816" y="378" fill="#a8321f" font-weight="600">17.07 07:24:52</text>
      <text x="1010" y="378" fill="#16202b">тамбур, выход</text>
      <text x="1400" y="378" fill="#16202b">карта 305</text>
      <text x="816" y="430" fill="#a8321f" font-weight="600">17.07 08:15:07</text>
      <text x="1010" y="430" fill="#16202b">дверь склада, вход</text>
      <text x="1400" y="430" fill="#16202b">карта 412</text>
      <text x="816" y="482" fill="#a8321f" font-weight="600">17.07 08:40:00</text>
      <text x="1010" y="482" fill="#16202b">камера № 2, вынос лотков — строка датчика</text>
      <text x="1372" y="482" fill="#3b4652">не СКУД</text>
      <text x="816" y="534" fill="#a8321f" font-weight="600">17.07 09:02:19</text>
      <text x="1010" y="534" fill="#16202b">дверь склада, вход</text>
      <text x="1400" y="534" fill="#16202b">карта 233</text>
    </g>
    <rect x="806" y="306" width="728" height="40" fill="none" stroke="#a8321f" stroke-width="2"/>
    <rect x="806" y="358" width="728" height="40" fill="none" stroke="#a8321f" stroke-width="2"/>
  </g>

  <g>
    <text x="800" y="656" font-size="19" font-weight="600" fill="#16202b">Кому принадлежат карты</text>
    <rect x="800" y="672" width="740" height="212" fill="#f3efe4" stroke="#16202b" stroke-width="1.4"/>
    <text x="816" y="704" font-size="15" fill="#16202b">305 — Тетерин Август Вениаминович, начальник производства. 412 — Балыкова Дарья Ефимовна, заведующая складом.</text>
    <text x="816" y="732" font-size="15" fill="#16202b">233 — Шулепенко Пётр Аркадьевич, слесарь-холодильщик. 216 — Салтыков Вадим Демьянович, директор. 148 — лаборант Сарычев.</text>
    <text x="816" y="760" font-size="15" fill="#a8321f">По тамбуру за 17.07 ровно один вход и ровно один выход, обе — карта 305: 07:05:41 и 07:24:52, девятнадцать минут внутри.</text>
    <text x="816" y="788" font-size="15" fill="#16202b">Карта 412 в тамбур не заходила: её первый вход на склад — 08:15:07, через 50 минут после выхода карты 305.</text>
    <text x="816" y="816" font-size="15" fill="#16202b">Дверь камеры № 2 в 07:05—07:25 не открывалась: единственный сигнал по этой двери — 08:40.</text>
    <text x="816" y="844" font-size="15" fill="#3b4652">Следующая строка ленты после выхода карты 305 — только 08:15:07; журнал датчиков двери камеры: 22:14 и 08:40.</text>
  </g>
</svg>
