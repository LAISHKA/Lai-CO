  <text x="60" y="76" font-size="26" font-weight="600" style="fill:var(--paper-ink,#16202b)">Камера «Ц-3»: пролёт от чана № 2 к тамбуру мойки, семь меток ленты</text>
  <text x="60" y="106" font-size="19" style="fill:var(--fg-dim,#3b4652)">Схема к копии архива от 14.03, 14:00. Лента от 22:45 до 00:07. Поле кадра — 14 метров настила: кромка чана № 2, пролёт, тамбур «ЦМТ-2», угол щита ЩМ-3.</text>

