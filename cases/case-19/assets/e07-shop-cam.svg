    <text x="88" y="184" font-size="15" fill="#8fa3b5">Камера «Ц-3», варочный цех, поворотная, фиксирована на пролёт</text>
    <text x="940" y="500" font-size="14" fill="#7e8b98">шкала в кадре — поясное время регистратора</text>
  </g>

  <g>
    <rect x="1270" y="134" width="270" height="392" rx="8" fill="none" style="stroke:var(--paper-ink,#16202b)" stroke-width="1.6"/>
    <text x="1288" y="168" font-size="18" font-weight="600" style="fill:var(--paper-ink,#16202b)">Паспорт ленты</text>
    <g font-size="15" style="fill:var(--fg-dim,#3b4652)">
      <text x="1288" y="204">Архив регистратора — 24 часа.</text>
      <text x="1288" y="228">Копии семи меток сняты</text>
      <text x="1288" y="248">14.03 в 14:00.</text>
      <text x="1288" y="286">Шкала — поясное время,</text>
      <text x="1288" y="306">сверка с контроллером</text>
      <text x="1288" y="326">мойки не проводилась.</text>
      <text x="1288" y="364">Высота дверцы тамбура</text>
      <text x="1288" y="384">в кадре — 2,05 метра.</text>
      <text x="1288" y="422">Фигура у борта чана № 2</text>
      <text x="1288" y="442">по разметке проёма —</text>
      <text x="1288" y="462">165—168 сантиметров.</text>
      <text x="1288" y="500">В пролёте свет платформы</text>
      <text x="1288" y="520">гаснет целиком, без вспышек.</text>
    </g>
  </g>

