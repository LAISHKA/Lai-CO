<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid1919" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".14"/>
    </pattern>
    <marker id="arr1919" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e08a2e"/>
    </marker>
    <marker id="arr1919b" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#e08a2e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" style="fill:var(--paper,#e8e2d4)"/>
  <rect width="1600" height="900" fill="url(#grid1919)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" style="stroke:var(--paper-ink,#16202b)" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" style="fill:var(--paper-ink,#16202b)">Экран терминала поста охраны: журнал узла «С-07» и кадр видеосопровождения</text>
  <text x="60" y="106" font-size="19" style="fill:var(--fg-dim,#3b4652)">Схема к снимку экрана, сделанному 14.03 в 11:05. Разрешение низкое, строки читаемы. Левое окно — список событий узла, правое — кадр камеры двора на 19:40:31.</text>

  <rect x="60" y="136" width="1480" height="620" rx="10" fill="#1b2430" style="stroke:var(--paper-ink,#16202b)" stroke-width="2.5"/>
  <rect x="76" y="152" width="1448" height="588" rx="6" fill="#111a22"/>

  <g>
    <rect x="96" y="176" width="620" height="540" rx="6" fill="#1e2a36" stroke="#4d5f70" stroke-width="1.6"/>
    <rect x="96" y="176" width="620" height="44" rx="6" fill="#2c3c4c"/>
    <text x="116" y="205" font-size="18" font-weight="600" fill="#dfe6ea">Терминал СКУД павильона — узел «С-07»</text>
    <text x="612" y="205" font-size="15" fill="#8fa3b5">фильтр: 06.03</text>

    <g font-size="14" fill="#7f909f">
      <text x="118" y="252">время</text>
      <text x="266" y="252">событие</text>
      <text x="466" y="252">карта</text>
      <text x="570" y="252">кому выдана</text>
    </g>
    <path d="M112 264h588" stroke="#4d5f70" stroke-width="1.2"/>

    <circle cx="106" cy="294" r="5" fill="#54d17a"/>
    <g font-size="17" fill="#dfe6ea">
      <text x="118" y="300">06.03 19:40:07</text>
      <text x="266" y="300">замок витрины открыт</text>
      <text x="466" y="300">Б-11</text>
      <text x="570" y="300">Лопушок</text>
    </g>

    <circle cx="106" cy="338" r="5" fill="#8fa3b5"/>
    <g font-size="17" fill="#dfe6ea">
      <text x="118" y="344">06.03 19:51:33</text>
      <text x="266" y="344">замок витрины закрыт</text>
      <text x="466" y="344">—</text>
      <text x="570" y="344">не указано</text>
    </g>

    <circle cx="106" cy="382" r="5" fill="#8fa3b5"/>
    <g font-size="17" fill="#dfe6ea">
      <text x="118" y="388">основание выдачи</text>
    </g>
    <rect x="266" y="372" width="196" height="24" fill="none" stroke="#a8321f" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="474" y="390" font-size="14" style="fill:#e08a2e">пусто</text>

    <path d="M112 412h588" stroke="#4d5f70" stroke-width="1" opacity=".7"/>

    <g font-size="15" fill="#9fb0c0">
      <text x="118" y="446">Строк в списке — три. Узел «С-07» — замок витрины стенда № 7.</text>
      <text x="118" y="474">Часы терминала отстают на 14 секунд, сверял администратор.</text>
      <text x="118" y="502">За март по этому узлу других открываний в списке нет.</text>
    </g>

    <rect x="112" y="524" width="588" height="168" rx="5" fill="#16202a" stroke="#4d5f70" stroke-width="1.2"/>
    <text x="128" y="552" font-size="15" fill="#7f909f">строка фильтра</text>
    <text x="128" y="582" font-size="17" fill="#dfe6ea">«С-07»   06.03.2026 — 13.03.2026</text>
    <text x="128" y="620" font-size="15" fill="#7f909f">печать терминала, 14.03, 11:05</text>
    <text x="128" y="648" font-size="15" fill="#8fa3b5">рядом на столе — распечатка журнала узла за март</text>
  </g>

  <g>
    <rect x="736" y="176" width="768" height="540" rx="6" fill="#0f1720" stroke="#4d5f70" stroke-width="1.6"/>
    <text x="756" y="205" font-size="16" font-weight="600" fill="#dfe6ea">Кадр видеосопровождения — камера двора, 19:40:31</text>

    <rect x="756" y="220" width="728" height="352" fill="#232f3b"/>
    <rect x="756" y="220" width="728" height="46" fill="#2b3947"/>
    <text x="770" y="250" font-size="14" fill="#9fb0c0">номер камеры — двор, наложение: 06.03 19:40:31</text>

    <g>
      <rect x="756" y="286" width="86" height="216" fill="#1a242f" stroke="#7e8b98" stroke-width="1.8"/>
      <path d="M756 286h86" stroke="#a8b6c4" stroke-width="2"/>
      <text x="762" y="320" font-size="13" fill="#9fb0c0">угол</text>
      <text x="762" y="336" font-size="13" fill="#9fb0c0">стенда № 14</text>
      <rect x="768" y="356" width="58" height="76" fill="#c9c0a8" opacity=".35"/>
    </g>

    <g>
      <path d="M892 502v-92a26 26 0 0 1 52 0v92z" fill="#33404e"/>
      <circle cx="918" cy="396" r="22" fill="#33404e"/>
      <path d="M944 452l26 16" stroke="#33404e" stroke-width="13" stroke-linecap="round"/>
      <text x="866" y="530" font-size="13" fill="#8fa3b5">вторая фигура: к витрине спиной,</text>
      <text x="866" y="548" font-size="13" fill="#8fa3b5">лицом к двери, на полголовы ниже</text>
    </g>

    <g>
      <rect x="1040" y="286" width="320" height="216" fill="#1a242f" stroke="#8fa3b5" stroke-width="2"/>
      <path d="M1040 286h320M1040 502h320" stroke="#a8b6c4" stroke-width="2.4"/>
      <g stroke="#5d6f80" stroke-width="1.2" opacity=".8">
        <path d="M1146 286v216M1252 286v216"/>
      </g>
      <rect x="1064" y="330" width="66" height="94" fill="#d8d0bc" opacity=".5"/>
      <rect x="1176" y="342" width="50" height="70" fill="#c9c0a8" opacity=".38"/>
      <text x="1048" y="272" font-size="14" fill="#9fb0c0">витрина стенда № 7, «Хмелина», заявка № 07</text>
      <rect x="1366" y="380" width="26" height="30" rx="4" fill="#3d4c5c" stroke="#a8b6c4" stroke-width="1.4"/>
      <text x="1352" y="432" font-size="13" fill="#8fa3b5">щеколда</text>
    </g>

    <g>
      <path d="M1338 502v-108a30 30 0 0 1 60 0v108z" fill="#2f4a7a"/>
      <circle cx="1368" cy="380" r="26" fill="#2f4a7a"/>
      <path d="M1360 356a26 26 0 0 1 34 18l-10 4z" fill="#263d66"/>
      <path d="M1396 414l28-24" stroke="#2f4a7a" stroke-width="17" stroke-linecap="round"/>
      <path d="M1424 390l8-6" stroke="#c9b79b" stroke-width="9" stroke-linecap="round"/>
      <text x="1256" y="530" font-size="13" fill="#e08a2e">правая рука поднята на уровень щеколды,</text>
      <text x="1256" y="548" font-size="13" fill="#e08a2e">лицо вне кадра, капюшон на спине</text>
    </g>

    <g>
      <path d="M962 490h360" stroke="#e08a2e" stroke-width="1.6" marker-start="url(#arr1919b)" marker-end="url(#arr1919)"/>
      <text x="1092" y="482" font-size="13" fill="#e08a2e">три шага по техпроходу</text>
    </g>

    <g>
      <path d="M1464 268v234" stroke="#dfe6ea" stroke-width="1.4" stroke-dasharray="7 6"/>
      <g stroke="#dfe6ea" stroke-width="1.4">
        <path d="M1458 270h12M1458 328h12M1458 386h12M1458 444h12M1458 498h12"/>
      </g>
      <text x="1420" y="258" font-size="13" fill="#dfe6ea">разметка проёма</text>
      <path d="M1400 380h48" stroke="#a8321f" stroke-width="1.4" stroke-dasharray="4 4"/>
      <text x="1408" y="370" font-size="13" style="fill:#e08a2e">около 180 см</text>
    </g>

    <g font-size="14" fill="#8fa3b5">
      <text x="756" y="596">Куртка тёмная, синеватая в вечернем свете; силуэт снят со спины и чуть сбоку.</text>
      <text x="756" y="622">Рост определён по разметке дверного проёма, масштабной линейки в кадре нет.</text>
      <text x="756" y="648">Слева в кадре — угол стенда № 14 с набором «Пятилеток», права — дверь со двора.</text>
      <text x="756" y="674">Между фигурами — пустой техпроход, на настиле следов обуви в этом кадре не видно.</text>
    </g>
  </g>

  <text x="60" y="800" font-size="17" style="fill:var(--fg-dim,#3b4652)">Экран снят телефоном сотрудника на посту охраны; левое окно — список событий узла «С-07», правое — кадр видеосопровождения к той же минуте.</text>
  <text x="60" y="836" font-size="17" style="fill:var(--fg-dim,#3b4652)">Три строки списка: открывание замка витрины по карте Б-11, закрывание без карты и незаполненное поле основания выдачи.</text>
</svg>
