  <text x="104" y="632" font-size="15" fill="#8fa3b5">служебная строка прибора</text>
  <text x="104" y="660" font-size="17" fill="#c9d4de">образ сохранён в архив отпечатков, запись 07:59:41 / 08:00:07 / 08:00:22 · оператор сеанса 4-77</text>

  <g>
    <text x="1110" y="176" font-size="18" font-weight="600" fill="#16202b">Что сверяет глаз на копии</text>
    <g font-size="15" fill="#3b4652">
      <text x="1110" y="206">Три окна образа справа относятся к строкам</text>
      <text x="1110" y="228">41, 42 и 43. Рисунок папиллярных линий</text>
      <text x="1110" y="250">во всех трёх окнах один и тот же:</text>
      <text x="1110" y="272">дельта слева, общий счётчик минутных</text>
      <text x="1110" y="294">точек 71, обрыв линии в верхней трети</text>
      <text x="1110" y="316">на одном и том же месте.</text>
      <text x="1110" y="352">Строки 41—43 прибор ведёт в режиме</text>
      <text x="1110" y="374">«ЯВКА ПО ЖЕТОНУ», графа сверки</text>
      <text x="1110" y="396">по ним заполняется служебным текстом</text>
      <text x="1110" y="418">«не проверялось».</text>
      <text x="1110" y="454">Соседние строки 39, 40 и 44 проведены</text>
      <text x="1110" y="476">сверкой с шаблоном; у строки 44 сеанс</text>
      <text x="1110" y="498">ведёт табельный 4-102.</text>
