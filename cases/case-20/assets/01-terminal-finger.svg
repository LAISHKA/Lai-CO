  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Экран терминала явки «ТЯ-4М» на съёмке 19.04 в 11:42</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Режим «Просмотр архива», участок выборки 07:58:00 — 08:04:16. Съёмка экрана специалистом связи, копия заверена понятыми.</text>
