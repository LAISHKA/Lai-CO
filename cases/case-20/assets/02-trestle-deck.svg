  <rect x="1080" y="330" width="60" height="370" fill="#ded7c6" stroke="#16202b" stroke-width="3"/>
  <rect x="640" y="330" width="56" height="370" fill="#ded7c6" stroke="#16202b" stroke-width="2.4"/>
