  <text x="640" y="838" font-size="13" fill="#3b4652">60 см от края настила до концов фала</text>

  <line x1="60" y1="858" x2="1540" y2="858" stroke="none"/>

  <g>
    <text x="1290" y="606" font-size="17" font-weight="600" fill="#16202b">Пачка № 7</text>
    <g font-size="14" fill="#3b4652">
      <text x="1290" y="632">доска ёловая</text>
