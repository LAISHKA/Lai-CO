  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Эстакада выгрузки с торца: настил, проём ограждения, пачка № 7</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Фиксация тахиметрической съёмкой 19.04 в 08:55. Туман, видимость 60 м, температура +3 градуса, настил сухой.</text>

  <rect x="120" y="700" width="1180" height="46" fill="#ded7c6" stroke="#16202b" stroke-width="2.5"/>
