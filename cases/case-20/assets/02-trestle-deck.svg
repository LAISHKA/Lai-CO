  <g transform="translate(1010 700) rotate(20)">
    <path d="M0 0 C 22 -8 46 -6 58 4 C 66 12 64 26 52 30 C 34 36 10 32 2 22 C -4 14 -6 4 0 0 Z" fill="none" stroke="#a8321f" stroke-width="2.4"/>
