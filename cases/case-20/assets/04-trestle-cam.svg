<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid20d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="pile20d" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M0 0V16" stroke="#8a7a5c" stroke-width="1.5" opacity=".7"/>
    </pattern>
    <pattern id="deck20d" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <path d="M0 0V18" stroke="#5c7286" stroke-width="1.1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid20d)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Камера № 4 «Эстакада выгрузки»: кадр с отметками событий движения</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Регистратор № 2 пульта ООО «Ярлесхолдинг», файл 1904-0438, запись сегментами по 5—18 секунд. Метки времени наносит архиватор пульта.</text>

  <rect x="70" y="140" width="1010" height="520" rx="8" fill="#16202b"/>
  <rect x="86" y="156" width="978" height="488" fill="#243444"/>

  <rect x="86" y="156" width="978" height="32" fill="#2f4258"/>
  <text x="100" y="179" font-size="15" fill="#c9d4de">КАНАЛ 4 · ДВИЖЕНИЕ · 12 кадров в секунду · микрофона нет</text>
  <text x="1050" y="179" font-size="15" fill="#c9d4de" text-anchor="end">ИК-ПОДСВЕТКА</text>

  <rect x="86" y="470" width="978" height="52" fill="url(#deck20d)" stroke="#8fa3b5" stroke-width="2"/>
  <text x="100" y="510" font-size="14" fill="#c9d4de">настил эстакады, правый край кадра</text>

  <rect x="120" y="300" width="150" height="170" fill="url(#pile20d)" stroke="#8fa3b5" stroke-width="2"/>
  <text x="126" y="292" font-size="14" fill="#c9d4de">бурт № 9 за левым краем</text>

  <rect x="900" y="300" width="26" height="170" fill="#2f4258" stroke="#8fa3b5" stroke-width="1.8"/>
  <g stroke="#c9d4de" stroke-width="1.2">
    <path d="M900 320 h 12 M900 344 h 20 M900 368 h 12 M900 392 h 20 M900 416 h 12 M900 440 h 20 M900 464 h 12"/>
  </g>
  <text x="926" y="316" font-size="13" fill="#c9d4de">разметка стойки,</text>
  <text x="926" y="332" font-size="13" fill="#c9d4de">сантиметры</text>
  <rect x="936" y="424" width="66" height="46" fill="#1d2b38" stroke="#8fa3b5" stroke-width="1.6"/>
  <g fill="#e08a2e">
    <circle cx="954" cy="440" r="6"/>
    <circle cx="978" cy="440" r="6"/>
  </g>
  <text x="936" y="486" font-size="13" fill="#c9d4de">пульт лебёдки</text>

  <rect x="700" y="416" width="120" height="54" fill="#3b4c60" stroke="#c9d4de" stroke-width="2" transform="rotate(-12 760 443)"/>
  <text x="676" y="404" font-size="13" fill="#c9d4de">пачка № 7 у правого края</text>

  <g>
    <circle cx="946" cy="410" r="17" fill="#a8321f"/>
    <text x="946" y="416" font-size="16" font-weight="700" fill="#e8e2d4" text-anchor="middle">1</text>
    <g fill="#c9d4de">
      <circle cx="920" cy="374" r="9"/>
      <path d="M920 384 v 22 M912 392 h 16"/>
    </g>
    <path d="M924 392 l 18 -6" stroke="#e08a2e" stroke-width="3"/>
    <text x="812" y="556" font-size="13" fill="#e08a2e">в руке предмет около 30 см</text>
  </g>

  <g>
    <circle cx="620" cy="392" r="17" fill="#a8321f"/>
    <text x="620" y="398" font-size="16" font-weight="700" fill="#e8e2d4" text-anchor="middle">2</text>
    <g fill="#c9d4de">
      <circle cx="590" cy="352" r="9"/>
      <path d="M590 362 v 30 M580 372 h 20 M590 392 l -8 22 M590 392 l 8 22"/>
      <circle cx="646" cy="364" r="9"/>
      <path d="M646 374 v 26 M636 382 h 20 M646 400 l -7 18 M646 400 l 7 18"/>
    </g>
    <text x="536" y="342" font-size="13" fill="#c9d4de">186 см</text>
    <text x="662" y="354" font-size="13" fill="#c9d4de">172 см</text>
    <path d="M598 344 q 8 -10 18 -2" fill="none" stroke="#c9d4de" stroke-width="1.6"/>
    <text x="500" y="556" font-size="13" fill="#c9d4de">один в куртке с капюшоном</text>
  </g>

  <g>
    <circle cx="770" cy="368" r="17" fill="#a8321f"/>
    <text x="770" y="374" font-size="16" font-weight="700" fill="#e8e2d4" text-anchor="middle">3</text>
    <path d="M744 470 L 716 596" stroke="#e08a2e" stroke-width="2.6" stroke-dasharray="9 6"/>
    <text x="600" y="622" font-size="13" fill="#e08a2e">один уходит за край настила</text>
  </g>

  <g>
    <circle cx="860" cy="560" r="17" fill="#a8321f"/>
    <text x="860" y="566" font-size="16" font-weight="700" fill="#e8e2d4" text-anchor="middle">4</text>
    <path d="M840 500 L 812 596" stroke="#c9d4de" stroke-width="2.6" stroke-dasharray="9 6"/>
    <path d="M792 470 q 26 -14 52 0" fill="none" stroke="#8fa3b5" stroke-width="1.6"/>
    <text x="700" y="660" font-size="13" fill="#c9d4de">тент лебёдки распускается</text>
  </g>

  <g>
    <text x="1110" y="176" font-size="18" font-weight="600" fill="#16202b">Отметки на схеме</text>
    <g font-size="15" fill="#3b4652">
      <text x="1110" y="206">1 — 04:41:07. Человек спиной у стойки</text>
      <text x="1110" y="228">пульта, правая рука на уровне настила.</text>
      <text x="1110" y="250">Куртка цвета хаки, стёганые брюки,</text>
      <text x="1110" y="272">ботинки с рантом.</text>
      <text x="1110" y="306">2 — 05:26:33. На настил поднимаются</text>
      <text x="1110" y="328">двое: 186 и 172 сантиметра по</text>
      <text x="1110" y="350">разметке стойки.</text>
      <text x="1110" y="384">3 — 05:36:04. Пачка № 7 приходит</text>
      <text x="1110" y="406">в движение, один из двоих уходит</text>
      <text x="1110" y="428">за край настила.</text>
      <text x="1110" y="462">4 — 05:36:19. Второй падает следом,</text>
      <text x="1110" y="484">тент лебёдки распускается.</text>
    </g>
  </g>

  <g>
    <text x="1110" y="530" font-size="18" font-weight="600" fill="#16202b">Что кадр не даёт</text>
    <g font-size="15" fill="#3b4652">
      <text x="1110" y="560">Спуск в кювет за периметром не виден:</text>
      <text x="1110" y="582">съёмка с торца эстакады.</text>
      <text x="1110" y="614">За 80 минут записано 9 событий;</text>
      <text x="1110" y="636">между сегментами прибор пишет</text>
      <text x="1110" y="658">«кадр пустой».</text>
    </g>
  </g>

  <line x1="60" y1="700" x2="1060" y2="700" stroke="#16202b" stroke-width="2"/>

  <g>
    <text x="60" y="740" font-size="18" font-weight="600" fill="#16202b">Локальные признаки по кадрам 04:42:30 и 05:38:02</text>
    <g font-size="15" fill="#3b4652">
      <text x="60" y="770">Длина шага по двум кадрам — 64 сантиметра, левая стопа развёрнута наружу на 20 градусов.</text>
      <text x="60" y="792">В 05:38:02 у края настила стоит человек в светлой куртке, смотрит вниз, руки опущены.</text>
      <text x="60" y="814">В 05:51:20 в кадр заходит погрузчик и разворачивается к кювету за периметром.</text>
    </g>
  </g>

  <g>
    <text x="820" y="740" font-size="18" font-weight="600" fill="#16202b">Смежные каналы</text>
    <g font-size="15" fill="#3b4652">
      <text x="820" y="770">№ 2 «бурт № 9» и № 6 «ворота» в эту ночь</text>
      <text x="820" y="792">обесточены мастерской; третий кадр-событие</text>
      <text x="820" y="814">у правого края настила отсутствует.</text>
    </g>
  </g>
</svg>
