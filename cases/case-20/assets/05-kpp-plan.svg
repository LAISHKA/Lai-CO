<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid20e" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5c7286" stroke-width="0.6" opacity=".16"/>
    </pattern>
    <pattern id="fence20" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 0L14 14 M14 0L0 14" stroke="#16202b" stroke-width="0.9" opacity=".8"/>
    </pattern>
    <pattern id="pile20e" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M0 0V16" stroke="#8a7a5c" stroke-width="1.5" opacity=".7"/>
    </pattern>
    <marker id="arr20e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a8321f"/>
    </marker>
    <marker id="dim20e" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 2 L10 5 L0 8 Z" fill="#3b4652"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#e8e2d4"/>
  <rect width="1600" height="900" fill="url(#grid20e)"/>
  <rect x="18" y="18" width="1564" height="864" fill="none" stroke="#16202b" stroke-width="2.5"/>

  <text x="60" y="76" font-size="26" font-weight="600" fill="#16202b">Узел КПП: ворота, весовая, эстакада и семь отметок проезда за ночь</text>
  <text x="60" y="106" font-size="19" fill="#3b4652">Камера № 1 «Внешний рубеж» над комнатой КПП, регистратор колонии, время сетевое. Туман с 22:20 держал видимость на уровне 60 метров.</text>

  <text x="120" y="176" font-size="16" fill="#3b4652">ФКУ УИИ-7, внутри периметра</text>
  <text x="700" y="176" font-size="16" fill="#3b4652">ООО «Ярлесхолдинг», за периметром</text>

  <rect x="520" y="200" width="18" height="470" fill="url(#fence20)" stroke="#16202b" stroke-width="2"/>
  <text x="470" y="694" font-size="14" fill="#16202b">ограждение, зона 4</text>
  <g stroke="#16202b" stroke-width="4" fill="none">
    <path d="M520 396 V470" stroke="#e8e2d4" stroke-width="10"/>
    <path d="M520 402 V418"/>
    <path d="M520 452 V468"/>
  </g>
  <text x="546" y="392" font-size="15" font-weight="600" fill="#16202b">ворота</text>
  <g stroke="#a8321f" stroke-width="4">
    <path d="M540 442 H606"/>
  </g>
  <text x="546" y="466" font-size="13" fill="#a8321f">шлагбаум опущен</text>

  <rect x="300" y="220" width="180" height="110" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
  <text x="316" y="250" font-size="14" fill="#16202b">общежитие № 2</text>
  <circle cx="336" cy="336" r="10" fill="#3b4652"/>
  <text x="352" y="342" font-size="13" fill="#3b4652">терминал явки в тамбуре</text>

  <rect x="320" y="400" width="150" height="90" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
  <text x="334" y="428" font-size="14" fill="#16202b">комната КПП</text>
  <text x="334" y="448" font-size="13" fill="#3b4652">дежурный Былинский</text>
  <circle cx="395" cy="388" r="9" fill="#16202b"/>
  <text x="410" y="384" font-size="13" fill="#16202b">камера № 1</text>

  <rect x="300" y="530" width="170" height="90" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
  <text x="316" y="560" font-size="14" fill="#16202b">комната конвоя</text>
  <text x="316" y="580" font-size="13" fill="#3b4652">аппарат узла 4-Л</text>

  <path d="M395 388 L 1000 216 M395 388 L 1000 470" stroke="#5c7286" stroke-width="1.4" stroke-dasharray="4 6"/>
  <path d="M412 372 A 620 620 0 0 1 996 220" fill="none" stroke="#5c7286" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="700" y="252" font-size="14" fill="#5c7286">дальней 60 метров объекты не различимы</text>

  <rect x="640" y="404" width="140" height="70" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
  <text x="654" y="432" font-size="14" fill="#16202b">весовая станция</text>
  <text x="654" y="452" font-size="13" fill="#3b4652">журнал весов В-2</text>
  <g stroke="#3b4652" stroke-width="1.6" fill="none">
    <path d="M540 500 H700" marker-start="url(#dim20e)" marker-end="url(#dim20e)"/>
  </g>
  <text x="576" y="522" font-size="14" fill="#3b4652">40 м</text>

  <rect x="860" y="250" width="180" height="120" fill="url(#pile20e)" stroke="#16202b" stroke-width="2.4"/>
  <text x="866" y="242" font-size="14" fill="#16202b">бурт № 9</text>

  <rect x="1120" y="256" width="230" height="40" fill="#ded7c6" stroke="#16202b" stroke-width="2.6"/>
  <text x="1126" y="248" font-size="14" fill="#16202b">эстакада выгрузки, настил 4,6 м</text>
  <rect x="1120" y="330" width="120" height="70" fill="#ded7c6" stroke="#16202b" stroke-width="2.2"/>
  <text x="1128" y="358" font-size="13" fill="#3b4652">складской навес</text>
  <rect x="1270" y="330" width="90" height="70" fill="#ded7c6" stroke="#16202b" stroke-width="2.2"/>
  <text x="1278" y="358" font-size="13" fill="#3b4652">бытовка</text>

  <path d="M1120 470 H1420" stroke="#3b4652" stroke-width="14" opacity=".35"/>
  <text x="1126" y="452" font-size="13" fill="#3b4652">поворот эстакады</text>
  <path d="M1500 200 V690" stroke="#3b4652" stroke-width="16" opacity=".35"/>
  <text x="1466" y="676" font-size="14" fill="#3b4652">шоссе</text>
  <path d="M1420 560 L1500 520" stroke="#3b4652" stroke-width="10" opacity=".35"/>
  <text x="1290" y="600" font-size="13" fill="#3b4652">съезд предприятия</text>

  <path d="M560 216 q 220 20 380 120" fill="none" stroke="#a8321f" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#arr20e)"/>
  <path d="M620 560 q 200 -40 340 -80" fill="none" stroke="#a8321f" stroke-width="2.4" stroke-dasharray="10 7" marker-end="url(#arr20e)"/>

  <g>
    <circle cx="566" cy="424" r="16" fill="#a8321f"/>
    <text x="566" y="430" font-size="15" font-weight="700" fill="#e8e2d4" text-anchor="middle">1</text>
    <circle cx="566" cy="486" r="16" fill="#a8321f"/>
    <text x="566" y="492" font-size="15" font-weight="700" fill="#e8e2d4" text-anchor="middle">2</text>
    <circle cx="716" cy="356" r="16" fill="#a8321f"/>
    <text x="716" y="362" font-size="15" font-weight="700" fill="#e8e2d4" text-anchor="middle">3</text>
    <circle cx="660" cy="552" r="16" fill="#a8321f"/>
    <text x="660" y="558" font-size="15" font-weight="700" fill="#e8e2d4" text-anchor="middle">4</text>
    <circle cx="884" cy="446" r="16" fill="#a8321f"/>
    <text x="884" y="452" font-size="15" font-weight="700" fill="#e8e2d4" text-anchor="middle">5</text>
    <circle cx="1058" cy="520" r="16" fill="#a8321f"/>
    <text x="1058" y="526" font-size="15" font-weight="700" fill="#e8e2d4" text-anchor="middle">6</text>
    <circle cx="760" cy="620" r="16" fill="#a8321f"/>
    <text x="760" y="626" font-size="15" font-weight="700" fill="#e8e2d4" text-anchor="middle">7</text>
  </g>

  <line x1="60" y1="706" x2="1540" y2="706" stroke="#16202b" stroke-width="2"/>

  <g>
    <text x="60" y="744" font-size="18" font-weight="600" fill="#16202b">Отметки проезда по архиву камеры</text>
    <g font-size="14" fill="#3b4652">
      <text x="60" y="770">1 — 22:47:10, «Н 452 ЕС 716» выходит к весовой, тент поднят на пядь, две пачки.</text>
      <text x="60" y="790">2 — 23:15:04, «О 319 ХК 716» выходит на объезд периметра, в кабине один силуэт.</text>
      <text x="60" y="810">3 — 00:58:51, та же фура возвращается порожняком, задние ворота расстёгнуты.</text>
      <text x="60" y="830">4 — 03:11:20, фура наружу, у заднего борта силуэт в светлой куртке, 178 см.</text>
      <text x="60" y="850">5 — 03:26:44, возврат со стороны поворота эстакады к складскому навесу.</text>
    </g>
  </g>

  <g>
    <text x="820" y="744" font-size="18" font-weight="600" fill="#16202b">Отметки проезда, продолжение</text>
    <g font-size="14" fill="#3b4652">
      <text x="820" y="770">6 — 04:11:08, гружёный борт проходит весовую к съезду предприятия; ворота</text>
      <text x="820" y="790">заперты, шлагбаум опущен, в кабине два силуэта.</text>
      <text x="820" y="810">7 — 05:47:33, фура встаёт у весовой порожняком, один силуэт; параллельно</text>
      <text x="820" y="830">за периметр уходит пеший силуэт 176 см в капюшоне.</text>
      <text x="820" y="850">Сверху кадра: 06:02:19 — погрузчик, разворот к канаве, фары выключены.</text>
    </g>
  </g>
</svg>
